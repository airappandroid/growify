<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AFG vs ZIM - Live Match Center</title>
    <style>
        :root {
            --bg: #090d16;
            --card: #111827;
            --nested: #182234;
            --border: #1e293b;
            --cyan: #38bdf8;
            --blue: #2563eb;
            --live: #ef4444;
            --green: #10b981;
            --text: #ffffff;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 8px 10px;
        }

        .match-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Top Nav Bar */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .nav-btn {
            background: var(--nested);
            border: 1px solid var(--border);
            width: 34px;
            height: 34px;
            border-radius: 9px;
            display: grid;
            place-items: center;
            cursor: pointer;
            color: #fff;
        }

        .nav-btn svg {
            width: 16px;
            height: 16px;
            fill: #fff;
        }

        .page-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        /* Match Header Card */
        .header-card {
            background: linear-gradient(145deg, #182234, #101726);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
        }

        .series-info {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
        }

        .status-pill {
            align-self: center;
            font-size: 10.5px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            background: #1e293b;
            color: var(--muted);
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .status-pill.live {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .status-pill.completed {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ef4444;
            display: inline-block;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Main Scoreboard Arena */
        .scoreboard-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
            background: var(--nested);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 12px;
        }

        .team-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6px;
        }

        .team-flag {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            background: #1e293b;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
        }

        .team-name {
            font-size: 14px;
            font-weight: 700;
        }

        .team-score-big {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
        }

        .team-overs {
            font-size: 11px;
            color: var(--cyan);
            font-weight: 600;
        }

        .vs-divider {
            font-size: 12px;
            font-weight: 800;
            color: var(--muted);
            background: var(--card);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
        }

        /* Announcement & Note */
        .announcement-box {
            background: rgba(56, 189, 248, 0.08);
            border: 1px dashed #1e3a5f;
            border-radius: 10px;
            padding: 10px;
            font-size: 11.5px;
            color: #cbd5e1;
            text-align: center;
            line-height: 1.4;
        }

        /* Match Stats Matrix */
        .stats-matrix {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-item {
            background: var(--nested);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 6px;
            text-align: center;
        }

        .stat-label {
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .stat-value {
            font-size: 12.5px;
            font-weight: 700;
            color: #fff;
        }

        /* Audio Commentary Button */
        .audio-bar {
            background: linear-gradient(135deg, #1e3a5f, var(--nested));
            border: 1px solid var(--cyan);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .audio-bar:active {
            transform: scale(0.985);
        }

        .audio-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mic-icon-circle {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(56, 189, 248, 0.2);
            display: grid;
            place-items: center;
        }

        .mic-icon-circle svg {
            width: 17px;
            height: 17px;
            fill: var(--cyan);
        }

        .audio-text h4 {
            font-size: 13px;
            font-weight: 700;
        }

        .audio-text p {
            font-size: 10.5px;
            color: var(--cyan);
        }

        .audio-tag {
            background: var(--cyan);
            color: #000;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <main class="match-container">
        <!-- Top Nav -->
        <header class="top-nav">
            <button class="nav-btn" onclick="history.back()" aria-label="Go Back">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <div class="page-title" id="page-title">AFG vs ZIM</div>
            <button class="nav-btn" onclick="fetchLiveMatchDetails()" aria-label="Refresh">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
        </header>

        <!-- Match Header Info -->
        <section class="header-card">
            <div class="series-info" id="series-name">ODI Tri-Nation Series 2026 • Final</div>
            <div class="status-pill" id="status-pill">Loading...</div>
        </section>

        <!-- Scoreboard Grid -->
        <section class="scoreboard-grid">
            <!-- Afghanistan (Team A) -->
            <div class="team-column">
                <img id="teamA-logo" class="team-flag" src="https://ik.imagekit.io/sqt8ptw1k/afghanistan.webp?updatedAt=1790568292618" alt="AFG" onerror="this.outerHTML='<div class=\\'team-flag\\'>AFG</div>'">
                <div class="team-name" id="teamA-name">AFG</div>
                <div class="team-score-big" id="teamA-score">-</div>
                <div class="team-overs" id="teamA-overs">0.0 ov</div>
            </div>

            <!-- VS Divider -->
            <div class="vs-divider">VS</div>

            <!-- Zimbabwe (Team B) -->
            <div class="team-column">
                <img id="teamB-logo" class="team-flag" src="https://ik.imagekit.io/sqt8ptw1k/zimbabwe.webp?updatedAt=1789455540523" alt="ZIM" onerror="this.outerHTML='<div class=\\'team-flag\\'>ZIM</div>'">
                <div class="team-name" id="teamB-name">ZIM</div>
                <div class="team-score-big" id="teamB-score">-</div>
                <div class="team-overs" id="teamB-overs">0.0 ov</div>
            </div>
        </section>

        <!-- Announcement / Toss / Summary -->
        <div class="announcement-box" id="announcement-text">
            Connecting to live match feed...
        </div>

        <!-- Real-Time Metrics Matrix -->
        <section class="stats-matrix">
            <div class="stat-item">
                <div class="stat-label">Format</div>
                <div class="stat-value" id="stat-format">ODI</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Current RR</div>
                <div class="stat-value" id="stat-crr">-</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Req. RR</div>
                <div class="stat-value" id="stat-rrr">-</div>
            </div>
        </section>

        <!-- Commentary Capsule Action -->
        <div class="audio-bar" onclick="location.href='go:commentary'">
            <div class="audio-content">
                <div class="mic-icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </div>
                <div class="audio-text">
                    <h4>Live Commentary</h4>
                    <p>Ball-by-ball audio stream</p>
                </div>
            </div>
            <div class="audio-tag">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="#000"><path d="M8 5v14l11-7z"/></svg>
                Listen
            </div>
        </div>
    </main>

    <script>
        const MATCH_ID = "6abf701d1c313bb3df5a1a79";
        const API_URL = `https://api.cricradio.com.au/api/v2/match/mini-match-card?matchId=${MATCH_ID}`;

        const DEFAULT_FLAGS = {
            afg: "https://ik.imagekit.io/sqt8ptw1k/afghanistan.webp?updatedAt=1790568292618",
            zim: "https://ik.imagekit.io/sqt8ptw1k/zimbabwe.webp?updatedAt=1789455540523"
        };

        async function fetchLiveMatchDetails() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error("Network response was not ok");

                const json = await response.json();
                const res = json?.responseData?.result;

                if (!res) return;

                // ১. মেচৰ স্থিতি (Match Status)
                const statusPill = document.getElementById("status-pill");
                const rawStatus = (res.status || "").toLowerCase();

                if (rawStatus.includes("live") || rawStatus.includes("inprogress") || rawStatus.includes("running")) {
                    statusPill.className = "status-pill live";
                    statusPill.innerHTML = `<span class="live-dot"></span> LIVE`;
                } else if (rawStatus.includes("complete") || rawStatus.includes("finish") || rawStatus.includes("won")) {
                    statusPill.className = "status-pill completed";
                    statusPill.textContent = "COMPLETED";
                } else {
                    statusPill.className = "status-pill";
                    statusPill.textContent = "UPCOMING";
                }

                // ২. দলৰ নাম আৰু স্ক'ৰ (Team A & B)
                if (res.teams) {
                    // Team A (Afghanistan)
                    if (res.teams.a) {
                        const tA = res.teams.a;
                        document.getElementById("teamA-name").textContent = tA.shortName || tA.name || "AFG";
                        
                        const scoreA = tA.score || (tA.runs !== undefined ? `${tA.runs}${tA.wickets !== undefined ? '/' + tA.wickets : ''}` : "Yet to bat");
                        document.getElementById("teamA-score").textContent = scoreA;

                        const oversA = tA.overs || tA.over || res.settingObj?.teamAOver || 0;
                        document.getElementById("teamA-overs").textContent = `${oversA} ov`;
                    }

                    // Team B (Zimbabwe)
                    if (res.teams.b) {
                        const tB = res.teams.b;
                        document.getElementById("teamB-name").textContent = tB.shortName || tB.name || "ZIM";

                        const scoreB = tB.score || (tB.runs !== undefined ? `${tB.runs}${tB.wickets !== undefined ? '/' + tB.wickets : ''}` : "Yet to bat");
                        document.getElementById("teamB-score").textContent = scoreB;

                        const oversB = tB.overs || tB.over || res.settingObj?.teamBOver || 0;
                        document.getElementById("teamB-overs").textContent = `${oversB} ov`;
                    }
                }

                // ৩. ঘোষণা বা মেচৰ বাৰ্তা (Announcement / Summary)
                const annText = document.getElementById("announcement-text");
                if (res.announcement1) {
                    annText.textContent = res.announcement1;
                } else if (rawStatus.includes("notstarted")) {
                    annText.textContent = "Match has not started yet. Stay tuned for the toss and live score updates! 🏏";
                } else {
                    annText.textContent = "Match in progress • Ball-by-ball real-time commentary enabled";
                }

                // ৪. মেট্ৰিক্স (Format, Run Rate, RRR)
                if (res.format) {
                    document.getElementById("stat-format").textContent = res.format.toUpperCase();
                }
                document.getElementById("stat-crr").textContent = res.now?.run_rate ? res.now.run_rate : "-";
                document.getElementById("stat-rrr").textContent = res.now?.req_run_rate ? res.now.req_run_rate : "-";

            } catch (err) {
                console.warn("Match details fetch error: ", err);
                document.getElementById("announcement-text").textContent = "Unable to fetch live feed. Retrying shortly...";
            }
        }

        // প্ৰথম কল আৰু প্ৰতি ৮ ছেকেণ্ডত স্বয়ংক্ৰিয় লাইভ আপডেট
        fetchLiveMatchDetails();
        setInterval(fetchLiveMatchDetails, 8000);
    </script>
</body>
</html>
