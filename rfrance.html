<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radios Françaises - Direct</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: #0b1120;
            color: #f8fafc;
        }

        body {
            padding: 14px 12px 30px 12px;
        }

        /* 1. Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            width: 100%;
        }

        .brand-title {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .icon-btn {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            cursor: pointer;
            text-decoration: none;
            flex-shrink: 0;
        }

        .icon-btn svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* 2. Quick Genre Chips (Non-scrollable, Fixed Grid) */
        .chips-bar {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 6px;
            width: 100%;
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            background-color: #0b1120;
            z-index: 10;
            padding-top: 6px;
            padding-bottom: 8px;
        }

        .genre-chip {
            width: 100%;
            padding: 8px 4px;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            color: #cbd5e1;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            outline: none;
            font-family: inherit;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .genre-chip:active {
            transform: scale(0.95);
        }

        .genre-chip.active {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.4);
        }

        /* 3. Section Bar & Content Container */
        .genre-content {
            display: none;
            animation: fadeIn 0.25s ease-out;
        }

        .genre-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            width: 100%;
        }

        .section-bar h2 {
            font-size: 14px;
            font-weight: 700;
            color: #f1f5f9;
        }

        /* 4. Stations Grid */
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }

        .radio-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 10px 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            position: relative;
            min-width: 0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.15s ease;
        }

        .radio-card:active {
            transform: scale(0.97);
        }

        .logo-wrap {
            position: relative;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
        }

        .station-logo {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #ffffff;
            padding: 2px;
            object-fit: contain;
            display: block;
        }

        .logo-fallback {
            display: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 9px;
            color: #ffffff;
            text-transform: uppercase;
            text-align: center;
            padding: 2px;
        }

        .radio-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
            min-width: 0;
        }

        .radio-name {
            font-size: 12px;
            font-weight: 700;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            display: block;
        }

        .radio-desc {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            display: block;
        }

        /* Fallbacks Colors */
        .bg-inter { background: #e11d48; }
        .bg-rtl { background: #dc2626; }
        .bg-nrj { background: #e11d48; }
        .bg-info { background: #eab308; color: #000; }
        .bg-europe1 { background: #1d4ed8; }
        .bg-nostalgie { background: #1e3a8a; color: #facc15; }
        .bg-rmc { background: #dc2626; }
        .bg-bfm { background: #0284c7; }
        .bg-rfi { background: #e11d48; }
        .bg-sud { background: #b91c1c; }
        .bg-cherie { background: #db2777; }
        .bg-europe2 { background: #ea580c; }
        .bg-fun { background: #0284c7; }
        .bg-skyrock { background: #0f172a; border: 1px solid #475569; }
        .bg-fg { background: #0d9488; }
        .bg-rtl2 { background: #0284c7; }
        .bg-ouifm { background: #dc2626; }
        .bg-rfm { background: #2563eb; }
        .bg-rire { background: #f59e0b; color: #000; }
        .bg-fip { background: #e11d48; }

        /* Fav Button */
        .fav-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .fav-btn svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: #64748b;
            stroke-width: 2;
        }

        .fav-btn.active svg {
            fill: #f43f5e;
            stroke: #f43f5e;
        }

        /* 5. Explore CTA Card */
        .explore-banner {
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #1e40af 100%);
            border-radius: 14px;
            padding: 14px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.25);
            margin-bottom: 20px;
            min-width: 0;
        }

        .explore-banner:active {
            transform: scale(0.98);
        }

        .explore-text {
            min-width: 0;
            flex: 1;
            padding-right: 8px;
        }

        .explore-text h3 {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .explore-text p {
            font-size: 11px;
            color: #bae6fd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .explore-arrow {
            background: rgba(255, 255, 255, 0.2);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* 6. Favorites Section */
        .fav-section {
            width: 100%;
            background: #111c30;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px;
            min-width: 0;
        }

        .fav-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .fav-badge {
            background: #0284c7;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 10px;
        }

        .fav-empty-text {
            color: #64748b;
            font-size: 11px;
            text-align: center;
            padding: 12px 0;
            line-height: 1.4;
        }

        /* Media Query */
        @media (max-width: 340px) {
            body { padding: 10px 8px 24px 8px; }
            
            .chips-bar {
                gap: 4px;
            }

            .genre-chip {
                padding: 6px 2px;
                font-size: 9.5px;
            }

            .radio-card { padding: 8px 6px; gap: 6px; }
            .logo-wrap, .station-logo, .logo-fallback { width: 34px; height: 34px; }
            .radio-name { font-size: 11px; }
            .radio-desc { font-size: 9px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="app-header">
        <div class="brand-title">Radios Françaises</div>
        <a href="explore.html" class="icon-btn" title="Rechercher">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </a>
    </header>

    <!-- Genre Chips (Non-scrollable Toggle Bar) -->
    <div class="chips-bar">
        <button type="button" class="genre-chip active" data-target="tab-alaune">🔥 À la une</button>
        <button type="button" class="genre-chip" data-target="tab-actualites">Actualités</button>
        <button type="button" class="genre-chip" data-target="tab-pophits">Pop & Hits</button>
        <button type="button" class="genre-chip" data-target="tab-poprock">Pop-Rock</button>
    </div>

    <!-- 1. À la une / Top Écoutes (Tab 1) -->
    <div id="tab-alaune" class="genre-content active">
        <div class="section-bar">
            <h2>🇫🇷 Top Écoutes</h2>
        </div>
        <div class="stations-grid" id="grid-alaune"></div>
    </div>

    <!-- 2. Actualités (Tab 2) -->
    <div id="tab-actualites" class="genre-content">
        <div class="section-bar">
            <h2>📰 Actualités & Info</h2>
        </div>
        <div class="stations-grid" id="grid-actualites"></div>
    </div>

    <!-- 3. Pop & Hits (Tab 3) -->
    <div id="tab-pophits" class="genre-content">
        <div class="section-bar">
            <h2>🎵 Pop & Hits</h2>
        </div>
        <div class="stations-grid" id="grid-pophits"></div>
    </div>

    <!-- 4. Pop-Rock (Tab 4) -->
    <div id="tab-poprock" class="genre-content">
        <div class="section-bar">
            <h2>🎸 Pop-Rock</h2>
        </div>
        <div class="stations-grid" id="grid-poprock"></div>
    </div>

    <!-- Explore CTA Banner -->
    <a href="go:exp" class="explore-banner">
        <div class="explore-text">
            <h3>Explorer +100 Radios</h3>
            <p>Par thèmes, régions & fréquences</p>
        </div>
        <div class="explore-arrow">→</div>
    </a>

    <!-- Favorites Box -->
    <div class="fav-section">
        <div class="fav-header">
            <span style="font-size: 13px; font-weight: 700; color: #e2e8f0;">❤️ Mes Favoris</span>
            <span class="fav-badge" id="fav-count">0</span>
        </div>
        <div id="fav-container" class="stations-grid" style="margin-bottom: 0;"></div>
        <div id="fav-empty" class="fav-empty-text">
            Aucun favori enregistré.<br>Appuyez sur le ❤️ pour en ajouter.
        </div>
    </div>

    <script>
        function handleError(img) {
            img.style.display = 'none';
            if (img.nextElementSibling && img.nextElementSibling.classList.contains('logo-fallback')) {
                img.nextElementSibling.style.display = 'flex';
            }
        }

        /* কেন্দ্ৰীয়ভাৱে সকলো ষ্টেচনৰ ডাটা */
        const STATIONS = {
            "S1": { name: "France Inter", sub: "Généraliste", logo: "https://assets.radiofrance.fr/common/logos/stations/franceinter.svg", bg: "bg-inter", tag: "INTER", href: "go:S1" },
            "S2": { name: "franceinfo", sub: "En Continu", logo: "https://assets.radiofrance.fr/common/logos/stations/franceinfo.svg", bg: "bg-info", tag: "INFO", href: "go:S2" },
            "S3": { name: "RMC", sub: "Info Talk Sport", logo: "https://cdn-profiles.tunein.com/s14896/images/logod.png", bg: "bg-rmc", tag: "RMC", href: "go:rmc" },
            "S4": { name: "BFM Business", sub: "Éco & Bourse", logo: "https://cdn-profiles.tunein.com/s17938/images/logod.png", bg: "bg-bfm", tag: "BFM", href: "go:bfm" },
            "S5": { name: "RFI Monde", sub: "International", logo: "https://cdn-profiles.tunein.com/s6608/images/logod.png", bg: "bg-rfi", tag: "RFI", href: "go:rfi" },
            "S6": { name: "Sud Radio", sub: "Info & Débats", logo: "https://cdn-profiles.tunein.com/s25241/images/logod.png", bg: "bg-sud", tag: "SUD", href: "go:sud" },
            "S7": { name: "NRJ", sub: "Hit Music Only", logo: "https://cdn-profiles.tunein.com/s25395/images/logod.png", bg: "bg-nrj", tag: "NRJ", href: "go:S7" },
            "S8": { name: "RTL", sub: "Info & Débats", logo: "https://cdn-profiles.tunein.com/s6606/images/logod.png", bg: "bg-rtl", tag: "RTL", href: "go:S8" },
            "S9": { name: "Chérie FM", sub: "Feel Good Music", logo: "https://cdn-profiles.tunein.com/s3124/images/logod.png", bg: "bg-cherie", tag: "CHÉRIE", href: "go:cherie" },
            "S10": { name: "Europe 2", sub: "Meilleur Son Pop", logo: "https://cdn-profiles.tunein.com/s10464/images/logod.png", bg: "bg-europe2", tag: "E2", href: "go:europe2" },
            "S11": { name: "Nostalgie", sub: "Légendes", logo: "https://cdn-profiles.tunein.com/s24993/images/logod.png", bg: "bg-nostalgie", tag: "NOST", href: "go:S11" },
            "S12": { name: "Europe 1", sub: "Info & Talk", logo: "https://cdn-profiles.tunein.com/s6566/images/logod.png", bg: "bg-europe1", tag: "E1", href: "go:S12" },
            "S13": { name: "Fun Radio", sub: "Electro & Hits", logo: "https://cdn-profiles.tunein.com/s2109/images/logod.png", bg: "bg-fun", tag: "FUN", href: "go:S14" },
            "S14": { name: "Skyrock", sub: "Rap & RnB Non-Stop", logo: "https://cdn-profiles.tunein.com/s25232/images/logod.png", bg: "bg-skyrock", tag: "SKY", href: "go:S10" },
            "S15": { name: "Radio FG", sub: "House & Dance Hits", logo: "https://cdn-profiles.tunein.com/s25399/images/logod.png", bg: "bg-fg", tag: "FG", href: "go:fgradio" },
            "S17": { name: "RTL2", sub: "Le Son Pop-Rock", logo: "https://cdn-profiles.tunein.com/s24948/images/logod.png", bg: "bg-rtl2", tag: "RTL2", href: "go:S13" },
            "S18": { name: "OUI FM", sub: "La Radio du Rock", logo: "https://cdn-profiles.tunein.com/s6586/images/logod.png", bg: "bg-ouifm", tag: "OUI", href: "go:oui" },
            "S19": { name: "RFM", sub: "Le Meilleur de la Musique", logo: "https://cdn-profiles.tunein.com/s6616/images/logod.png", bg: "bg-rfm", tag: "RFM", href: "go:rfm2" },
            "S20": { name: "Rire & Chansons", sub: "Humour & Classic Rock", logo: "https://cdn-profiles.tunein.com/s25398/images/logod.png", bg: "bg-rire", tag: "RIRE", href: "go:rire" },
            "S21": { name: "FIP", sub: "Pop, Rock & Éclectique", logo: "https://assets.radiofrance.fr/common/logos/stations/fip.svg", bg: "bg-fip", tag: "FIP", href: "go:fip" }
        };

        /* শ্ৰেণী অনুসৰি ষ্টেচনসমূহৰ তালিকা */
        const CATEGORIES = {
            "grid-alaune": ["S1", "S8", "S7", "S2", "S11", "S12"],
            "grid-actualites": ["S2", "S3", "S12", "S4", "S5", "S6"],
            "grid-pophits": ["S7", "S9", "S10", "S13", "S14", "S15"],
            "grid-poprock": ["S17", "S11", "S18", "S19", "S20", "S21"]
        };

        const STORAGE_KEY = 'radio_favs_v2';

        function getFavorites() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        function saveFavorites(favs) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(favs));
            } catch (e) {}
            updateFavoritesUI();
        }

        function toggleFav(event, id) {
            event.preventDefault();
            event.stopPropagation();

            let favs = getFavorites();
            if (favs.includes(id)) {
                favs = favs.filter(item => item !== id);
            } else {
                favs.push(id);
            }
            saveFavorites(favs);
        }

        /* কাৰ্ড বনোৱাৰ উমৈহতীয়া ফাংচন */
        function createCard(id, isFav = false) {
            const item = STATIONS[id];
            if (!item) return '';

            const activeClass = isFav ? 'active' : '';
            return `
                <a href="${item.href}" class="radio-card" data-id="${id}">
                    <div class="logo-wrap">
                        <img class="station-logo" src="${item.logo}" alt="${item.name}" onerror="handleError(this)">
                        <div class="logo-fallback ${item.bg}">${item.tag}</div>
                    </div>
                    <div class="radio-info">
                        <span class="radio-name">${item.name}</span>
                        <span class="radio-desc">${item.sub}</span>
                    </div>
                    <button class="fav-btn ${activeClass}" onclick="toggleFav(event, '${id}')">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </button>
                </a>
            `;
        }

        /* পেজ লোড হ'লে মূল গ্ৰিডসমূহ ডাইনামিকভাৱে তৈয়াৰ কৰা */
        function renderCategoryGrids() {
            const favs = getFavorites();
            for (const [gridId, stationIds] of Object.entries(CATEGORIES)) {
                const gridEl = document.getElementById(gridId);
                if (gridEl) {
                    gridEl.innerHTML = stationIds.map(id => createCard(id, favs.includes(id))).join('');
                }
            }
        }

        /* ফেভাৰিট অংশ আপডেট কৰা */
        function updateFavoritesUI() {
            const favs = getFavorites();

            // সকলো কাৰ্ডৰ ভিতৰত থকা হার্ট বুটাম আপডেট কৰা
            document.querySelectorAll('.radio-card[data-id]').forEach(el => {
                const id = el.dataset.id;
                const btn = el.querySelector('.fav-btn');
                if (btn) {
                    if (favs.includes(id)) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                }
            });

            const countEl = document.getElementById('fav-count');
            if (countEl) countEl.innerText = favs.length;

            const favContainer = document.getElementById('fav-container');
            const emptyText = document.getElementById('fav-empty');
            if (!favContainer || !emptyText) return;

            if (favs.length === 0) {
                favContainer.innerHTML = '';
                emptyText.style.display = 'block';
            } else {
                emptyText.style.display = 'none';
                favContainer.innerHTML = favs.map(id => createCard(id, true)).join('');
            }
        }

        // Chip Tab Switching Logic
        document.querySelectorAll('.genre-chip[data-target]').forEach(chip => {
            chip.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');

                document.querySelectorAll('.genre-chip').forEach(c => c.classList.remove('active'));
                this.classList.add('active');

                document.querySelectorAll('.genre-content').forEach(content => {
                    content.classList.remove('active');
                });

                const activeTarget = document.getElementById(targetId);
                if (activeTarget) {
                    activeTarget.classList.add('active');
                }
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderCategoryGrids();
            updateFavoritesUI();
        });
    </script>
</body>
</html>
