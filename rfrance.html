<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Radios Françaises</title>
  <style>
:root {
  --bg-primary: #0a0e17;
  --surface-card: #131a29;
  --surface-inner: rgba(0, 0, 0, 0.22);
  --border-subtle: rgba(255, 255, 255, 0.07);
  --border-focus: rgba(255, 255, 255, 0.15);
  --accent-cyan: #38bdf8;
  --text-main: #f8fafc;
  --text-sub: #94a3b8;
  --text-muted: #64748b;
  --inter-color: #ef4444;
  --info-color: #f59e0b;
  --culture-color: #a855f7;
  --musique-color: #ec4899;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

html {
  background: var(--bg-primary);
  scroll-behavior: auto;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Google Sans", sans-serif;
  background: var(--bg-primary);
  color: var(--text-main);
  padding: 0 16px max(32px, env(safe-area-inset-bottom));
  line-height: 1.4;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}

/* Ambient glow accents */
body::before,
body::after {
  content: "";
  position: fixed;
  width: 200px;
  height: 200px;
  pointer-events: none;
  z-index: -1;
  opacity: 0.10;
  border-radius: 50%;
  filter: blur(55px);
}
body::before {
  top: 10%;
  right: -50px;
  background: var(--accent-cyan);
}
body::after {
  bottom: 20%;
  left: -50px;
  background: var(--culture-color);
}

/* FIXED STICKY HEADER */
.sticky-header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(10, 14, 23, 0.88);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  margin: 0 -16px 16px;
  padding: max(14px, env(safe-area-inset-top)) 16px 12px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.brand-section {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}

.brand-title {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.4px;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 7px;
}

.brand-radio-icon {
  width: 18px;
  height: 18px;
  fill: var(--accent-cyan);
  flex-shrink: 0;
}

.brand-subtitle {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  letter-spacing: 0.2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.time-chip {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  color: var(--accent-cyan);
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  gap: 5px;
}

.time-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent-cyan);
  box-shadow: 0 0 5px var(--accent-cyan);
}

.icon-button {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  color: var(--text-sub);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  outline: none;
  transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
}

.icon-button:active {
  transform: scale(0.90);
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
}

/* CARDS LIST */
.station-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 18px;
}

.station-card {
  position: relative;
  background: linear-gradient(150deg, #141c2c, #0f1523);
  border: 1px solid var(--border-subtle);
  border-radius: 18px;
  padding: 14px 16px;
  cursor: pointer;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
  transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
  contain: layout paint;
  content-visibility: auto;
  contain-intrinsic-size: 175px;
}

.station-card:active {
  transform: scale(0.98);
  border-color: var(--border-focus);
  background: #172134;
}

/* Glowing side accent bar */
.station-card::before {
  content: "";
  position: absolute;
  top: 14px;
  left: 0;
  bottom: 14px;
  width: 3.5px;
  background: var(--station-color, var(--accent-cyan));
  border-radius: 0 3px 3px 0;
  box-shadow: 0 0 8px var(--station-color, var(--accent-cyan));
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-left: 2px;
}

.station-identity {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.station-avatar {
  width: 46px;
  height: 46px;
  border-radius: 13px;
  background: #000;
  border: 1px solid rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
}

.station-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.station-text-meta {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.station-title {
  font-size: 16.5px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.3px;
}

.live-indicator {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.6px;
  color: #f87171;
}

/* Smooth live equalizer */
.equalizer {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 10px;
}

.equalizer span {
  width: 2px;
  height: 3px;
  background: #ef4444;
  border-radius: 1px;
}
.equalizer span:nth-child(1) { animation: eq 0.8s ease-in-out infinite; }
.equalizer span:nth-child(2) { animation: eq 1.1s ease-in-out infinite 0.2s; }
.equalizer span:nth-child(3) { animation: eq 0.7s ease-in-out infinite 0.4s; }
.equalizer span:nth-child(4) { animation: eq 0.95s ease-in-out infinite 0.1s; }

@keyframes eq {
  0%, 100% { height: 3px; }
  50% { height: 10px; }
}

.play-circle {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #1b2436;
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
  transition: transform 0.12s ease, background 0.12s ease, color 0.12s ease;
}

.play-circle svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
  margin-left: 2px;
}

.station-card:active .play-circle {
  transform: scale(0.92);
  background: #fff;
  color: #0b0f19;
}

/* Show Content Box */
.show-wrapper {
  background: var(--surface-inner);
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-radius: 12px;
  padding: 10px 12px;
  min-width: 0;
}

.show-badge-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
}

.show-time-chip {
  font-size: 10.5px;
  font-weight: 700;
  background: rgba(56, 189, 248, 0.12);
  color: var(--accent-cyan);
  padding: 2px 7px;
  border-radius: 6px;
  letter-spacing: 0.2px;
}

.show-heading {
  font-size: 14px;
  font-weight: 600;
  color: #f1f5f9;
  line-height: 1.35;
  margin-bottom: 3px;
}

.show-summary {
  font-size: 12px;
  color: var(--text-sub);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.45;
}

/* EXPLORE ALL STATIONS BUTTON */
.explore-container {
  margin-top: 6px;
}

.explore-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(135deg, #162032, #0f1726);
  border: 1px solid rgba(56, 189, 248, 0.22);
  border-radius: 16px;
  padding: 14px 16px;
  color: #fff;
  cursor: pointer;
  outline: none;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
  transition: transform 0.12s ease, background 0.12s ease;
}

.explore-btn:active {
  transform: scale(0.98);
  background: #1e2b42;
}

.explore-content {
  display: flex;
  align-items: center;
  gap: 12px;
}

.explore-icon-wrap {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: rgba(56, 189, 248, 0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.explore-icon-wrap svg {
  width: 20px;
  height: 20px;
  fill: var(--accent-cyan);
}

.explore-text {
  display: flex;
  flex-direction: column;
  text-align: left;
}

.explore-title {
  font-size: 14.5px;
  font-weight: 700;
  color: #fff;
}

.explore-sub {
  font-size: 11.5px;
  color: var(--text-sub);
  margin-top: 1px;
}

.explore-arrow {
  width: 18px;
  height: 18px;
  fill: var(--accent-cyan);
  flex-shrink: 0;
}

/* PRIVACY MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(6px);
  z-index: 2000;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.modal-overlay.active { display: flex; }

.modal-card {
  background: #141c2c;
  border: 1px solid var(--border-focus);
  border-radius: 22px;
  max-width: 350px;
  width: 100%;
  padding: 22px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

.modal-title {
  font-size: 17px;
  font-weight: 700;
  color: #fff;
}

.modal-close {
  background: none;
  border: none;
  color: var(--text-sub);
  font-size: 24px;
  line-height: 1;
  cursor: pointer;
}

.modal-content {
  font-size: 13px;
  color: var(--text-sub);
  line-height: 1.55;
}

.modal-footer {
  margin-top: 20px;
  display: flex;
  justify-content: flex-end;
}

.modal-btn {
  background: var(--accent-cyan);
  color: #04101f;
  border: none;
  border-radius: 12px;
  padding: 9px 22px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

  <!-- FIXED STICKY HEADER -->
  <header class="sticky-header">
    <div class="header-top">
      <div class="brand-section">
        <div class="brand-title">
          <svg class="brand-radio-icon" viewBox="0 0 24 24">
            <path d="M12 3a9 9 0 0 0-9 9v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a9 9 0 0 0-9-9zm0 2c3.87 0 7 3.13 7 7v1.17A2.99 2.99 0 0 0 17 13c-1.66 0-3 1.34-3 3v2h-4v-2c0-1.66-1.34-3-3-3a2.99 2.99 0 0 0-2 .17V12c0-3.87 3.13-7 7-7z"/>
          </svg>
          Radios Françaises
        </div>
        <div class="brand-subtitle">Direct National & Podcasts</div>
      </div>

      <div class="header-actions">
        <!-- Live Clock -->
        <div class="time-chip">
          <span class="time-dot"></span>
          <span id="paris-clock">--:--:--</span>
        </div>

        <!-- Share Button (Triggers: http://action.share) -->
        <button class="icon-button" onclick="shareApp()" aria-label="Share" title="Partager">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
        </button>

        <!-- Privacy Button -->
        <button class="icon-button" onclick="openPrivacyModal()" aria-label="Privacy" title="Confidentialité">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- RADIO CARDS LIST -->
  <div class="station-list" id="stations-container"></div>

  <!-- EXPLORE ALL STATIONS BUTTON -->
  <div class="explore-container">
    <button class="explore-btn" onclick="playStation('go:expl')">
      <div class="explore-content">
        <div class="explore-icon-wrap">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
        </div>
        <div class="explore-text">
          <span class="explore-title">Explorer toutes les stations</span>
          <span class="explore-sub">Découvrez toutes les radios et fréquences</span>
        </div>
      </div>
      <svg class="explore-arrow" viewBox="0 0 24 24">
        <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
      </svg>
    </button>
  </div>

  <!-- PRIVACY MODAL -->
  <div class="modal-overlay" id="privacy-modal" onclick="closePrivacyModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">Confidentialité</div>
        <button class="modal-close" onclick="closePrivacyModal()">&times;</button>
      </div>
      <div class="modal-content">
        <p>Cette application respecte votre vie privée. Aucune donnée personnelle ni identifiant de suivi n'est collecté.</p>
        <br>
        <p>Les flux audio sont transmis en direct et en accès libre pour une écoute fluide.</p>
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closePrivacyModal()">Compris</button>
      </div>
    </div>
  </div>

  <script>
const STATIONS = [
  {
    id: "inter",
    name: "France Inter",
    trigger: "go:finter",
    color: "var(--inter-color)",
    logo: "https://ik.imagekit.io/sqt8ptw1k/images_FOnmIj289.png"
  },
  {
    id: "info",
    name: "France Info",
    trigger: "go:finfo",
    color: "var(--info-color)",
    logo: "https://ik.imagekit.io/sqt8ptw1k/download_iJaUHUs7R0.png"
  },
  {
    id: "culture",
    name: "France Culture",
    trigger: "go:fcul",
    color: "var(--culture-color)",
    logo: "https://ik.imagekit.io/sqt8ptw1k/images%20(1)_2O3twmcLj.png"
  },
  {
    id: "musique",
    name: "France Musique",
    trigger: "go:fmusi",
    color: "var(--musique-color)",
    logo: "https://ik.imagekit.io/sqt8ptw1k/download%20(1)_wUMJsGpab.png"
  }
];

let scheduleData = [];
let stationElements = new Map();

function getParisTime() {
  const now = new Date();
  const str = now.toLocaleTimeString("en-GB", {
    timeZone: "Europe/Paris",
    hour12: false
  });
  const parts = str.split(":").map(Number);
  return {
    totalMinutes: parts[0] * 60 + parts[1],
    timeStr: str
  };
}

function isShowLive(timeRange, nowMinutes) {
  if (!timeRange) return false;

  const parts = timeRange.split("-").map(p => p.trim());
  if (parts.length !== 2) return false;

  function parseM(tStr) {
    const clean = tStr.replace("h", ":");
    const p = clean.split(":").map(Number);
    return p[0] * 60 + (p[1] || 0);
  }

  const start = parseM(parts[0]);
  let end = parseM(parts[1]);

  if (end === 0) end = 1440;

  if (end < start) {
    return nowMinutes >= start || nowMinutes < end;
  }

  return nowMinutes >= start && nowMinutes < end;
}

function getShowsByChannel() {
  const map = new Map();
  for (const item of scheduleData) {
    if (!item || !item.channel) continue;
    const key = item.channel.toLowerCase();
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(item);
  }
  return map;
}

let showsByChannel = new Map();

function getCurrentShow(channelName, nowMinutes) {
  if (!scheduleData.length) {
    return {
      title: "Chargement en direct...",
      time: "--:--",
      description: "Radio France en direct"
    };
  }

  const shows = showsByChannel.get(channelName.toLowerCase()) || [];

  for (const show of shows) {
    if (isShowLive(show.time, nowMinutes)) return show;
  }

  return shows[0] || {
    title: "Programme en cours",
    time: "En direct",
    description: "Radio France en direct"
  };
}

function buildCards() {
  const container = document.getElementById("stations-container");
  const fragment = document.createDocumentFragment();

  stationElements.clear();

  for (const st of STATIONS) {
    const card = document.createElement("div");
    card.className = "station-card";
    card.style.setProperty("--station-color", st.color);
    card.onclick = () => playStation(st.trigger);

    card.innerHTML = `
      <div class="card-top">
        <div class="station-identity">
          <div class="station-avatar">
            <img src="${st.logo}" alt="${st.name}" width="46" height="46" decoding="async">
          </div>
          <div class="station-text-meta">
            <div class="station-title">${st.name}</div>
            <div class="live-indicator">
              <div class="equalizer">
                <span></span><span></span><span></span><span></span>
              </div>
              EN DIRECT
            </div>
          </div>
        </div>

        <div class="play-circle" title="Écouter">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
      </div>

      <div class="show-wrapper">
        <div class="show-badge-row">
          <span class="show-time-chip"></span>
        </div>
        <div class="show-heading"></div>
        <div class="show-summary"></div>
      </div>
    `;

    stationElements.set(st.id, {
      time: card.querySelector(".show-time-chip"),
      title: card.querySelector(".show-heading"),
      summary: card.querySelector(".show-summary")
    });

    fragment.appendChild(card);
  }

  container.replaceChildren(fragment);
}

function updateShows() {
  const paris = getParisTime();

  for (const st of STATIONS) {
    const el = stationElements.get(st.id);
    if (!el) continue;

    const show = getCurrentShow(st.name, paris.totalMinutes);

    el.time.textContent = show.time || "En direct";
    el.title.textContent = show.title || "Programme en cours";
    el.summary.textContent = show.description || "";
  }

  const clock = document.getElementById("paris-clock");
  if (clock && clock.textContent !== paris.timeStr) {
    clock.textContent = paris.timeStr;
  }
}

function playStation(triggerScheme) {
  window.location.href = triggerScheme;
}

function shareApp() {
  window.location.href = "http://action.share";
}

function startClock() {
  updateShows();
  setInterval(updateShows, 1000);
}

async function fetchLiveJson() {
  try {
    const res = await fetch("https://vividh.pages.dev/rfrance.json", { cache: "no-store" });
    if (!res.ok) return;

    const data = await res.json();
    if (Array.isArray(data) && data.length > 0) {
      scheduleData = data;
      showsByChannel = getShowsByChannel();
      updateShows();
    }
  } catch (e) {
    console.error("Erreur de chargement du programme:", e);
  }
}

function openPrivacyModal() {
  const modal = document.getElementById("privacy-modal");
  if (modal) modal.classList.add("active");
}

function closePrivacyModal(e) {
  if (
    !e ||
    e.target.id === "privacy-modal" ||
    e.target.classList.contains("modal-close") ||
    e.target.classList.contains("modal-btn")
  ) {
    const modal = document.getElementById("privacy-modal");
    if (modal) modal.classList.remove("active");
  }
}

/* Initialisation */
buildCards();
updateShows();
startClock();
fetchLiveJson();
  </script>
</body>
