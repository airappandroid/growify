<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Radios Françaises</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #172033;
      --card-border: #222f49;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --inter-color: #ef4444;
      --info-color: #f59e0b;
      --culture-color: #8b5cf6;
      --musique-color: #ec4899;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding: 12px 14px 28px;
      line-height: 1.4;
      min-height: 100vh;
      -webkit-overflow-scrolling: touch;
    }

    /* Header Bar */
    .header {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .app-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .privacy-btn {
      background: #0f172a;
      color: var(--text-sub);
      border: 1px solid var(--card-border);
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .privacy-btn:active {
      color: #fff;
    }

    .time-chip {
      background: #0f172a;
      border: 1px solid var(--card-border);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11.5px;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
    }

    /* Station List & Cards */
    .station-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .card.playing {
      border-color: #0284c7;
      background: #1c273e;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .station-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .station-avatar {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #090d16;
      border: 1px solid #222f49;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .station-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .station-title-group {
      display: flex;
      flex-direction: column;
    }

    .station-name {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    /* Static Live Badge (No blink) */
    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 3px 9px;
      border-radius: 20px;
    }

    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
    }

    /* Programme Details Box */
    .prog-body {
      background: #0d1424;
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 10px 12px;
      border-radius: 10px;
      position: relative;
    }

    .prog-body::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--card-border);
      border-radius: 3px 0 0 3px;
    }

    .card.playing .prog-body::before {
      background: var(--accent);
    }

    .prog-time {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
      letter-spacing: 0.2px;
    }

    .prog-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
      white-space: normal;
      word-break: break-word;
      line-height: 1.35;
    }

    .prog-desc {
      font-size: 11.5px;
      color: var(--text-sub);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
    }

    /* Action Play Button (No scale/press effect) */
    .play-btn {
      width: 100%;
      background: #24314c;
      color: var(--text-main);
      border: 1px solid #334466;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      outline: none;
    }

    .card.playing .play-btn {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }

    /* Equalizer */
    .eq-container {
      display: none;
      align-items: flex-end;
      gap: 2.5px;
      height: 13px;
    }

    .card.playing .eq-container {
      display: flex;
    }

    .eq-bar {
      width: 3px;
      background: #ffffff;
      border-radius: 2px;
      animation: eq 0.8s infinite ease-in-out alternate;
    }

    .eq-bar:nth-child(2) { animation-delay: 0.25s; }
    .eq-bar:nth-child(3) { animation-delay: 0.45s; }

    @keyframes eq {
      0% { height: 3px; }
      100% { height: 13px; }
    }

    /* Modal Overlay (Clean & Fast) */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #172033;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      max-width: 380px;
      width: 100%;
      padding: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
    }

    .modal-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }

    .modal-content {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.55;
    }

    .modal-footer {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end;
    }

    .modal-btn {
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Header Section -->
  <div class="header">
    <div class="app-title">
      <span>📻</span> Radios Françaises
    </div>
    <div class="header-actions">
      <button class="privacy-btn" onclick="openPrivacyModal()">🛡️ Privacy</button>
      <div class="time-chip" id="paris-clock">Paris --:--:--</div>
    </div>
  </div>

  <!-- Stations List -->
  <div class="station-list" id="stations-container"></div>

  <!-- Privacy Policy Popup Modal -->
  <div class="modal-overlay" id="privacy-modal" onclick="closePrivacyModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-title">🛡️ Politique de Confidentialité</div>
        <button class="modal-close" onclick="closePrivacyModal()">&times;</button>
      </div>
      <div class="modal-content">
        <p>Cette application respecte votre vie privée. Aucune donnée personnelle ni identifiant de suivi n'est collecté.</p>
        <br>
        <p>Les flux audio sont transmis en direct et en accès public pour vous offrir une expérience d'écoute optimale.</p>
      </div>
      <div class="modal-footer">
        <button class="modal-btn" onclick="closePrivacyModal()">Fermer</button>
      </div>
    </div>
  </div>

  <script>
    const STATIONS = [
      {
        id: "inter",
        name: "France Inter",
        trigger: "go:finter",
        color: "var(--inter-color)",
        logo: "https://ik.imagekit.io/sqt8ptw1k/images_FOnmIj289.png"
      },
      {
        id: "info",
        name: "France Info",
        trigger: "go:finfo",
        color: "var(--info-color)",
        logo: "https://ik.imagekit.io/sqt8ptw1k/download_iJaUHUs7R0.png"
      },
      {
        id: "culture",
        name: "France Culture",
        trigger: "go:fcul",
        color: "var(--culture-color)",
        logo: "https://ik.imagekit.io/sqt8ptw1k/images%20(1)_2O3twmcLj.png"
      },
      {
        id: "musique",
        name: "France Musique",
        trigger: "go:fmusi",
        color: "var(--musique-color)",
        logo: "https://ik.imagekit.io/sqt8ptw1k/download%20(1)_wUMJsGpab.png"
      }
    ];

    let scheduleData = [];
    let currentPlayingId = null;

    function getParisTime() {
      const now = new Date();
      const str = now.toLocaleTimeString("en-GB", { timeZone: "Europe/Paris", hour12: false });
      const [h, m, s] = str.split(":").map(Number);
      return { totalMinutes: h * 60 + m, timeStr: str };
    }

    function isShowLive(timeRange, nowMinutes) {
      if (!timeRange) return false;
      const parts = timeRange.split("-").map(p => p.trim());
      if (parts.length !== 2) return false;

      const parseM = (tStr) => {
        const clean = tStr.replace("h", ":");
        const [h, m] = clean.split(":").map(Number);
        return h * 60 + (m || 0);
      };

      const start = parseM(parts[0]);
      let end = parseM(parts[1]);

      if (end === 0) end = 1440;

      if (end < start) {
        return nowMinutes >= start || nowMinutes < end;
      }
      return nowMinutes >= start && nowMinutes < end;
    }

    function getCurrentShow(channelName, nowMinutes) {
      if (!scheduleData.length) {
        return { title: "Chargement en direct...", time: "--:--", description: "Radio France en direct" };
      }
      const shows = scheduleData.filter(s => s.channel.toLowerCase() === channelName.toLowerCase());
      const live = shows.find(s => isShowLive(s.time, nowMinutes));
      return live || shows[0] || { title: "Programme en cours", time: "En direct", description: "Radio France en direct" };
    }

    function renderCards() {
      const container = document.getElementById("stations-container");
      const paris = getParisTime();

      container.innerHTML = STATIONS.map(st => {
        const show = getCurrentShow(st.name, paris.totalMinutes);
        const isPlaying = (currentPlayingId === st.id);

        return `
          <div class="card ${isPlaying ? 'playing' : ''}" id="card-${st.id}">
            <div class="card-top">
              <div class="station-meta">
                <div class="station-avatar">
                  <img src="${st.logo}" alt="${st.name}" loading="lazy">
                </div>
                <div class="station-title-group">
                  <span class="station-name">${st.name}</span>
                </div>
              </div>
              <div class="live-badge">
                <span class="pulse"></span> DIRECT
              </div>
            </div>

            <div class="prog-body">
              <div class="prog-time">${show.time}</div>
              <div class="prog-title">${show.title}</div>
              <div class="prog-desc">${show.description || ''}</div>
            </div>

            <div class="card-footer">
              <button class="play-btn" onclick="playStation('${st.id}', '${st.trigger}')">
                <div class="eq-container">
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                  <div class="eq-bar"></div>
                </div>
                <span>${isPlaying ? '▶ Écoute en cours' : 'Écouter la station'}</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function playStation(stationId, triggerScheme) {
      currentPlayingId = stationId;
      renderCards();
      window.location.href = triggerScheme;
    }

    function startClock() {
      setInterval(() => {
        const paris = getParisTime();
        document.getElementById("paris-clock").innerText = "Paris " + paris.timeStr;
      }, 1000);

      setInterval(() => {
        renderCards();
      }, 60000);
    }

    async function fetchLiveJson() {
      try {
        const res = await fetch("https://vividh.pages.dev/rfrance.json", { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            scheduleData = data;
            renderCards();
          }
        }
      } catch (e) {
        console.error("Erreur de chargement du programme:", e);
      }
    }

    function openPrivacyModal() {
      const modal = document.getElementById("privacy-modal");
      if (modal) modal.classList.add("active");
    }

    function closePrivacyModal() {
      const modal = document.getElementById("privacy-modal");
      if (modal) modal.classList.remove("active");
    }

    renderCards();
    startClock();
    fetchLiveJson();
  </script>
</body>
</html>
