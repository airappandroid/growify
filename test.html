<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Full Scorecard - Sri Lanka vs India</title>
    <style>
        :root {
            --bg-body: #060a12;
            --bg-card: #0d1527;
            --bg-subtle: rgba(255, 255, 255, 0.03);
            --bg-active: rgba(56, 189, 248, 0.08);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            
            --accent-live: #ef4444;
            --accent-cyan: #38bdf8;
            --accent-gold: #fbbf24;
            --accent-emerald: #10b981;
            
            --border-soft: rgba(255, 255, 255, 0.07);
            --border-active: rgba(56, 189, 248, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px 8px;
            min-height: 100vh;
        }

        .scorecard-app {
            width: 100%;
            max-width: 480px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border-soft);
            overflow: hidden;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
        }

        /* Top Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px 8px;
            background: linear-gradient(180deg, #131c31 0%, var(--bg-card) 100%);
            border-bottom: 1px solid var(--border-soft);
        }

        .series-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .match-badge {
            font-size: 10px;
            font-weight: 800;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 2px 7px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .pulse-dot {
            width: 5px;
            height: 5px;
            background: var(--accent-live);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent-live);
        }

        /* Match Info Header */
        .match-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-soft);
        }

        .match-status-note {
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.35;
        }

        .match-meta-row {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        /* Teams Summary */
        .teams-summary-box {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-soft);
        }

        .team-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            border-radius: 8px;
            background: var(--bg-subtle);
        }

        .team-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .team-flag {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
            background: #1e293b;
        }

        .team-name {
            font-size: 13px;
            font-weight: 700;
        }

        .team-score {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        /* Innings Switcher Tabs */
        .innings-tabs {
            display: flex;
            gap: 6px;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.35);
            border-bottom: 1px solid var(--border-soft);
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: var(--bg-subtle);
            color: var(--text-muted);
            font-size: 11.5px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: rgba(56, 189, 248, 0.12);
            border-color: var(--border-active);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
        }

        /* Section Headings */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px 6px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--accent-cyan);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        /* Scorecard Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            font-size: 9.5px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            padding: 6px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        td {
            font-size: 12px;
            padding: 8px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            vertical-align: top;
        }

        /* Batting Columns */
        .bat-tbl th:nth-child(1), .bat-tbl td:nth-child(1) { width: 50%; text-align: left; padding-left: 14px; }
        .bat-tbl th:nth-child(2), .bat-tbl td:nth-child(2) { width: 10%; text-align: right; }
        .bat-tbl th:nth-child(3), .bat-tbl td:nth-child(3) { width: 10%; text-align: right; }
        .bat-tbl th:nth-child(4), .bat-tbl td:nth-child(4) { width: 9%; text-align: right; }
        .bat-tbl th:nth-child(5), .bat-tbl td:nth-child(5) { width: 9%; text-align: right; }
        .bat-tbl th:nth-child(6), .bat-tbl td:nth-child(6) { width: 12%; text-align: right; padding-right: 14px; }

        /* Bowling Columns */
        .bowl-tbl th:nth-child(1), .bowl-tbl td:nth-child(1) { width: 44%; text-align: left; padding-left: 14px; }
        .bowl-tbl th:nth-child(2), .bowl-tbl td:nth-child(2) { width: 11%; text-align: right; }
        .bowl-tbl th:nth-child(3), .bowl-tbl td:nth-child(3) { width: 9%; text-align: right; }
        .bowl-tbl th:nth-child(4), .bowl-tbl td:nth-child(4) { width: 11%; text-align: right; }
        .bowl-tbl th:nth-child(5), .bowl-tbl td:nth-child(5) { width: 10%; text-align: right; }
        .bowl-tbl th:nth-child(6), .bowl-tbl td:nth-child(6) { width: 15%; text-align: right; padding-right: 14px; }

        .player-name-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .player-main-name {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12.5px;
            font-weight: 700;
            color: #ffffff;
        }

        .dismissal-info {
            font-size: 10.5px;
            color: var(--text-dim);
            line-height: 1.25;
        }

        .highlight-num {
            font-weight: 800;
            color: #ffffff;
        }

        /* SVG Icons */
        .icon-bat {
            display: inline-flex;
            color: var(--accent-gold);
            flex-shrink: 0;
        }

        .icon-ball {
            display: inline-flex;
            flex-shrink: 0;
        }

        /* Extras & Total Box */
        .meta-strip-box {
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.015);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 11.5px;
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
        }

        .meta-strip-box strong {
            color: #ffffff;
        }

        /* Fall of Wickets */
        .fow-container {
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.15);
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .fow-item {
            display: inline-block;
            margin-right: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .fow-item span {
            color: #ffffff;
            font-weight: 700;
        }

        /* Footer */
        .footer-box {
            padding: 14px;
            text-align: center;
            border-top: 1px solid var(--border-soft);
            background: rgba(0, 0, 0, 0.3);
        }

        .refresh-notice {
            font-size: 10.5px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div class="scorecard-app">
    <!-- Top Bar -->
    <div class="top-nav">
        <span class="series-title" id="series-name">Loading...</span>
        <div class="match-badge">
            <span class="pulse-dot"></span>
            <span id="match-status-tag">LIVE</span>
        </div>
    </div>

    <!-- Match Summary Info -->
    <div class="match-header">
        <div class="match-status-note" id="match-status-note">স্ক'ৰ লোড হৈ আছে...</div>
        <div class="match-meta-row">
            <span id="match-venue">Venue: -</span>
            <span id="match-toss">Toss: -</span>
        </div>
    </div>

    <!-- Teams Summary Box -->
    <div class="teams-summary-box" id="teams-summary"></div>

    <!-- Innings Switcher Tabs -->
    <div class="innings-tabs" id="innings-tabs"></div>

    <!-- Dynamic Inning Content -->
    <div id="inning-content"></div>

    <!-- Footer -->
    <div class="footer-box">
        <div class="refresh-notice">● Live updates refresh every 5 seconds</div>
    </div>
</div>

<script>
    const API_URL = 'https://cricscore.aminurmarch.workers.dev/';
    const REFRESH_DELAY = 5000;

    const batSvg = `<span class="icon-bat" title="Striker"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 2.65a2.5 2.5 0 0 0-3.54 0L9.4 9.06l-.7-.7a1 1 0 0 0-1.42 1.42l.7.7-5.69 5.69a2 2 0 0 0 0 2.83l.7.7a2 2 0 0 0 2.83 0l5.69-5.69.7.7a1 1 0 0 0 1.42-1.42l-.7-.7 6.41-6.41a2.5 2.5 0 0 0 0-3.54z"/></svg></span>`;
    const ballSvg = `<span class="icon-ball" title="Active Bowler"><svg width="11" height="11" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ef4444" /><path d="M7 6c3 3 3 9 0 12M17 6c-3 3-3 9 0 12" stroke="#ffffff" stroke-width="2" fill="none"/></svg></span>`;

    let matchData = null;
    let selectedInningIndex = 0;

    async function fetchMatchData() {
        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error('Network error');
            const data = await res.json();
            if (data.status === 'ok' && data.response) {
                matchData = data.response;
                renderApp();
            }
        } catch (err) {
            console.error('Fetch error:', err);
        } finally {
            setTimeout(fetchMatchData, REFRESH_DELAY);
        }
    }

    function switchInning(index) {
        selectedInningIndex = index;
        renderInningDetails();
    }

    function renderApp() {
        if (!matchData) return;

        // Header Info
        document.getElementById('series-name').innerText = `${matchData.competition?.title || 'Tour'} • ${matchData.subtitle || ''}`;
        document.getElementById('match-status-tag').innerText = matchData.status_str || 'LIVE';
        document.getElementById('match-status-note').innerText = matchData.status_note || matchData.live || '';
        document.getElementById('match-venue').innerText = `📍 ${matchData.venue?.name || ''}, ${matchData.venue?.location || ''}`;
        document.getElementById('match-toss').innerText = `🪙 ${matchData.toss?.text || '-'}`;

        // Teams Summary
        const teama = matchData.teama || {};
        const teamb = matchData.teamb || {};
        document.getElementById('teams-summary').innerHTML = `
            <div class="team-summary-row">
                <div class="team-brand">
                    <img src="${teama.logo_url}" class="team-flag" alt="${teama.name}">
                    <span class="team-name">${teama.name}</span>
                </div>
                <span class="team-score">${teama.scores_full || teama.scores || '-'}</span>
            </div>
            <div class="team-summary-row">
                <div class="team-brand">
                    <img src="${teamb.logo_url}" class="team-flag" alt="${teamb.name}">
                    <span class="team-name">${teamb.name}</span>
                </div>
                <span class="team-score">${teamb.scores_full || teamb.scores || '-'}</span>
            </div>
        `;

        // Innings Tabs
        const innings = matchData.innings || [];
        if (innings.length > 0) {
            if (selectedInningIndex === 0 && selectedInningIndex < innings.length - 1) {
                selectedInningIndex = innings.length - 1;
            }

            document.getElementById('innings-tabs').innerHTML = innings.map((inn, idx) => `
                <div class="tab-btn ${idx === selectedInningIndex ? 'active' : ''}" onclick="switchInning(${idx})">
                    ${inn.short_name || inn.name}
                </div>
            `).join('');

            renderInningDetails();
        }
    }

    function renderInningDetails() {
        const innings = matchData.innings || [];
        const inn = innings[selectedInningIndex];
        const container = document.getElementById('inning-content');
        if (!inn) return;

        // Update tabs active state
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach((btn, i) => btn.classList.toggle('active', i === selectedInningIndex));

        // Batting Rows with Striker Icon
        const batsmen = inn.batsmen || [];
        const battingHTML = batsmen.map(b => {
            const isStriker = b.position === 'striker' || (b.batting === 'true' && b.position !== 'non striker');

            return `
                <tr>
                    <td>
                        <div class="player-name-box">
                            <span class="player-main-name">
                                ${b.name} ${b.role_str || ''}
                                ${isStriker ? batSvg : ''}
                            </span>
                            <span class="dismissal-info">${b.how_out || (b.batting === 'true' ? 'not out' : '-')}</span>
                        </div>
                    </td>
                    <td class="highlight-num">${b.runs ?? 0}</td>
                    <td>${b.balls_faced ?? 0}</td>
                    <td>${b.fours ?? 0}</td>
                    <td>${b.sixes ?? 0}</td>
                    <td>${b.strike_rate || '0.00'}</td>
                </tr>
            `;
        }).join('') || '<tr><td colspan="6" style="text-align:center;">No data</td></tr>';

        // Extras & Equations
        const extras = inn.extra_runs || {};
        const eq = inn.equations || {};

        // Fall of Wickets
        const fows = inn.fows || [];
        const fowHTML = fows.map(f => `
            <div class="fow-item">
                <span>${f.score_at_dismissal}/${f.number}</span> (${f.name}, ${f.overs_at_dismissal} ov)
            </div>
        `).join('') || 'None';

        // Bowling Rows with Active Bowler Icon
        const bowlers = inn.bowlers || [];
        const bowlingHTML = bowlers.map(bw => {
            const isBowling = bw.bowling === 'true' || bw.position === 'active bowler';

            return `
                <tr>
                    <td>
                        <span class="player-main-name">
                            ${bw.name}
                            ${isBowling ? ballSvg : ''}
                        </span>
                    </td>
                    <td>${bw.overs ?? 0}</td>
                    <td>${bw.maidens ?? 0}</td>
                    <td>${bw.runs_conceded ?? 0}</td>
                    <td class="highlight-num">${bw.wickets ?? 0}</td>
                    <td>${bw.econ || '0.00'}</td>
                </tr>
            `;
        }).join('') || '<tr><td colspan="6" style="text-align:center;">No data</td></tr>';

        // Render Combined Inning HTML
        container.innerHTML = `
            <!-- Batting Section -->
            <div class="section-header">
                <span>Batting • ${inn.scores_full || ''}</span>
            </div>
            <table class="bat-tbl">
                <thead>
                    <tr>
                        <th>Batter</th>
                        <th>R</th>
                        <th>B</th>
                        <th>4s</th>
                        <th>6s</th>
                        <th>SR</th>
                    </tr>
                </thead>
                <tbody>${battingHTML}</tbody>
            </table>

            <!-- Extras & Total Strip -->
            <div class="meta-strip-box">
                <span>Extras: <strong>${extras.total || 0}</strong> (b ${extras.byes || 0}, lb ${extras.legbyes || 0}, w ${extras.wides || 0}, nb ${extras.noballs || 0})</span>
            </div>
            <div class="meta-strip-box" style="border-top:none;">
                <span>Total: <strong>${eq.runs || 0}/${eq.wickets || 0}</strong> (${eq.overs || 0} Overs, RR: ${eq.runrate || '0.00'})</span>
            </div>

            <!-- Fall of Wickets -->
            <div class="section-header" style="margin-top:4px;">
                <span>Fall of Wickets</span>
            </div>
            <div class="fow-container">
                ${fowHTML}
            </div>

            <!-- Bowling Section -->
            <div class="section-header" style="margin-top:4px;">
                <span>Bowling</span>
            </div>
            <table class="bowl-tbl">
                <thead>
                    <tr>
                        <th>Bowler</th>
                        <th>O</th>
                        <th>M</th>
                        <th>R</th>
                        <th>W</th>
                        <th>ECO</th>
                    </tr>
                </thead>
                <tbody>${bowlingHTML}</tbody>
            </table>
        `;
    }

    fetchMatchData();
</script>

</body>
</html>
