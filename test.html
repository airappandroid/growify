<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Cricket Scorecard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070a12;
      --card-surface: #111a2e;
      --card-border: rgba(255, 255, 255, 0.07);
      --accent-green: #10b981;
      --accent-cyan: #38bdf8;
      --accent-amber: #f59e0b;
      --accent-red: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-sub: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #131f38 0%, var(--bg-dark) 65%);
      background-attachment: fixed;
      min-height: 100vh;
      padding: 10px 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transform: translateZ(0);
    }

    /* Optimized Card with Hardware Acceleration & Content Visibility */
    .card {
      background: var(--card-surface);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      content-visibility: auto;
      contain: layout style paint;
      transform: translateZ(0);
    }

    /* Header & Overview */
    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 12px;
    }

    .badge-format {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 9px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      color: var(--text-muted);
    }

    .badge-live {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent-red);
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.25);
      padding: 3px 9px;
      border-radius: 20px;
    }

    .live-pulse {
      width: 6px;
      height: 6px;
      background: var(--accent-red);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }

    .team-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .team-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .team-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .score-stats {
      text-align: right;
    }

    .score-highlight {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent-green);
      letter-spacing: -0.5px;
    }

    .runrate-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Section Headings */
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent-cyan);
      margin-bottom: 10px;
    }

    /* Tables */
    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }

    th {
      text-align: right;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 4px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    th:first-child, td:first-child {
      text-align: left;
      padding-left: 0;
    }

    td {
      padding: 9px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      text-align: right;
    }

    td:first-child {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .player-col {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .player-name {
      font-weight: 700;
      color: #fff;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .role-badge {
      font-size: 0.6rem;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
      font-weight: 700;
    }

    .dismissal-text {
      font-size: 0.7rem;
      color: var(--text-sub);
      font-style: italic;
    }

    .not-out-tag {
      color: var(--accent-green);
      font-weight: 600;
    }

    .bold-white {
      color: #fff;
      font-weight: 700;
    }

    .wicket-bold {
      color: var(--accent-amber);
      font-weight: 700;
    }

    /* Extras */
    .extras-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      padding-top: 8px;
      margin-top: 2px;
      color: var(--text-muted);
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
    }

    /* Yet to Bat */
    .ytb-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ytb-chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    /* Partnerships */
    .pship-card {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
    }

    .pship-card:last-child {
      margin-bottom: 0;
    }

    .pship-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      font-weight: 600;
    }

    .pship-stats {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .progress-track {
      height: 5px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), #818cf8);
      border-radius: 4px;
    }

    /* Fall of Wickets */
    .fow-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .fow-pill {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .fow-pill span {
      color: var(--accent-amber);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: var(--text-sub);
      padding: 4px 6px 12px;
    }

    .loader {
      text-align: center;
      padding: 30px 0;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container" id="scorecardRoot">
    <div class="card loader">Syncing match scorecard...</div>
  </div>

  <script>
    const API_URL = 'https://api.cricradio.com.au/api/v2/match/scoreCard?matchId=6a46abf321dc815bb318261b&inningsNumber=1&battingTeam=b';

    async function loadScorecard() {
      const root = document.getElementById('scorecardRoot');
      try {
        const response = await fetch(API_URL);
        const json = await response.json();
        const res = json.responseData.result;
        const inn = res.innings_batting_order[0];

        // 1. Batting Table
        let battingHtml = '';
        inn.player_batting_order.forEach(p => {
          const b = p.batting;
          const dismissal = b.dismissed 
            ? `<span class="dismissal-text">${b.out_str}</span>` 
            : `<span class="dismissal-text not-out-tag">not out</span>`;

          const captain = p.isCaptain ? `<span class="role-badge">C</span>` : '';
          const wk = p.isWicketKeeper ? `<span class="role-badge">WK</span>` : '';

          battingHtml += `
            <tr>
              <td>
                <div class="player-col">
                  <span class="player-name">${p.name} ${captain}${wk}</span>
                  ${dismissal}
                </div>
              </td>
              <td class="bold-white">${b.runs}</td>
              <td>${b.balls}</td>
              <td>${b.fours}</td>
              <td>${b.sixes}</td>
              <td>${b.strike_rate.toFixed(1)}</td>
            </tr>
          `;
        });

        // 2. Bowling Table
        let bowlingHtml = '';
        inn.player_bowling_order.forEach(p => {
          const bw = p.bowling;
          bowlingHtml += `
            <tr>
              <td><span class="player-name">${p.name}</span></td>
              <td>${bw.overs}</td>
              <td>${bw.maiden_overs}</td>
              <td>${bw.runs}</td>
              <td class="wicket-bold">${bw.wickets}</td>
              <td>${bw.economy}</td>
            </tr>
          `;
        });

        // 3. Fall of Wickets
        let fowHtml = '';
        if (inn.fall_of_wickets && inn.fall_of_wickets.length > 0) {
          fowHtml = inn.fall_of_wickets.map(item => `<div class="fow-pill">${item}</div>`).join('');
        }

        // 4. Yet to Bat
        let ytbHtml = '';
        if (inn.yet_to_bat && inn.yet_to_bat.length > 0) {
          ytbHtml = inn.yet_to_bat.map(p => `
            <div class="ytb-chip">
              <span>${p.name}</span>
            </div>
          `).join('');
        }

        // 5. Partnerships
        let pshipHtml = '';
        if (inn.partnerships && inn.partnerships.length > 0) {
          pshipHtml = inn.partnerships.map(ps => {
            const fillWidth = Math.min((ps.runs / (inn.runs || 1)) * 120, 100);
            return `
              <div class="pship-card">
                <div class="pship-header">
                  <span>${ps.player_a} & ${ps.player_b}</span>
                  <span class="pship-stats">${ps.runs} <span style="font-size: 0.68rem; color: var(--text-sub);">(${ps.balls}b)</span></span>
                </div>
                <div class="progress-track">
                  <div class="progress-fill" style="width: ${fillWidth}%"></div>
                </div>
              </div>
            `;
          }).join('');
        }

        root.innerHTML = `
          <!-- Overview Card -->
          <div class="card">
            <div class="match-header">
              <span class="badge-format">${res.format} Match</span>
              <div class="badge-live">
                <span class="live-pulse"></span>
                ${res.status}
              </div>
            </div>

            <div class="team-summary">
              <div>
                <div class="team-title">${inn.teamName}</div>
                <div class="team-subtitle">1st Innings</div>
              </div>
              <div class="score-stats">
                <div class="score-highlight">${inn.runs}/${inn.wickets}</div>
                <div class="runrate-sub">${inn.overs} Ov • CRR ${inn.run_rate}</div>
              </div>
            </div>
          </div>

          <!-- Batting Scorecard -->
          <div class="card">
            <div class="section-title">Batting</div>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Batter</th>
                    <th>R</th>
                    <th>B</th>
                    <th>4s</th>
                    <th>6s</th>
                    <th>SR</th>
                  </tr>
                </thead>
                <tbody>
                  ${battingHtml}
                </tbody>
              </table>
            </div>

            <div class="extras-box">
              <span>Extras (b ${inn.bye}, lb ${inn.legbye}, w ${inn.wide}, nb ${inn.noball})</span>
              <span class="bold-white">${inn.extras}</span>
            </div>
          </div>

          <!-- Yet to Bat -->
          ${ytbHtml ? `
            <div class="card">
              <div class="section-title">Yet to Bat</div>
              <div class="ytb-grid">${ytbHtml}</div>
            </div>
          ` : ''}

          <!-- Bowling Scorecard -->
          <div class="card">
            <div class="section-title">Bowling</div>
            <div class="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Bowler</th>
                    <th>O</th>
                    <th>M</th>
                    <th>R</th>
                    <th>W</th>
                    <th>Econ</th>
                  </tr>
                </thead>
                <tbody>
                  ${bowlingHtml}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Partnerships -->
          ${pshipHtml ? `
            <div class="card">
              <div class="section-title">Partnerships</div>
              ${pshipHtml}
            </div>
          ` : ''}

          <!-- Fall of Wickets -->
          ${fowHtml ? `
            <div class="card">
              <div class="section-title">Fall of Wickets</div>
              <div class="fow-chips">${fowHtml}</div>
            </div>
          ` : ''}

          <!-- Footer Sync -->
          <div class="footer">
            <span>Auto Refresh: 10s</span>
            <span>Last Synced: ${new Date().toLocaleTimeString()}</span>
          </div>
        `;
      } catch (error) {
        console.error('Scorecard sync error:', error);
      }
    }

    loadScorecard();
    setInterval(loadScorecard, 10000);
  </script>
</body>
</html>
