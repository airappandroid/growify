<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>UK Radio Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden; /* স্ক্ৰীনৰ বাহিৰলৈ যোৱা ৰোধ কৰিবলৈ */
    }

    body {
      background-color: #0b111e;
      color: #ffffff;
      padding: 12px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Control Bar */
    .top-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
      width: 100%;
    }

    /* Category Switcher Button */
    .category-btn {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background-color: #131b2e;
      border: 1px solid #202d47;
      border-radius: 12px;
      cursor: pointer;
      overflow: hidden;
    }

    .category-btn:active {
      background-color: #18233c;
    }

    .category-btn span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }

    .category-btn svg {
      width: 16px;
      height: 16px;
      fill: #8e9fb5;
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* Favorites Toggle Button */
    .fav-toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 14px;
      background-color: #131b2e;
      border: 1px solid #202d47;
      border-radius: 12px;
      color: #8e9fb5;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .fav-toggle-btn.active {
      background-color: #1e6bff;
      border-color: #1e6bff;
      color: #ffffff;
    }

    /* 2x2 Fixed & Equal Grid */
    .grid-container {
      display: grid;
      /* minmax(0, 1fr) য়ে দুয়োটা স্তম্ভক সদায় সমান ৫০% জোখত ৰাখে */
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }

    /* Station Card */
    .station-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #131b2e;
      border: 1px solid #1c2842;
      border-radius: 16px;
      padding: 12px;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      min-width: 0; /* ছবিৰ জোখে কাৰ্ডখন বহল কৰিব নোৱাৰিবলৈ */
      width: 100%;
      overflow: hidden;
    }

    .station-card:active {
      background-color: #18233c;
    }

    /* Thumbnail Wrapper */
    .thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 10px;
      background-color: #0a0f1d;
      flex-shrink: 0;
    }

    .station-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 12px;
      pointer-events: none;
    }

    /* Play Button */
    .play-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 34px;
      height: 34px;
      background: #1e6bff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .play-btn svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
      margin-left: 2px;
    }

    /* Favorite Heart Button */
    .fav-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #18233c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    .fav-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #8e9fb5;
      stroke-width: 2.2;
      pointer-events: none;
    }

    .fav-btn.active svg {
      fill: #ff334b;
      stroke: #ff334b;
    }

    /* Station Name */
    .station-name {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      display: block;
      letter-spacing: 0.2px;
      pointer-events: none;
    }

    .empty-msg {
      grid-column: span 2;
      text-align: center;
      color: #8e9fb5;
      padding: 50px 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: #0b111e;
      z-index: 999;
      display: flex;
      flex-direction: column;
      padding: 14px 14px 10px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease, visibility 0.15s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
    }

    .modal-header p {
      font-size: 12px;
      color: #8e9fb5;
      margin-top: 2px;
    }

    .modal-close-btn {
      background: #18233c;
      border: 1px solid #283756;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      flex-shrink: 0;
    }

    .modal-close-btn svg {
      width: 16px;
      height: 16px;
      stroke: #ffffff;
      stroke-width: 2.2;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding-bottom: 8px;
    }

    .category-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      background-color: #131b2e;
      border: 1px solid #1f2b45;
      border-radius: 12px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .category-item:active {
      background-color: #182542;
      border-color: #1e6bff;
    }

    .category-item.selected {
      background-color: #162a52;
      border-color: #1e6bff;
    }

    .cat-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cat-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: #1a253e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .cat-text h3 {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }

    .cat-text p {
      font-size: 11px;
      color: #8e9fb5;
      margin-top: 1px;
      line-height: 1.2;
    }

    .cat-arrow svg {
      width: 16px;
      height: 16px;
      fill: #8e9fb5;
    }
  </style>
</head>

        { id: "s52", name: "BBC Surrey",          trigger: "go:s52", logo: "https://ik.imagekit.io/sqt8ptw1k/download%20(2).png" },
        { id: "s53", name: "BBC Sussex",          trigger: "go:s53", logo: "https://ik.imagekit.io/sqt8ptw1k/images%20(13).jpg" },
        { id: "s54", name: "BBC Tees",            trigger: "go:s54", logo: "https://ik.imagekit.io/sqt8ptw1k/images%20(14).jpg" },
        { id: "s55", name: "BBC Three Counties",  trigger: "go:s55", logo: "https://ik.imagekit.io/sqt8ptw1k/images%20(15).jpg" },
        { id: "s56", name: "BBC Wiltshire",       trigger: "go:s56", logo: "https://ik.imagekit.io/sqt8ptw1k/images%20(22).png" },
        { id: "s57", name: "BBC York",            trigger: "go:s57", logo: "https://ik.imagekit.io/sqt8ptw1k/images%20(23).png" }
      ]
    };

    function getStationColor(name) {
      if (name.includes("Capital")) return "#00325b";
      if (name.includes("Heart")) return "#d81734";
      if (name.includes("Classic")) return "#5d001e";
      if (name.includes("Virgin")) return "#d60000";
      if (name.includes("Smooth")) return "#4a235a";
      if (name.includes("LBC")) return "#0a3871";
      if (name.includes("talkSPORT")) return "#007a33";
      if (name.includes("CNN")) return "#cc0000";
      if (name.includes("Al Jazeera")) return "#e06d10";
      if (name.includes("GB News")) return "#172b4d";
      if (name.includes("Times")) return "#1c2333";
      if (name.includes("Magic")) return "#273c75";
      if (name.includes("Jazz")) return "#2c3e50";
      if (name.includes("Fix")) return "#e67e22";
      if (name.includes("Boom")) return "#16a085";
      if (name.includes("BBC 1")) return "#4a1262";
      if (name.includes("BBC 2")) return "#dc4a00";
      if (name.includes("BBC 3")) return "#b71427";
      if (name.includes("BBC 4")) return "#00477e";
      if (name.includes("BBC 5")) return "#007a72";
      return "#18263f";
    }

    function generateStationLogo(title) {
      const bgColor = encodeURIComponent(getStationColor(title));
      const cleanTitle = encodeURIComponent(title);

      if (title.startsWith("BBC")) {
        const subTitle = encodeURIComponent(title.replace("BBC ", ""));
        return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><rect width="200" height="200" rx="20" fill="${bgColor}"/><g transform="translate(38, 46)"><rect x="0" y="0" width="36" height="36" rx="5" fill="%23ffffff"/><text x="18" y="26" font-family="sans-serif" font-weight="900" font-size="24" fill="%23000" text-anchor="middle">B</text><rect x="44" y="0" width="36" height="36" rx="5" fill="%23ffffff"/><text x="62" y="26" font-family="sans-serif" font-weight="900" font-size="24" fill="%23000" text-anchor="middle">B</text><rect x="88" y="0" width="36" height="36" rx="5" fill="%23ffffff"/><text x="106" y="26" font-family="sans-serif" font-weight="900" font-size="24" fill="%23000" text-anchor="middle">C</text></g><text x="100" y="142" font-family="sans-serif" font-weight="800" font-size="20" fill="%23ffffff" text-anchor="middle">${subTitle}</text></svg>`;
      }

      const words = title.split(" ");
      const initials = words.length > 1 ? (words[0][0] + words[1][0]).toUpperCase() : title.slice(0, 3).toUpperCase();

      return `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><rect width="200" height="200" rx="20" fill="${bgColor}"/><circle cx="100" cy="80" r="42" fill="rgba(255,255,255,0.15)"/><text x="100" y="93" font-family="sans-serif" font-weight="900" font-size="28" fill="%23ffffff" text-anchor="middle">${initials}</text><text x="100" y="152" font-family="sans-serif" font-weight="700" font-size="16" fill="%23ffffff" text-anchor="middle">${cleanTitle}</text></svg>`;
    }

    let memoryFavs = [];

    function getFavorites() {
      try {
        const stored = localStorage.getItem("uk_radio_favs");
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return memoryFavs;
      }
    }

    function saveFavorites(favs) {
      try {
        localStorage.setItem("uk_radio_favs", JSON.stringify(favs));
      } catch (e) {
        memoryFavs = favs;
      }
      updateFavCount();
    }

    function updateFavCount() {
      const favs = getFavorites();
      document.getElementById("favCount").innerText = favs.length;
    }

    function toggleFavorite(event, stationId) {
      event.preventDefault();
      event.stopPropagation();

      let favs = getFavorites();
      const index = favs.indexOf(stationId);

      if (index > -1) {
        favs.splice(index, 1);
      } else {
        favs.push(stationId);
      }

      saveFavorites(favs);

      if (isShowingFavsOnly) {
        renderStations();
      } else {
        const btn = event.currentTarget;
        btn.classList.toggle("active", favs.includes(stationId));
      }
    }

    function toggleFavoritesView() {
      isShowingFavsOnly = !isShowingFavsOnly;
      const favBtn = document.getElementById("favToggle");
      favBtn.classList.toggle("active", isShowingFavsOnly);

      const titleElem = document.getElementById("currentCategoryTitle");
      if (isShowingFavsOnly) {
        titleElem.innerText = "Favorite Stations";
      } else {
        const selected = categories.find(c => c.key === currentCategory);
        titleElem.innerText = selected ? selected.title : "Select Category";
      }

      renderStations();
    }

    function playStation(trigger) {
      if (trigger) {
        window.location.href = trigger;
      }
    }

    function buildCategoryModalOnce() {
      const container = document.getElementById("categoryOptions");
      container.innerHTML = "";

      const fragment = document.createDocumentFragment();
      categories.forEach(cat => {
        const item = document.createElement("div");
        item.className = `category-item ${cat.key === currentCategory ? 'selected' : ''}`;
        item.setAttribute("data-cat", cat.key);
        item.onclick = () => selectCategory(cat.key);

        item.innerHTML = `
          <div class="cat-info">
            <div class="cat-icon">${cat.icon}</div>
            <div class="cat-text">
              <h3>${cat.title}</h3>
              <p>${cat.desc}</p>
            </div>
          </div>
          <div class="cat-arrow">
            <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
          </div>
        `;
        fragment.appendChild(item);
      });
      container.appendChild(fragment);
    }

    function updateCategoryModalSelection() {
      const items = document.querySelectorAll(".category-item");
      items.forEach(el => {
        if (el.getAttribute("data-cat") === currentCategory) {
          el.classList.add("selected");
        } else {
          el.classList.remove("selected");
        }
      });
    }

    function openCategoryModal() {
      updateCategoryModalSelection();
      const modal = document.getElementById("categoryModal");
      const closeBtn = document.getElementById("modalCloseBtn");
      
      closeBtn.style.display = currentCategory ? "flex" : "none";
      modal.classList.add("active");
    }

    function closeCategoryModal() {
      document.getElementById("categoryModal").classList.remove("active");
    }

    function selectCategory(catKey) {
      currentCategory = catKey;
      try {
        localStorage.setItem("preferred_radio_category", catKey);
      } catch (e) {
        console.warn("Storage restricted", e);
      }

      const selected = categories.find(c => c.key === catKey);
      if (selected) {
        document.getElementById("currentCategoryTitle").innerText = selected.title;
      }

      isShowingFavsOnly = false;
      document.getElementById("favToggle").classList.remove("active");

      closeCategoryModal();
      renderStations();
    }

    function renderStations() {
      const grid = document.getElementById("radioGrid");
      const favs = getFavorites();
      grid.innerHTML = "";

      let stations = [];

      if (isShowingFavsOnly) {
        let allStations = [];
        for (let key in radioData) {
          allStations = allStations.concat(radioData[key]);
        }
        const uniqueStations = Array.from(new Map(allStations.map(s => [s.id, s])).values());
        stations = uniqueStations.filter(s => favs.includes(s.id));

        if (stations.length === 0) {
          grid.innerHTML = `<div class="empty-msg">No favorite stations added yet.<br>Tap the heart icon on any station to add.</div>`;
          return;
        }
      } else {
        stations = radioData[currentCategory] || [];
      }

      const fragment = document.createDocumentFragment();

      stations.forEach(station => {
        const isFav = favs.includes(station.id);
        const card = document.createElement("div");
        card.className = "station-card";
        card.onclick = () => playStation(station.trigger);

        const logoUrl = (station.logo && station.logo.trim() !== "") ? station.logo : generateStationLogo(station.name);

        card.innerHTML = `
          <div class="thumb-wrapper">
            <img src="${logoUrl}" alt="${station.name}" class="station-logo" loading="lazy" decoding="async" onerror="this.onerror=null; this.src='${generateStationLogo(station.name)}'">
            <div class="fav-btn ${isFav ? 'active' : ''}" role="button" tabindex="0" onclick="toggleFavorite(event, '${station.id}')" title="Favorite">
              <svg viewBox="0 0 24 24">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
              </svg>
            </div>
            <div class="play-btn">
              <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
              </svg>
            </div>
          </div>
          <span class="station-name">${station.name}</span>
        `;

        fragment.appendChild(card);
      });

      grid.appendChild(fragment);
    }

    document.addEventListener("DOMContentLoaded", () => {
      buildCategoryModalOnce();
      updateFavCount();

      let savedCategory = null;
      try {
        savedCategory = localStorage.getItem("preferred_radio_category");
      } catch (e) {
        console.warn("Storage restricted", e);
      }

      if (savedCategory && radioData[savedCategory]) {
        selectCategory(savedCategory);
      } else {
        openCategoryModal();
      }
    });
  </script>
</body>
</html>
