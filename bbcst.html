<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>UK Radio Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent !important;
      outline: none;
      -webkit-touch-callout: none;
    }

    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      background-color: #0b111e;
      color: #ffffff;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      align-items: center;
      width: 100%;
    }

    .category-btn {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background-color: #131b2e;
      border: 1px solid #202d47;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
    }

    .category-btn span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .category-btn svg {
      width: 16px;
      height: 16px;
      fill: #8e9fb5;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .search-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      background-color: #131b2e;
      border: 1px solid #202d47;
      border-radius: 12px;
      color: #8e9fb5;
      cursor: pointer;
      flex-shrink: 0;
    }

    .search-btn svg {
      width: 18px;
      height: 18px;
      stroke: #8e9fb5;
      stroke-width: 2.2;
      fill: none;
    }

    .search-btn.active {
      background-color: #1e6bff;
      border-color: #1e6bff;
    }

    .search-btn.active svg {
      stroke: #ffffff;
    }

    .fav-toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 14px;
      background-color: #131b2e;
      border: 1px solid #202d47;
      border-radius: 12px;
      color: #8e9fb5;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .fav-toggle-btn.active {
      background-color: #1e6bff;
      border-color: #1e6bff;
      color: #ffffff;
    }

    /* Search Box */
    .search-container {
      display: none;
      width: 100%;
      margin-bottom: 14px;
    }

    .search-container.active {
      display: block;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .search-icon-inside {
      position: absolute;
      left: 14px;
      width: 16px;
      height: 16px;
      stroke: #8e9fb5;
      stroke-width: 2.2;
      fill: none;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 11px 40px;
      background-color: #131b2e;
      border: 1px solid #202d47;
      border-radius: 12px;
      color: #ffffff;
      font-size: 14px;
    }

    .search-input:focus {
      border-color: #1e6bff;
    }

    .search-clear-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #8e9fb5;
      font-size: 18px;
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    /* Grid & Cards - GPU Optimization */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
    }

    .station-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #131b2e;
      border: 1px solid #1c2842;
      border-radius: 16px;
      padding: 12px;
      color: #ffffff;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      contain: content; /* Rendering performance booster */
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 10px;
      background-color: #0a0f1d;
      flex-shrink: 0;
    }

    .station-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .play-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 34px;
      height: 34px;
      background: #1e6bff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .play-btn svg {
      width: 15px;
      height: 15px;
      fill: #ffffff;
      margin-left: 2px;
    }

    .fav-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #18233c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 5;
    }

    .fav-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #8e9fb5;
      stroke-width: 2.2;
      pointer-events: none;
    }

    .fav-btn.active svg {
      fill: #ff334b;
      stroke: #ff334b;
    }

    .station-name {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      pointer-events: none;
    }

    .empty-msg {
      grid-column: span 2;
      text-align: center;
      color: #8e9fb5;
      padding: 50px 10px;
      font-size: 14px;
      line-height: 1.6;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: #0b111e;
      z-index: 999;
      display: flex;
      flex-direction: column;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease, visibility 0.15s ease;
      contain: strict;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .modal-header h2 { font-size: 18px; font-weight: 800; color: #ffffff; }
    .modal-header p { font-size: 12px; color: #8e9fb5; margin-top: 2px; }

    .modal-close-btn {
      background: #18233c;
      border: 1px solid #283756;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
    }

    .modal-close-btn svg {
      width: 16px;
      height: 16px;
      stroke: #ffffff;
      stroke-width: 2.2;
    }

    .category-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 20px;
    }

    .category-item {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      background: #131b2e;
      border: 1.5px solid #1f2b45;
      border-radius: 14px;
      cursor: pointer;
      min-height: 108px;
    }

    .category-item.selected {
      background: linear-gradient(145deg, #162a52, #101a33);
      border-color: #1e6bff;
    }

    .cat-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 8px;
    }

    .cat-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #1a253e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .cat-check {
      display: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #1e6bff;
      align-items: center;
      justify-content: center;
    }

    .cat-check svg {
      width: 12px;
      height: 12px;
      stroke: #ffffff;
      stroke-width: 2.5;
      fill: none;
    }

    .category-item.selected .cat-check { display: flex; }

    .cat-text h3 {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cat-text p {
      font-size: 10.5px;
      color: #8e9fb5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>

      <svg><use href="#icon-arrow"/></svg>
    </button>

    <button id="searchToggleBtn" class="search-btn" onclick="toggleSearchBar()" title="Search">
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </button>

    <button id="favToggle" class="fav-toggle-btn" onclick="toggleFavoritesView()">
      <span>❤️ Favs</span> (<span id="favCount">0</span>)
    </button>
  </div>

  <!-- Search Input Bar -->
  <div id="searchContainer" class="search-container">
    <div class="search-input-wrapper">
      <svg class="search-icon-inside" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="Search any station..." 
        oninput="handleSearch(this.value)"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="clearSearchBtn" class="search-clear-btn" onclick="clearSearch()">✕</button>
    </div>
  </div>

  <!-- Station Grid Container (Event Delegation Active) -->
  <div id="radioGrid" class="grid-container"></div>

      </button>
    </div>
    <div class="category-list" id="categoryOptions"></div>
  </div>

    // ImageKit CDN URL Optimization Helper (forces 150px WebP)
    function optimizeThumb(url) {
      if (!url) return "";
      if (url.includes("imagekit.io")) {
        return url + (url.includes("?") ? "&" : "?") + "tr=w-150,q-75,f-webp";
      }
      return url;
    }

    function getAllStationsCached() {
      if (!cachedAllStations) {
        const set = new Map();
        for (const k in radioData) {
          radioData[k].forEach(s => {
            if (!set.has(s.id)) {
              set.set(s.id, { ...s, _search: s.name.toLowerCase() });
            }
          });
        }
        cachedAllStations = Array.from(set.values());
      }
      return cachedAllStations;
    }

    function getFavorites() {
      try {
        const stored = localStorage.getItem("uk_radio_favs");
        return stored ? JSON.parse(stored) : memoryFavs;
      } catch (e) {
        return memoryFavs;
      }
    }

    function saveFavorites(favs) {
      memoryFavs = favs;
      try {
        localStorage.setItem("uk_radio_favs", JSON.stringify(favs));
      } catch (e) {}
      document.getElementById("favCount").innerText = favs.length;
    }

    function toggleFavorite(stationId, btnElem) {
      let favs = getFavorites();
      const idx = favs.indexOf(stationId);
      if (idx > -1) favs.splice(idx, 1);
      else favs.push(stationId);
      saveFavorites(favs);

      if (isShowingFavsOnly) renderStations();
      else if (btnElem) btnElem.classList.toggle("active", favs.includes(stationId));
    }

    function toggleFavoritesView() {
      isShowingFavsOnly = !isShowingFavsOnly;
      document.getElementById("favToggle").classList.toggle("active", isShowingFavsOnly);
      if (isSearchOpen) closeSearchBar(false);
      document.getElementById("currentCategoryTitle").innerText = isShowingFavsOnly 
        ? "Favorites" 
        : (categories.find(c => c.key === currentCategory)?.title || "Select Category");
      renderStations();
    }

    function playStation(trigger) {
      if (trigger) window.location.href = trigger;
    }

    function handleSearch(val) {
      const trimmed = val.trim();
      document.getElementById("clearSearchBtn").style.display = trimmed ? "block" : "none";
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        searchQuery = trimmed.toLowerCase();
        renderStations();
      }, 120);
    }

    function clearSearch() {
      clearTimeout(searchDebounceTimer);
      searchQuery = "";
      const inp = document.getElementById("searchInput");
      if (inp) inp.value = "";
      document.getElementById("clearSearchBtn").style.display = "none";
      renderStations();
    }

    function toggleSearchBar() {
      isSearchOpen ? closeSearchBar(true) : openSearchBar();
    }

    function openSearchBar() {
      isSearchOpen = true;
      document.getElementById("searchContainer").classList.add("active");
      document.getElementById("searchToggleBtn").classList.add("active");
      document.getElementById("searchInput").focus();
      history.pushState({ view: "search" }, "");
    }

    function closeSearchBar(shouldGoBack = true) {
      if (!isSearchOpen) return;
      isSearchOpen = false;
      document.getElementById("searchContainer").classList.remove("active");
      document.getElementById("searchToggleBtn").classList.remove("active");
      clearSearch();
      if (shouldGoBack && history.state?.view === "search") history.back();
    }

    function buildCategoryModalOnce() {
      const container = document.getElementById("categoryOptions");
      let html = "";
      categories.forEach(cat => {
        html += `
          <div class="category-item ${cat.key === currentCategory ? 'selected' : ''}" data-cat="${cat.key}">
            <div class="cat-top-row">
              <div class="cat-icon">${cat.icon}</div>
              <div class="cat-check">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </div>
            </div>
            <div class="cat-text">
              <h3>${cat.title}</h3>
              <p>${cat.desc}</p>
            </div>
          </div>`;
      });
      container.innerHTML = html;

      // Event delegation for Category selection
      container.addEventListener("click", (e) => {
        const item = e.target.closest(".category-item");
        if (item) selectCategory(item.dataset.cat);
      });
    }

    function openCategoryModal() {
      document.querySelectorAll(".category-item").forEach(el => {
        el.classList.toggle("selected", el.dataset.cat === currentCategory);
      });
      document.getElementById("modalCloseBtn").style.display = currentCategory ? "flex" : "none";
      document.getElementById("categoryModal").classList.add("active");
      history.pushState({ view: "modal" }, "");
    }

    function closeCategoryModal(shouldGoBack = true) {
      const modal = document.getElementById("categoryModal");
      if (modal.classList.contains("active")) {
        modal.classList.remove("active");
        if (shouldGoBack && history.state?.view === "modal") history.back();
      }
    }

    function selectCategory(catKey) {
      currentCategory = catKey;
      try { localStorage.setItem("preferred_radio_category", catKey); } catch(e) {}
      const sel = categories.find(c => c.key === catKey);
      if (sel) document.getElementById("currentCategoryTitle").innerText = sel.title;
      isShowingFavsOnly = false;
      document.getElementById("favToggle").classList.remove("active");
      if (isSearchOpen) closeSearchBar(false);
      closeCategoryModal(true);
      renderStations();
    }

    /* Fast InnerHTML Renderer */
    function renderStations() {
      const grid = document.getElementById("radioGrid");
      const favs = getFavorites();
      let list = [];

      if (searchQuery !== "") {
        list = getAllStationsCached().filter(s => s._search.includes(searchQuery));
        if (!list.length) {
          grid.innerHTML = `<div class="empty-msg">No station found matching "<b>${searchQuery}</b>"</div>`;
          return;
        }
      } else if (isShowingFavsOnly) {
        list = getAllStationsCached().filter(s => favs.includes(s.id));
        if (!list.length) {
          grid.innerHTML = `<div class="empty-msg">No favorite stations added yet.<br>Tap the heart icon on any station to add.</div>`;
          return;
        }
      } else {
        list = radioData[currentCategory] || [];
      }

      let out = "";
      for (let i = 0; i < list.length; i++) {
        const s = list[i];
        const isFav = favs.includes(s.id);
        const img = optimizeThumb(s.logo);

        out += `
          <div class="station-card" data-trigger="${s.trigger}">
            <div class="thumb-wrapper">
              <img src="${img}" alt="${s.name}" class="station-logo" loading="lazy" decoding="async">
              <div class="fav-btn ${isFav ? 'active' : ''}" data-id="${s.id}">
                <svg><use href="#icon-heart"/></svg>
              </div>
              <div class="play-btn">
                <svg><use href="#icon-play"/></svg>
              </div>
            </div>
            <span class="station-name">${s.name}</span>
          </div>`;
      }
      grid.innerHTML = out;
    }

    /* Single Event Delegation for Whole Grid */
    document.getElementById("radioGrid").addEventListener("click", (e) => {
      const favBtn = e.target.closest(".fav-btn");
      if (favBtn) {
        e.stopPropagation();
        toggleFavorite(favBtn.dataset.id, favBtn);
        return;
      }
      const card = e.target.closest(".station-card");
      if (card && card.dataset.trigger) {
        playStation(card.dataset.trigger);
      }
    });

    window.addEventListener("popstate", () => {
      const modal = document.getElementById("categoryModal");
      if (modal.classList.contains("active")) { closeCategoryModal(false); return; }
      if (isSearchOpen) { closeSearchBar(false); return; }
    });

    document.addEventListener("DOMContentLoaded", () => {
      buildCategoryModalOnce();
      document.getElementById("favCount").innerText = getFavorites().length;
      let saved = null;
      try { saved = localStorage.getItem("preferred_radio_category"); } catch(e) {}
      selectCategory(saved && radioData[saved] ? saved : "pop_hits");
    });
  </script>
