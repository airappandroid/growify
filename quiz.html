<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cricket Quiz & Fan Titles</title>
  <style>
    :root {
      --primary: #0f5132;
      --primary-glow: #198754;
      --accent: #ffb703;
      --bg: #0b0f19;
      --surface: #131b2e;
      --surface-card: #1c2640;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --correct: #10b981;
      --wrong: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 16px 14px 40px 14px;
      min-height: 100vh;
    }

    /* Top Bar */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .quiz-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 183, 3, 0.15);
      color: var(--accent);
    }

    /* Progress Bar */
    .progress-wrapper {
      margin-bottom: 20px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: var(--surface);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, var(--primary-glow), var(--accent));
      transition: width 0.3s ease;
      border-radius: 10px;
    }

    /* Question Card */
    .quiz-card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      margin-bottom: 18px;
    }

    .question-text {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.45;
      color: #ffffff;
      margin-bottom: 18px;
    }

    /* Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      color: #e2e8f0;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }

    .option-btn:active {
      transform: scale(0.98);
    }

    .option-btn.correct {
      background: rgba(16, 185, 129, 0.18) !important;
      border-color: var(--correct) !important;
      color: #6ee7b7 !important;
    }

    .option-btn.wrong {
      background: rgba(239, 68, 68, 0.18) !important;
      border-color: var(--wrong) !important;
      color: #fca5a5 !important;
    }

    .option-btn.disabled {
      pointer-events: none;
      opacity: 0.75;
    }

    /* Trivia Insight Box */
    .trivia-box {
      display: none;
      background: rgba(15, 81, 50, 0.25);
      border-left: 4px solid var(--accent);
      border-radius: 0 12px 12px 0;
      padding: 12px 14px;
      margin-top: 16px;
      font-size: 0.85rem;
      color: #e2e8f0;
      line-height: 1.45;
    }

    .trivia-box strong {
      color: var(--accent);
      display: block;
      margin-bottom: 2px;
    }

    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #064e3b, #047857);
      color: #ffffff;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 14px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(6, 78, 59, 0.35);
      display: none;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    /* Result & Badge Screen */
    .result-container {
      display: none;
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    .badge-icon {
      font-size: 3.2rem;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 10px rgba(255, 183, 3, 0.4));
    }

    .fan-title-tag {
      display: inline-block;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--accent);
      background: rgba(255, 183, 3, 0.12);
      border: 1px solid rgba(255, 183, 3, 0.3);
      padding: 6px 16px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .score-circle {
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, #047857, #062c1e);
      border: 3px solid var(--accent);
      border-radius: 50%;
      margin: 0 auto 14px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: #ffffff;
    }

    .score-circle span {
      font-size: 0.68rem;
      color: #a7f3d0;
      font-weight: 600;
    }

    .result-desc {
      font-size: 0.88rem;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 22px;
    }

    /* Share Button */
    .share-btn {
      width: 100%;
      background: linear-gradient(135deg, #25d366, #128c7e);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .share-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="quiz-header">
    <div class="quiz-title">🏆 Cricket IQ: PAK vs ENG</div>
    <span class="badge-pill" id="score-counter">Score: 0</span>
  </div>

  <!-- Quiz Screen -->
  <div id="quiz-screen">
    <div class="progress-wrapper">
      <div class="progress-meta">
        <span id="question-count">Question 1 of 5</span>
        <span style="color: var(--accent); font-weight: 700;">Unlock Fan Badge</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <div class="quiz-card">
      <div id="question-text" class="question-text">Loading question...</div>
      <div id="options-container" class="options-grid"></div>
      
      <div id="trivia-box" class="trivia-box">
        <strong>💡 Did You Know?</strong>
        <span id="trivia-fact"></span>
      </div>
    </div>

    <button id="next-btn" class="action-btn" onclick="nextQuestion()">Next Question →</button>
  </div>

  <!-- Result Screen with Fan Titles -->
  <div id="result-screen" class="result-container">
    <div id="badge-icon" class="badge-icon">👑</div>
    <div id="fan-title" class="fan-title-tag">Cricket Genius</div>

    <div class="score-circle">
      <div id="final-score">0/5</div>
      <span>SCORE</span>
    </div>

    <p id="result-desc" class="result-desc">You are an absolute master of cricket trivia!</p>

    <!-- WhatsApp Share Button -->
    <button class="share-btn" onclick="shareTitle()">
      <span>💬 Share Badge on WhatsApp</span>
    </button>

    <button class="action-btn" style="display: block; background: var(--surface); border-color: var(--border); color: #cbd5e1;" onclick="restartQuiz()">
      🔄 Play Again
    </button>
  </div>

  <script>
    const questions = [
      {
        question: "Who was the captain of Pakistan when they defeated England in the final to win the 1992 Cricket World Cup?",
        options: ["Wasim Akram", "Imran Khan", "Javed Miandad", "Inzamam-ul-Haq"],
        correct: 1,
        trivia: "Imran Khan led Pakistan to their historic 1992 World Cup triumph, beating England by 22 runs at the MCG."
      },
      {
        question: "Which team did England defeat in Melbourne to lift the ICC Men's T20 World Cup 2022 trophy?",
        options: ["Pakistan", "India", "New Zealand", "South Africa"],
        correct: 0,
        trivia: "England defeated Pakistan by 5 wickets in the 2022 T20 World Cup final with Ben Stokes hitting the winning runs."
      },
      {
        question: "In the 2016 Lord's Test against England, which Pakistan captain famously celebrated his century with push-ups?",
        options: ["Younis Khan", "Azhar Ali", "Misbah-ul-Haq", "Sarfaraz Ahmed"],
        correct: 2,
        trivia: "Misbah-ul-Haq did 10 push-ups at Lord's after scoring a magnificent hundred at the age of 42 as a tribute to the army fitness camp."
      },
      {
        question: "Who was named the 'Player of the Match' in the iconic 1992 World Cup Final between Pakistan and England?",
        options: ["Imran Khan", "Derek Pringle", "Mushtaq Ahmed", "Wasim Akram"],
        correct: 3,
        trivia: "Wasim Akram turned the final with his memorable swing bowling (3/49) and a quickfire 33 off just 18 balls."
      },
      {
        question: "Which English batsman scored a blistering triple century (317 runs) against Pakistan in the 2024 Multan Test?",
        options: ["Joe Root", "Harry Brook", "Ben Duckett", "Zak Crawley"],
        correct: 1,
        trivia: "Harry Brook smashed 317 off 322 balls against Pakistan in Multan in October 2024."
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let earnedTitle = "";

    function loadQuestion() {
      const q = questions[currentIdx];
      document.getElementById('question-text').innerText = q.question;
      document.getElementById('question-count').innerText = `Question ${currentIdx + 1} of ${questions.length}`;
      document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
      
      const optContainer = document.getElementById('options-container');
      optContainer.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span>${opt}</span><span>→</span>`;
        btn.onclick = () => selectOption(idx, btn);
        optContainer.appendChild(btn);
      });

      document.getElementById('trivia-box').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
    }

    function selectOption(selectedIdx, selectedBtn) {
      const q = questions[currentIdx];
      const buttons = document.querySelectorAll('.option-btn');

      buttons.forEach((btn, idx) => {
        btn.classList.add('disabled');
        if (idx === q.correct) {
          btn.classList.add('correct');
          btn.innerHTML = `<span>${q.options[idx]}</span><span>✓</span>`;
        }
      });

      if (selectedIdx === q.correct) {
        score++;
        document.getElementById('score-counter').innerText = `Score: ${score}`;
      } else {
        selectedBtn.classList.add('wrong');
        selectedBtn.innerHTML = `<span>${q.options[selectedIdx]}</span><span>✗</span>`;
      }

      document.getElementById('trivia-fact').innerText = q.trivia;
      document.getElementById('trivia-box').style.display = 'block';
      document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
      currentIdx++;
      if (currentIdx < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'block';
      document.getElementById('final-score').innerText = `${score}/${questions.length}`;

      const iconEl = document.getElementById('badge-icon');
      const titleEl = document.getElementById('fan-title');
      const descEl = document.getElementById('result-desc');

      if (score === 5) {
        earnedTitle = "👑 Cricket Genius & Legend";
        iconEl.innerText = "👑";
        titleEl.innerText = earnedTitle;
        descEl.innerText = "Flawless performance! You know PAK vs ENG cricket history inside out.";
      } else if (score === 4) {
        earnedTitle = "🏆 Pro Cricket Analyst";
        iconEl.innerText = "🏆";
        titleEl.innerText = earnedTitle;
        descEl.innerText = "Superb knowledge! You're one step away from a perfect score.";
      } else if (score === 3) {
        earnedTitle = "🎖️ True Cricket Fan";
        iconEl.innerText = "🎖️";
        titleEl.innerText = earnedTitle;
        descEl.innerText = "Great effort! A solid foundation of classic cricket trivia.";
      } else {
        earnedTitle = "🧢 Rookie Supporter";
        iconEl.innerText = "🧢";
        titleEl.innerText = earnedTitle;
        descEl.innerText = "Keep practicing and testing your cricket trivia!";
      }
    }

    function shareTitle() {
      const shareText = `🏏 I scored ${score}/5 in the Pakistan vs England Cricket Quiz and earned the title "${earnedTitle}"! 🏆 Test your cricket knowledge now!`;
      const whatsappURL = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
      window.open(whatsappURL, '_blank');
    }

    function restartQuiz() {
      currentIdx = 0;
      score = 0;
      document.getElementById('score-counter').innerText = `Score: 0`;
      document.getElementById('result-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
