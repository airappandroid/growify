<!DOCTYPE html>
<html lang="as">
<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --bg-main: #0d1117;
      --bg-card: #161b22;
      --bg-header: #121820;
      --bg-live: #132d22;
      --border-color: #30363d;
      --border-live: #10b981;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --accent-green: #10b981;
      --accent-cyan: #38bdf8;
      --accent-amber: #f59e0b;
      --font-system: system-ui, -apple-system, Roboto, sans-serif;
      --font-mono: ui-monospace, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-system);
      text-rendering: optimizeSpeed;
    }

    body {
      min-height: 100vh;
      line-height: 1.4;
      padding: max(8px, env(safe-area-inset-top)) 10px max(24px, env(safe-area-inset-bottom));
    }

    .app-container { max-width: 640px; margin: 0 auto; }

    .header-box { text-align: center; padding: 6px 0; }

    .tag-air {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      background: #121d2f;
      border: 1px solid #1e3a5f;
      color: var(--accent-cyan);
      font-size: 11px;
      font-weight: 700;
      border-radius: 20px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      flex-shrink: 0;
    }

    .main-title { font-size: 20px; font-weight: 800; }
    .frequency-line { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .frequency-line strong { color: var(--accent-cyan); font-family: var(--font-mono); }
    .frequency-line .fm { color: var(--accent-green); font-family: var(--font-mono); }

    .clock-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 12px;
      margin-top: 10px;
      font-size: 12px;
    }

    .live-clock-digits {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-cyan);
      background: #0d1117;
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid #1f2937;
    }

    .card-now-playing {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
    }

    .card-now-playing.is-active {
      border-color: var(--accent-green);
    }

    .card-header-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .badge-live-now {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-green);
      text-transform: uppercase;
    }

    .card-actions { display: flex; align-items: center; gap: 6px; }

    .badge-slot-time {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent-cyan);
      background: #121e2c;
      padding: 2px 6px;
      border-radius: 5px;
    }

    .btn-play-station {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--accent-green);
      color: #041f14;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 15px;
      text-decoration: none;
    }

    .now-title { font-size: 15px; font-weight: 700; line-height: 1.3; }
    .now-desc { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }

    .progress-track { margin-top: 10px; padding-top: 8px; border-top: 1px solid #21262d; }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .progress-meta .time-left { color: var(--accent-green); font-weight: 600; }
    .progress-bar-outer { width: 100%; height: 5px; background: #21262d; border-radius: 5px; overflow: hidden; }
    .progress-bar-inner { height: 100%; width: 0%; background: var(--accent-green); border-radius: 5px; }

    .card-next-up {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      gap: 8px;
    }
    .next-tag { font-size: 9.5px; font-weight: 700; color: var(--accent-amber); text-transform: uppercase; }
    .next-title { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
    .next-time-box { text-align: right; flex-shrink: 0; }
    .next-time-badge {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--accent-amber);
      background: #291807;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .next-countdown { display: block; font-size: 9.5px; color: var(--text-muted); font-family: var(--font-mono); margin-top: 2px; }

    .schedule-wrapper {
      margin-top: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
    }
    .table-head-row {
      display: flex;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .col-time-head { width: 105px; min-width: 105px; padding: 8px 10px; border-right: 1px solid var(--border-color); }
    .col-prog-head { flex: 1; padding: 8px 10px; }

    .schedule-row {
      display: flex;
      border-bottom: 1px solid #21262d;
      content-visibility: auto;
      contain-intrinsic-size: 65px;
    }
    .schedule-row:last-child { border-bottom: none; }
    .schedule-row.live-active {
      background: var(--bg-live);
      border-left: 3px solid var(--accent-green);
    }
    .schedule-row.live-active .time-range { color: var(--accent-green); }
    .schedule-row.live-active .prog-title { color: #a7f3d0; }

    .col-time {
      width: 105px;
      min-width: 105px;
      padding: 10px 8px;
      border-right: 1px solid #21262d;
      font-family: var(--font-mono);
      font-size: 11px;
    }
    .time-sep { font-size: 9px; color: var(--text-muted); display: block; }
    .live-indicator-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: #0d261b;
      color: var(--accent-green);
      font-size: 8.5px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 3px;
      margin-top: 4px;
    }

    .col-prog { flex: 1; padding: 10px 10px; min-width: 0; }
    .prog-title { font-size: 13px; font-weight: 700; line-height: 1.3; }
    .prog-desc { font-size: 11.5px; color: var(--text-secondary); margin-top: 3px; }

    .footer-credits {
      text-align: center;
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 16px;
      padding-bottom: 8px;
    }
  </style>
</head>

    // Helper: Fast minute-to-12hr conversion
    function minTo12(m) {
      let h = Math.floor(m / 60);
      let min = m % 60;
      let ap = h >= 12 ? 'PM' : 'AM';
      let h12 = h % 12 || 12;
      return `${h12 < 10 ? '0' : ''}${h12}:${min < 10 ? '0' : ''}${min} ${ap}`;
    }

    function fmtRemaining(sec) {
      if (sec <= 0) return "0s";
      let m = Math.floor(sec / 60);
      let s = sec % 60;
      return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : (m > 0 ? `${m}m ${s}s` : `${s}s`);
    }

    // Cache DOM references
    const $ = id => document.getElementById(id);
    const UI = {
      date: $('liveDateText'),
      clock: $('liveClockDisplay'),
      nowCard: $('liveNowCard'),
      nowTitle: $('liveProgTitle'),
      nowDesc: $('liveProgDesc'),
      nowSlot: $('liveSlotBadge'),
      elapsed: $('liveElapsed'),
      remaining: $('liveRemaining'),
      progBar: $('liveProgressBar'),
      nextTitle: $('nextProgTitle'),
      nextTime: $('nextProgTime'),
      nextCountdown: $('nextCountdownText'),
      list: $('scheduleList')
    };

    let activeIndex = -1;
    let rendered = false;

    function renderListOnce() {
      let html = '';
      for (let i = 0; i < SCH.length; i++) {
        const item = SCH[i];
        html += `
          <div class="schedule-row" id="row-${i}">
            <div class="col-time">
              <span>${minTo12(item[0])}</span>
              <span class="time-sep">to</span>
              <span>${minTo12(item[1])}</span>
              <div class="live-indicator-chip" id="chip-${i}" style="display:none;">
                <span class="pulse-dot"></span><span>LIVE</span>
              </div>
            </div>
            <div class="col-prog">
              <h3 class="prog-title">${item[2]}</h3>
              <p class="prog-desc">${item[3]}</p>
            </div>
          </div>`;
      }
      UI.list.innerHTML = html;
      rendered = true;
    }

    function tick() {
      // Direct IST timestamp calculation without heavy string parsing
      const d = new Date();
      const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
      const ist = new Date(utc + 19800000); // UTC + 5:30

      const hrs = ist.getHours();
      const mins = ist.getMinutes();
      const secs = ist.getSeconds();
      const effMin = hrs * 60 + mins + (secs / 60);

      const h12 = hrs % 12 || 12;
      const ap = hrs >= 12 ? 'PM' : 'AM';
      UI.clock.textContent = `${h12 < 10 ? '0' : ''}${h12}:${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs} ${ap}`;
      UI.date.textContent = ist.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });

      // Find active program
      let newActiveIndex = -1;
      for (let i = 0; i < SCH.length; i++) {
        if (effMin >= SCH[i][0] && effMin < SCH[i][1]) {
          if (newActiveIndex === -1 || (SCH[i][1] - SCH[i][0] < SCH[newActiveIndex][1] - SCH[newActiveIndex][0])) {
            newActiveIndex = i;
          }
        }
      }

      // Find next program
      let nextIndex = -1;
      if (newActiveIndex !== -1) {
        for (let i = 0; i < SCH.length; i++) {
          if (SCH[i][0] >= SCH[newActiveIndex][1]) {
            nextIndex = i;
            break;
          }
        }
      } else {
        for (let i = 0; i < SCH.length; i++) {
          if (SCH[i][0] > effMin) {
            nextIndex = i;
            break;
          }
        }
      }

      // Update Live UI
      if (newActiveIndex !== -1) {
        const cur = SCH[newActiveIndex];
        UI.nowCard.classList.add('is-active');
        UI.nowTitle.textContent = cur[2];
        UI.nowDesc.textContent = cur[3];
        UI.nowSlot.textContent = `${minTo12(cur[0])} - ${minTo12(cur[1])}`;

        const dur = (cur[1] - cur[0]) * 60;
        const el = Math.max(0, (effMin - cur[0]) * 60);
        const rem = Math.max(0, dur - el);
        UI.progBar.style.width = `${Math.min(100, (el / dur) * 100).toFixed(1)}%`;
        UI.elapsed.textContent = `${Math.floor(el / 60)}m পাৰ হৈছে`;
        UI.remaining.textContent = `${fmtRemaining(Math.round(rem))} বাকী`;
      } else {
        UI.nowCard.classList.remove('is-active');
        UI.nowTitle.textContent = "সম্প্ৰচাৰ বন্ধ (Off-Air)";
        UI.nowDesc.textContent = "বৰ্তমান আকাশবাণী গুৱাহাটীৰ সম্প্ৰচাৰ বন্ধ আছে।";
        UI.nowSlot.textContent = "Off-Air";
        UI.progBar.style.width = '0%';
        UI.elapsed.textContent = '';
        UI.remaining.textContent = '';
      }

      // Update Next UI
      if (nextIndex !== -1) {
        const nxt = SCH[nextIndex];
        UI.nextTitle.textContent = nxt[2];
        UI.nextTime.textContent = minTo12(nxt[0]);
        const diffSec = Math.round((nxt[0] - effMin) * 60);
        UI.nextCountdown.textContent = diffSec > 0 ? `${fmtRemaining(diffSec)} পিছত` : "শীঘ্ৰে আৰম্ভ হ'ব";
      } else {
        UI.nextTitle.textContent = SCH[0][2];
        UI.nextTime.textContent = minTo12(SCH[0][0]);
        UI.nextCountdown.textContent = "কাইলৈ পুৱা";
      }

      // Update Active class in Schedule list only when changed
      if (newActiveIndex !== activeIndex) {
        if (activeIndex !== -1) {
          const oldRow = $(`row-${activeIndex}`);
          const oldChip = $(`chip-${activeIndex}`);
          if (oldRow) oldRow.classList.remove('live-active');
          if (oldChip) oldChip.style.display = 'none';
        }
        if (newActiveIndex !== -1) {
          const newRow = $(`row-${newActiveIndex}`);
          const newChip = $(`chip-${newActiveIndex}`);
          if (newRow) newRow.classList.add('live-active');
          if (newChip) newChip.style.display = 'inline-flex';
        }
        activeIndex = newActiveIndex;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderListOnce();
      tick();
      setInterval(tick, 1000);
    });
  </script>
</body>
</html>
