<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Full Scorecard</title>
<style>
:root{
  --bg:#080d19;--card:#111a2b;--card2:#18243a;--text:#f5f7ff;
  --muted:#91a0bb;--accent:#ff8757;--green:#4ade80;--line:rgba(255,255,255,.085);
  --yellow:#fbbf24;--blue:#7c9cff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px Inter,Arial,Roboto,sans-serif}
body{-webkit-tap-highlight-color:transparent;background:radial-gradient(ellipse at 50% -15%,rgba(72,105,180,.18),transparent 48%),var(--bg)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.container{width:100%;max-width:680px;margin:0 auto;padding:16px 13px 28px}
.match-card{position:relative;overflow:hidden;background:linear-gradient(145deg,#1a2944 0%,#111a2b 72%);border:1px solid rgba(155,180,255,.15);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 14px 38px rgba(0,0,0,.22)}
.match-card:before{content:"";position:absolute;width:190px;height:190px;right:-85px;top:-105px;border-radius:50%;background:rgba(124,156,255,.12);pointer-events:none}
.status-row{position:relative;display:flex;align-items:center;gap:8px;color:var(--green);font-weight:800;font-size:10px;letter-spacing:1px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px currentColor}
.status-text{margin-left:auto;color:var(--muted);font-weight:500;letter-spacing:0}
.match-title{position:relative;font-size:17px;font-weight:800;margin-top:15px;line-height:1.4;letter-spacing:-.2px}
.match-note{position:relative;font-size:12px;color:#aebbd2;margin-top:6px;line-height:1.5}
.teams{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:17px}
.team{min-width:0;background:rgba(5,11,23,.36);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:13px}
.team-head{display:flex;align-items:center;gap:8px;min-height:30px}
.team-logo{width:29px;height:29px;object-fit:contain;flex-shrink:0}
.team-name{font-size:12px;font-weight:800;overflow-wrap:anywhere}
.team-score{font-size:clamp(18px,5vw,22px);font-weight:850;margin-top:10px;overflow-wrap:anywhere;line-height:1.3;letter-spacing:-.4px}
.team-overs{display:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none;overscroll-behavior-x:contain}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:10px 15px;font-weight:700;font-size:12px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#171b27}
.innings-card,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-bottom:15px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.innings-head{padding:14px;background:linear-gradient(100deg,#1b2942,#172238);display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.innings-name{font-weight:800;font-size:14px}
.innings-total{text-align:right;font-size:17px;font-weight:850;white-space:nowrap}
.innings-sub{font-size:11px;color:var(--muted);font-weight:500;margin-top:4px}
.table-wrap{width:100%;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.score-table{width:100%;border-collapse:collapse;min-width:320px;table-layout:fixed;font-size:12px}
.score-table th{background:rgba(255,255,255,.025);color:var(--muted);font-size:10px;font-weight:700;text-align:right;padding:11px 4px;white-space:nowrap}
.score-table td{padding:12px 4px;border-top:1px solid var(--line);text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}
.score-table th:first-child,.score-table td:first-child{text-align:left;padding-left:12px;width:38%;min-width:110px;overflow-wrap:break-word;word-break:normal}
.score-table th:not(:first-child),.score-table td:not(:first-child){text-align:right;width:10.5%;padding:11px 2px;white-space:nowrap}
.score-table th:last-child,.score-table td:last-child{width:20%;padding-right:11px}
.player{font-weight:750;font-size:12px;overflow-wrap:break-word;word-break:normal;line-height:1.35}
.dismissal{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.35;font-weight:400}
.dismissal.not-out{color:var(--green);font-weight:700}
.total-row td{font-weight:800;background:rgba(255,255,255,.035)}
.section-label{padding:14px 13px 8px;font-weight:800;font-size:12px}
.extras-line{display:flex;justify-content:space-between;gap:12px;padding:10px 13px;color:var(--muted);font-size:12px}
.extras-line strong{color:var(--text)}
.fow{padding:0 13px 14px;color:var(--muted);font-size:11px;line-height:1.7}
.fow strong{color:var(--text)}
.fow-item{padding:3px 0;overflow-wrap:anywhere}
.fow-item span{white-space:nowrap}
.empty{padding:24px 15px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.countdown-box{margin:16px;padding:16px 14px;border-radius:16px;background:linear-gradient(120deg,rgba(255,135,87,.14),rgba(124,156,255,.08));border:1px solid rgba(255,135,87,.25)}
.countdown-title{text-align:center;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:12px}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.count-unit{padding:11px 4px;text-align:center;background:rgba(5,11,23,.52);border:1px solid rgba(255,255,255,.08);border-radius:12px}
.count-num{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.6px}
.count-label{font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.9px}
.panel-title{font-size:14px;font-weight:800;padding:14px;border-bottom:1px solid var(--line)}
.footer{text-align:center;color:#71809c;font-size:11px;padding:13px 5px 24px}
.error{color:#ffb49a}
@media(max-width:390px){
 .container{padding:11px 9px 24px}.match-card{padding:15px;border-radius:19px}
 .match-title{font-size:15px}.team{padding:10px}.team-name{font-size:11px}
 .team-logo{width:25px;height:25px}.score-table{font-size:11px}
 .score-table th{font-size:9px;padding:10px 2px}.score-table td{padding:11px 2px}
 .score-table th:first-child,.score-table td:first-child{padding-left:7px;width:36%;min-width:95px}
 .score-table th:last-child,.score-table td:last-child{padding-right:7px;width:20%}
 .player{font-size:11px}.dismissal{font-size:9px}
}
@media(max-width:330px){
 .container{padding:8px 5px}.team-score{font-size:16px}
 .innings-name{font-size:12px}.innings-total{font-size:14px}
 .score-table th,.score-table td{padding-left:1px;padding-right:1px}
 .score-table th:first-child,.score-table td:first-child{padding-left:4px;width:34%;min-width:85px}
 .score-table th:last-child,.score-table td:last-child{padding-right:4px;width:22%}
 .countdown{gap:5px}.count-unit{padding:10px 2px}
}
</style>
</head>
<body>

<main class="container">
  <section class="match-card">
    <div class="status-row"><span class="dot" id="statusDot"></span><span id="statusLabel">LOADING</span><span class="status-text" id="updatedTop">Updating...</span></div>
    <div class="match-title" id="matchTitle">Australia vs England, 1st T20I</div>
    <div class="match-note" id="matchNote">21 November 2026 · 1:45 PM IST · MCG</div>
    <div class="teams" id="teams"></div>
  </section>

  <div class="tabs" id="inningsTabs" aria-label="Innings navigation"></div>
<div id="scorecards"><div class="panel"><div class="empty">Loading full scorecard...</div></div></div>
  <section class="panel" id="currentPlayersPanel" hidden>
    <div class="panel-title">Current Batters</div><div id="currentBatters"></div>
    <div class="panel-title">Current Bowlers</div><div id="currentBowlers"></div>
  </section>
  <div class="footer" id="updated">Cricket Score App · Auto refresh every 2 minutes</div>
</main>

<script>
(function(){
'use strict';
const MATCH_TITLE='Australia vs England, 1st T20I';
const MATCH_ID='6a6db66678dcf065703144f8';
const MATCH_START=new Date('2026-11-21T13:45:00+05:30').getTime();
const MATCH_SCHEDULE_NOTE='21 November 2026 · 1:45 PM IST · Full scorecard will appear once play starts.';
const API='https://cricvoice2.aminurmarch.workers.dev/?matchId='+encodeURIComponent(MATCH_ID);
const REFRESH_MS=120000;

const $=id=>document.getElementById(id);
const val=v=>(v===null||v===undefined||v===''?'—':String(v));
const esc=v=>val(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const first=(...a)=>a.find(v=>v!==undefined&&v!==null&&v!=='');
let busy=false,hasData=false,lastData=null,activeInnings=0;

function isBeforeMatchStart(){
  return Date.now() < MATCH_START;
}
function updateCountdownValues(){
  const diff=Math.max(0,MATCH_START-Date.now());
  const days=Math.floor(diff/86400000);
  const hours=Math.floor((diff%86400000)/3600000);
  const mins=Math.floor((diff%3600000)/60000);
  const secs=Math.floor((diff%60000)/1000);
  if($('cdDays'))$('cdDays').textContent=String(days).padStart(2,'0');
  if($('cdHours'))$('cdHours').textContent=String(hours).padStart(2,'0');
  if($('cdMins'))$('cdMins').textContent=String(mins).padStart(2,'0');
  if($('cdSecs'))$('cdSecs').textContent=String(secs).padStart(2,'0');
}
function renderUpcomingCard(){
  $('statusLabel').textContent='UPCOMING';
  $('statusDot').style.background='var(--yellow)';
  $('matchTitle').textContent=MATCH_TITLE;
  $('matchNote').textContent=MATCH_SCHEDULE_NOTE;
  $('teams').innerHTML=
    '<div class="team"><div class="team-head"><div class="team-name">🇦🇺 Australia</div></div><div class="team-score">TBD</div></div>'+
    '<div class="team"><div class="team-head"><div class="team-name">🏴󠁧󠁢󠁥󠁮󠁧󠁿 England</div></div><div class="team-score">TBD</div></div>';
  $('inningsTabs').style.display='none';
  $('inningsTabs').innerHTML='';
  $('currentPlayersPanel').hidden=true;
  $('scorecards').innerHTML=
    '<section class="panel">'+
      '<div class="countdown-box">'+
        '<div class="countdown-title">1st T20I begins in</div>'+
        '<div class="countdown" id="matchCountdown">'+
          '<div class="count-unit"><div class="count-num" id="cdDays">--</div><div class="count-label">Days</div></div>'+
          '<div class="count-unit"><div class="count-num" id="cdHours">--</div><div class="count-label">Hours</div></div>'+
          '<div class="count-unit"><div class="count-num" id="cdMins">--</div><div class="count-label">Mins</div></div>'+
          '<div class="count-unit"><div class="count-num" id="cdSecs">--</div><div class="count-label">Secs</div></div>'+
        '</div>'+
      '</div>'+
      '<div class="empty">Match starts on 21 November 2026 at 1:45 PM IST.</div>'+
    '</section>';
  updateCountdownValues();
  $('updatedTop').textContent='Scheduled';
  $('updated').textContent='Match starts 21 Nov 2026 · 1:45 PM IST';
}

function getTeams(m){
  if(Array.isArray(m.teams)&&m.teams.length)return m.teams;
  const a=m.teama||m.team_a||{},b=m.teamb||m.team_b||{};
  return [a,b].filter(t=>Object.keys(t).length);
}
function cleanTeamScore(t){
  const full=first(t.scores_full,t.score_full);
  if(full!==undefined){
    const cleaned=String(full).replace(/\s*\(\s*ov\s*\)/i,'').trim();
    if(cleaned)return cleaned;
  }
  return first(t.scores,t.score,'—');
}
function teamName(t){return first(t.title,t.name,t.team_name,t.short_name,t.abbr,'Team');}
function teamScore(t){return cleanTeamScore(t);}
function renderTeams(m){
  const teams=getTeams(m);
  if(teams.length){
    $('teams').innerHTML=teams.slice(0,2).map(t=>{
      const logo=first(t.logo_url,t.thumb_url,t.image);
      return '<div class="team"><div class="team-head">'+(logo?'<img class="team-logo" src="'+esc(logo)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':'')+
        '<div class="team-name">'+esc(teamName(t))+'</div></div><div class="team-score">'+esc(teamScore(t))+'</div></div>';
    }).join('');
    return;
  }
  const scoreBySide={};
  inningsFrom(m).forEach(inn=>{
    const key=String(first(inn.key,''));
    const side=key.startsWith('a_')?'Australia':(key.startsWith('b_')?'England':'');
    if(side)scoreBySide[side]=String(first(inn.runs,'—'))+'/'+String(first(inn.wickets,'—'));
  });
  $('teams').innerHTML=['Australia','England'].map(name=>
    '<div class="team"><div class="team-head"><div class="team-name">'+esc(name)+'</div></div><div class="team-score">'+esc(first(scoreBySide[name],'—'))+'</div></div>'
  ).join('');
}
function asArray(v){return Array.isArray(v)?v:[];}
function inningsFrom(m){
  const list = m && m.innings_batting_order;
  return Array.isArray(list) ? list : [];
}
function getBatters(i){
  return asArray(first(i.player_batting_order, i.batsmen, []));
}
function getBowlers(i){
  return asArray(first(i.player_bowling_order, i.bowlers, []));
}
function scoreTotals(i){
  return {
    runs: first(i.runs, i.score_runs),
    wickets: first(i.wickets),
    overs: first(i.overs),
    rr: first(i.run_rate, i.runrate)
  };
}
function inningsLabel(i,index){
  const key=String(first(i.key,''));
  const side=key.startsWith('a_')?'Australia':(key.startsWith('b_')?'England':'');
  return first(i.name,i.innings_name,i.batting_team,side?side+' · Innings '+(index+1):'Innings '+(index+1));
}
function batterRow(p){
  const b = p.batting || {};
  const name = first(p.fullname, p.name, p.mobileName, p.player_name, 'Batter');
  const how = first(b.out_str, p.out_str, p.dismissal, '');
  const isNotOut = b.dismissed === false || p.dismissed === false || /not\s*out/i.test(String(how));
  return '<tr><td><div class="player">'+esc(name)+'</div>'+
    (how ? '<div class="dismissal'+(isNotOut?' not-out':'')+'">'+esc(how)+'</div>' :
      (isNotOut ? '<div class="dismissal not-out">not out</div>' : ''))+
    '</td>'+
    '<td>'+esc(first(b.runs,p.runs,p.r,0))+'</td>'+
    '<td>'+esc(first(b.balls,p.balls_faced,p.balls,p.b,0))+'</td>'+
    '<td>'+esc(first(b.fours,p.fours,0))+'</td>'+
    '<td>'+esc(first(b.sixes,p.sixes,0))+'</td>'+
    '<td>'+esc(first(b.strike_rate,p.strike_rate,p.sr,'—'))+'</td></tr>';
}
function bowlerRow(p){
  const b = p.bowling || {};
  return '<tr><td><div class="player">'+esc(first(p.fullname,p.name,p.mobileName,p.title,'Bowler'))+'</div></td>'+
    '<td>'+esc(first(b.overs,p.overs,p.o,'—'))+'</td>'+
    '<td>'+esc(first(b.maiden_overs,b.maidens,p.maidens,p.m,0))+'</td>'+
    '<td>'+esc(first(b.runs,p.runs_conceded,p.runs,p.r,0))+'</td>'+
    '<td>'+esc(first(b.wickets,p.wickets,p.w,0))+'</td>'+
    '<td>'+esc(first(b.economy,p.econ,p.economy_rate,'—'))+'</td></tr>';
}
function extrasText(i){
  const total = Number(first(i.extras, 0)) || 0;
  const bits = [
    ['b', Number(first(i.bye,0)) || 0],
    ['lb', Number(first(i.legbye,0)) || 0],
    ['w', Number(first(i.wide,0)) || 0],
    ['nb', Number(first(i.noball,0)) || 0],
    ['p', Number(first(i.penalty,0)) || 0]
  ];
  const detail = bits.filter(x=>x[1] > 0).map(x=>x[0]+' '+x[1]).join(', ');
  return '<div class="extras-line"><span>Extras'+(detail?' ('+esc(detail)+')':'')+'</span><strong>'+esc(total)+'</strong></div>';
}
function renderFow(i){
  const list=asArray(first(i.fows,i.fall_of_wickets,i.fall_of_wicket,[]));
  if(list.length){
    return '<div class="section-label">Fall of Wickets</div><div class="fow">'+list.map(w=>{
      if(typeof w==='string') return '<div class="fow-item">'+esc(w)+'</div>';
      const score=first(w.score_at_dismissal,w.score,w.runs,w.total,'—');
      const wicket=first(w.number,w.wicket,w.wkt,'—');
      const over=first(w.overs_at_dismissal,w.overs,w.over,'—');
      const name=first(w.name,w.batsman,w.player_name,'');
      return '<div class="fow-item"><strong>'+esc(wicket)+'/'+esc(score)+'</strong> <span>('+esc(over)+' ov)</span>'+(name?' — '+esc(name):'')+'</div>';
    }).join('')+'</div>';
  }
  const lw=i.last_wicket;
  if(lw&&typeof lw==='object'&&!Array.isArray(lw)&&Object.keys(lw).length)return '<div class="section-label">Fall of Wickets</div><div class="fow"><div class="fow-item"><strong>'+esc(first(lw.number,'—'))+'/'+esc(first(lw.score_at_dismissal,lw.runs,'—'))+'</strong> <span>('+esc(first(lw.overs_at_dismissal,lw.overs,'—'))+' ov)</span> — '+esc(first(lw.name,lw.batsman,'Batter'))+'</div></div>';
  const totals=scoreTotals(i);
  if(Number(totals.wickets)===0)return '<div class="section-label">Fall of Wickets</div><div class="fow">No wickets fallen</div>';
  return '';
}
function renderInnings(i,index){
  const total=scoreTotals(i);
  const batters=getBatters(i),bowlers=getBowlers(i);
  const ex=i;
  const didNotBat=asArray(first(i.yet_to_bat,i.did_not_bat,i.did_not_bat_list,[]));
  const totalText=(total.runs!==undefined?total.runs:'—')+'/'+(total.wickets!==undefined?total.wickets:'—');
  const oversText=(total.overs!==undefined&&total.overs!=='')?total.overs:'';
  const rrText=total.rr!==undefined?total.rr:'—';
  let out='<section class="innings-card" id="innings-'+index+'"><div class="innings-head"><div><div class="innings-name">'+esc(inningsLabel(i,index))+'</div><div class="innings-sub">Run Rate: '+esc(rrText)+'</div></div><div class="innings-total">'+esc(totalText)+(oversText!==''?'<div class="innings-sub">'+esc(oversText)+' overs</div>':'')+'</div></div>';
  if(batters.length){
    out+='<div class="table-wrap"><table class="score-table"><thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>'+batters.map(batterRow).join('')+
      '<tr class="total-row"><td>Innings Total</td><td colspan="5">'+esc(totalText)+'</td></tr></tbody></table></div>';
  }else out+='<div class="empty">Batting scorecard is not available in this API response.</div>';
  out+=extrasText(ex);
  if(bowlers.length){
    out+='<div class="section-label">Bowling</div><div class="table-wrap"><table class="score-table"><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr></thead><tbody>'+bowlers.map(bowlerRow).join('')+'</tbody></table></div>';
  }else out+='<div class="section-label">Bowling</div><div class="empty">Bowling figures are not available in this API response.</div>';
  if(didNotBat.length)out+='<div class="section-label">Did Not Bat</div><div class="fow">'+didNotBat.map(p=>esc(typeof p==='string'?p:first(p.name,p.title,p.player_name,'Player'))).join(', ')+'</div>';
  out+=renderFow(i)+'</section>';
  return out;
}
function renderCurrentPlayers(m){
  const bat=asArray(first(m.batsmen,m.batters,[]));
  const bowl=asArray(first(m.bowlers,[]));
  if(!bat.length&&!bowl.length){$('currentPlayersPanel').hidden=true;return;}
  $('currentPlayersPanel').hidden=false;
  $('currentBatters').innerHTML=bat.length?'<div class="table-wrap"><table class="score-table"><thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>'+bat.map(batterRow).join('')+'</tbody></table></div>':'<div class="empty">No batting details available.</div>';
  $('currentBowlers').innerHTML=bowl.length?'<div class="table-wrap"><table class="score-table"><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr></thead><tbody>'+bowl.map(bowlerRow).join('')+'</tbody></table></div>':'<div class="empty">No bowling details available.</div>';
}
function findCurrentInnings(innings,m){
  if(!innings.length)return 0;
  const ongoing=innings.findIndex(i=>
    Number(i.status)===3 ||
    /live|ongoing|in progress/i.test(String(first(i.status_str,i.innings_status,'')))
  );
  if(ongoing>=0)return ongoing;
  return innings.length-1;
}
function render(data){
  const m=data && data.responseData && data.responseData.result;
  const state=String(first(m.status_str,m.match_status,m.status,'SCORECARD'));
  const game=String(first(m.game_state_str,''));
  const note=first(m.status_note,m.note,m.match_note,'Innings scorecard');
  const breakNow=/innings?\s*break/i.test(game+' '+String(note));
  const live=/live|ongoing|in progress/i.test(state)&&!breakNow;
  $('statusLabel').textContent=breakNow?'INNINGS BREAK':(live?'LIVE MATCH':state.toUpperCase());
  $('statusDot').style.background=live?'var(--green)':(breakNow?'var(--yellow)':'#8996b2');
  $('matchTitle').textContent=MATCH_TITLE;
  $('matchNote').textContent=note||'T20I match · Full innings scorecard and player figures';
  renderTeams(m);

  const innings=inningsFrom(m);
  activeInnings=findCurrentInnings(innings,m);
  $('inningsTabs').style.display='none';
  $('inningsTabs').innerHTML='';
  renderScorecards(innings);
  $('currentPlayersPanel').hidden=true;
  const time=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
  $('updatedTop').textContent='Updated '+time;
  $('updated').textContent='Last updated: '+time+' · Auto refresh every 2 minutes';
}
function renderScorecards(innings){
  if(!innings.length){
    $('scorecards').innerHTML='<section class="panel"><div class="empty">Full scorecard is not available yet. Live match details may be shown here instead.</div></section>';
    return;
  }
  const order=innings.map((inn,index)=>({inn,index}))
    .sort((a,b)=>a.index===activeInnings?-1:(b.index===activeInnings?1:b.index-a.index));
  $('scorecards').innerHTML=order.map(item=>renderInnings(item.inn,item.index)).join('');
}
async function loadData(){
  if(isBeforeMatchStart()){
    renderUpcomingCard();
    return;
  }
  if(busy||document.hidden)return;
  busy=true;
  const ctrl=new AbortController();
  const timeout=setTimeout(()=>ctrl.abort(),10000);
  try{
    const res=await fetch(API,{cache:'no-store',signal:ctrl.signal});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const m=data && data.responseData && data.responseData.result;
    if(!m||typeof m!=='object')throw new Error('Invalid API response structure: expected responseData.result');
    lastData=data;render(data);hasData=true;
  }catch(err){
    if(!hasData){
      $('scorecards').innerHTML='<section class="panel"><div class="empty error">Unable to load scorecard. Please check your internet connection and try again.</div></section>';
      $('matchTitle').textContent=MATCH_TITLE;
      $('matchNote').textContent='Unable to connect right now. Please try again later.';
    }else{
      $('updatedTop').textContent='Connection issue';
      $('updated').textContent='Connection issue — showing last available scorecard';
    }
  }finally{clearTimeout(timeout);busy=false;}
}

if(isBeforeMatchStart()) renderUpcomingCard();
else loadData();

setInterval(()=>{
  if(isBeforeMatchStart()){
    if($('matchCountdown')) updateCountdownValues();
    else renderUpcomingCard();
  }else if(!hasData && !busy){
    loadData();
  }
},1000);
setInterval(loadData,REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadData();});
})();
</script>
