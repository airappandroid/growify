<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Full Scorecard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .scorecard-app {
            width: 100%;
            max-width: 550px;
            background: #161f30;
            border: 1px solid #283548;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Match Top Banner */
        .match-card-header {
            border-bottom: 1px solid #232e42;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .match-title {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            background-color: #64748b;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 10px;
            flex-shrink: 0;
            transition: background-color 0.3s ease;
        }

        .status-badge.live {
            background-color: #ef4444;
        }

        .status-badge.completed {
            background-color: #10b981;
        }

        .match-sub {
            font-size: 11.5px;
            color: #94a3b8;
            margin-top: 3px;
        }

        .status-text {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11.5px;
            margin-top: 8px;
            text-align: center;
            font-weight: 500;
        }

        .status-text.live {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .status-text.completed {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
        }

        /* Tabs (Horizontal Scrollable) */
        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 12px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #283548;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.2s ease-in-out;
        }

        .tab-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
        }

        /* Inning Summary Header */
        .inning-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #232e42;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #38bdf8;
            margin: 12px 0 6px 0;
        }

        /* Responsive Table Wrapper */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px;
            min-width: 320px;
        }

        th {
            color: #64748b;
            font-weight: 600;
            text-align: right;
            padding: 6px 4px;
            border-bottom: 1px solid #232e42;
            white-space: nowrap;
        }

        th:first-child {
            text-align: left;
        }

        td {
            padding: 6px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            text-align: right;
            color: #cbd5e1;
            white-space: nowrap;
        }

        td:first-child {
            text-align: left;
            white-space: normal;
        }

        .player-name {
            font-weight: 600;
            color: #f1f5f9;
        }

        .player-role {
            font-size: 10px;
            color: #38bdf8;
            margin-left: 2px;
        }

        .out-desc {
            font-size: 9.5px;
            color: #64748b;
            margin-top: 1px;
            line-height: 1.2;
        }

        .out-desc.not-out {
            color: #22c55e;
            font-weight: 600;
        }

        .num-bold {
            font-weight: 700;
            color: #ffffff;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #232e42;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 11.5px;
            margin-bottom: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: #94a3b8;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .fow-text {
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .dnb-text {
            font-size: 11.5px;
            color: #cbd5e1;
        }

        #loading, #error-msg {
            text-align: center;
            padding: 24px;
            font-size: 12.5px;
            color: #94a3b8;
        }

        .retry-btn {
            margin-top: 10px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .retry-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="scorecard-app">
        <div class="match-card-header">
            <div class="match-title">
                <span id="header-match">Match Scorecard</span>
                <span class="status-badge" id="header-status">...</span>
            </div>
            <div class="match-sub" id="header-venue">📍 -</div>
            <div class="status-text" id="header-note">Loading match details...</div>
        </div>

        <div class="tabs-container" id="tabs-container"></div>

        <div id="content-container">
            <div id="loading">Fetching scorecard data...</div>
        </div>
    </div>

    <script>
        const currentMatchId = "95254";
        // কেচিং এৰাবলৈ timestamp যোগ কৰা হৈছে
        const scorecardProxyUrl = `https://cricvoice2.aminurmarch.workers.dev/?matchId=${currentMatchId}&_t=${Date.now()}`;
        
        let matchData = null;
        let activeInningIndex = 0;

        async function loadScorecard() {
            const container = document.getElementById("content-container");
            container.innerHTML = `<div id="loading">Fetching scorecard data...</div>`;

            try {
                const res = await fetch(scorecardProxyUrl, { cache: "no-store" });
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                const json = await res.json();

                if (json.data && Array.isArray(json.data) && json.data.length > 0 && json.data[0].scoreCard) {
                    matchData = json.data[0].scoreCard;
                } else if (json.scoreCard) {
                    matchData = json.scoreCard;
                } else {
                    matchData = json;
                }

                if (!matchData || !Array.isArray(matchData.innings) || matchData.innings.length === 0) {
                    container.innerHTML = `<div id="loading">No scorecard details available.</div>`;
                    return;
                }

                // হেডাৰৰ তথ্য
                const subTitle = matchData.subtitle ? `${matchData.subtitle} • ` : '';
                const mainTitle = matchData.short_title || matchData.title || 'Scorecard';
                document.getElementById("header-match").textContent = `${subTitle}${mainTitle}`;

                // মেচ ষ্টেটাছ পৰীক্ষা (Live / Completed / Upcoming)
                const rawStatus = (matchData.status_str || matchData.game_state_str || matchData.status || "").toLowerCase();
                const isCompleted = rawStatus.includes("complete") || rawStatus.includes("finish") || rawStatus.includes("ended") || matchData.game_state === 3;
                const isLive = rawStatus.includes("live") || rawStatus.includes("in progress") || matchData.game_state === 2;

                const badgeEl = document.getElementById("header-status");
                const noteEl = document.getElementById("header-note");

                if (isCompleted) {
                    badgeEl.textContent = matchData.status_str || matchData.game_state_str || "Finished";
                    badgeEl.className = "status-badge completed";
                    noteEl.className = "status-text completed";
                } else if (isLive) {
                    badgeEl.textContent = matchData.status_str || matchData.game_state_str || "Live";
                    badgeEl.className = "status-badge live";
                    noteEl.className = "status-text live";
                } else {
                    badgeEl.textContent = matchData.status_str || matchData.game_state_str || "Scheduled";
                    badgeEl.className = "status-badge";
                    noteEl.className = "status-text";
                }

                // ফলাফল বা ষ্টেটাছ ন'ট
                const statusNote = matchData.status_note || matchData.result || matchData.status_text || matchData.live || (isCompleted ? "Match Finished" : "Match in progress");
                noteEl.textContent = statusNote;
                
                // ভেনিউ
                if (matchData.venue && (matchData.venue.name || matchData.venue.location)) {
                    const venueParts = [matchData.venue.name, matchData.venue.location].filter(Boolean);
                    document.getElementById("header-venue").textContent = `📍 ${venueParts.join(', ')}`;
                } else {
                    document.getElementById("header-venue").textContent = `📍 Venue details unavailable`;
                }

                // সৰ্বশেষ ইনিংছ নিৰ্বাচন
                activeInningIndex = matchData.innings.length - 1;

                renderInningTabs();
                renderInningDetails(activeInningIndex);
            } catch (err) {
                console.error("Scorecard fetch error:", err);
                container.innerHTML = `
                    <div id="error-msg">
                        Failed to load scorecard data.<br>
                        <button class="retry-btn" onclick="loadScorecard()">Retry</button>
                    </div>
                `;
            }
        }

        function renderInningTabs() {
            const tabs = document.getElementById("tabs-container");
            tabs.innerHTML = "";

            matchData.innings.forEach((inn, idx) => {
                const btn = document.createElement("button");
                btn.className = `tab-btn ${idx === activeInningIndex ? 'active' : ''}`;
                btn.textContent = inn.name || `Inning ${inn.number || idx + 1}`;
                btn.onclick = () => {
                    activeInningIndex = idx;
                    renderInningTabs();
                    renderInningDetails(idx);
                };
                tabs.appendChild(btn);

                if (idx === activeInningIndex) {
                    setTimeout(() => {
                        btn.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
                    }, 50);
                }
            });
        }

        function renderInningDetails(index) {
            const inn = matchData.innings[index];
            if (!inn) return;

            const container = document.getElementById("content-container");

            // বেটিং তালিকা
            let batHtml = "";
            (inn.batsmen || []).forEach(b => {
                const isNotOut = !b.how_out || b.how_out.toLowerCase().includes('not out');
                const outDesc = b.how_out || 'not out';

                batHtml += `
                    <tr>
                        <td>
                            <span class="player-name">${b.name || 'Unknown'}</span>
                            ${b.role_str ? `<span class="player-role">${b.role_str}</span>` : ''}
                            <div class="out-desc ${isNotOut ? 'not-out' : ''}">${outDesc}</div>
                        </td>
                        <td class="num-bold">${b.runs ?? 0}</td>
                        <td>${b.balls_faced ?? 0}</td>
                        <td>${b.fours ?? 0}</td>
                        <td>${b.sixes ?? 0}</td>
                        <td>${b.strike_rate || '0.00'}</td>
                    </tr>
                `;
            });

            // বেটিং নকৰা খেলুৱৈ
            let dnbHtml = "";
            if (Array.isArray(inn.did_not_bat) && inn.did_not_bat.length > 0) {
                const names = inn.did_not_bat
                    .map(p => (typeof p === 'object' && p !== null ? (p.name || '') : p))
                    .filter(Boolean)
                    .join(", ");

                if (names) {
                    dnbHtml = `
                        <div class="info-card">
                            <div style="font-size: 11px; color: #64748b; margin-bottom: 2px;">YET TO BAT</div>
                            <div class="dnb-text">${names}</div>
                        </div>
                    `;
                }
            }

            // এক্সট্ৰা
            const ext = inn.extra_runs || {};
            const extDetails = `(b ${ext.byes ?? 0}, lb ${ext.legbyes ?? 0}, w ${ext.wides ?? 0}, nb ${ext.noballs ?? 0}, p ${ext.penalty ?? 0})`;
            const eq = inn.equations || {};

            // বলিং তালিকা
            let bowlHtml = "";
            (inn.bowlers || []).forEach(bw => {
                bowlHtml += `
                    <tr>
                        <td><span class="player-name">${bw.name || 'Unknown'}</span></td>
                        <td>${bw.overs ?? 0}</td>
                        <td>${bw.maidens ?? 0}</td>
                        <td>${bw.runs_conceded ?? 0}</td>
                        <td class="num-bold">${bw.wickets ?? 0}</td>
                        <td>${bw.noballs ?? 0}</td>
                        <td>${bw.wides ?? 0}</td>
                        <td>${bw.econ || '0.00'}</td>
                    </tr>
                `;
            });

            // উইকেট পতন
            let fowHtml = "";
            if (Array.isArray(inn.fows) && inn.fows.length > 0) {
                const fowList = inn.fows.map(f => `<span><b>${f.score_at_dismissal ?? 0}-${f.number ?? ''}</b> (${f.name || ''}, ${f.overs_at_dismissal ?? 0} ov)</span>`).join(" • ");
                fowHtml = `
                    <div class="section-label">Fall of Wickets</div>
                    <div class="info-card fow-text">${fowList}</div>
                `;
            }

            container.innerHTML = `
                <div class="inning-summary">
                    <span>${inn.name || 'Innings'}</span>
                    <span style="color: #38bdf8;">${inn.scores_full || inn.scores || '-'}</span>
                </div>

                <div class="section-label">Batting</div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Batter</th>
                                <th>R</th>
                                <th>B</th>
                                <th>4s</th>
                                <th>6s</th>
                                <th>SR</th>
                            </tr>
                        </thead>
                        <tbody>${batHtml || '<tr><td colspan="6" style="text-align:center;">No batting data available</td></tr>'}</tbody>
                    </table>
                </div>

                <div class="info-card">
                    <div class="info-row">
                        <span>Extras ${extDetails}</span>
                        <span class="num-bold">${ext.total ?? 0}</span>
                    </div>
                    <div class="info-row" style="border-top: 1px solid #232e42; padding-top: 5px; margin-top: 4px;">
                        <span>Total (Run Rate: ${eq.runrate || '-'})</span>
                        <span class="num-bold" style="color: #38bdf8;">${inn.scores_full || inn.scores || '-'}</span>
                    </div>
                </div>

                ${dnbHtml}

                <div class="section-label">Bowling</div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Bowler</th>
                                <th>O</th>
                                <th>M</th>
                                <th>R</th>
                                <th>W</th>
                                <th>NB</th>
                                <th>WD</th>
                                <th>ECO</th>
                            </tr>
                        </thead>
                        <tbody>${bowlHtml || '<tr><td colspan="8" style="text-align:center;">No bowling data available</td></tr>'}</tbody>
                    </table>
                </div>

                ${fowHtml}
            `;
        }

        loadScorecard();
    </script>
</body>
</html>
