<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d19">
<title>New Zealand vs India — 2nd Test Live Scorecard</title>
<style>
:root{
  --bg:#080d19;--card:#111a2b;--card2:#18243a;--text:#f5f7ff;
  --muted:#91a0bb;--accent:#ff8757;--accent2:#ffb184;
  --green:#4ade80;--yellow:#fbbf24;--line:rgba(255,255,255,.085);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% -15%,rgba(72,105,180,.2),transparent 50%),var(--bg)}
.container{width:100%;max-width:680px;margin:0 auto;padding:16px 13px 32px}
.match-card{position:relative;overflow:hidden;background:linear-gradient(145deg,#1a2944 0%,#111a2b 72%);border:1px solid rgba(155,180,255,.15);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 14px 38px rgba(0,0,0,.25)}
.status-row{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
.status-sub{color:#c8d4ea;font-weight:700;letter-spacing:.4px}
.updated-top{margin-left:auto;color:var(--muted);font-weight:500;letter-spacing:0;white-space:nowrap}
.match-title{font-size:19px;font-weight:850;margin-top:14px;line-height:1.3;letter-spacing:-.3px}
.match-note{font-size:12px;color:#aebbd2;margin-top:5px;line-height:1.5}
.banner-note{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,177,132,.1);border:1px solid rgba(255,177,132,.25);color:var(--accent2);font-size:12px;font-weight:700}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.team-box{min-width:0;background:rgba(5,11,23,.42);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px}
.team-head{display:flex;align-items:center;gap:8px}
.team-logo{width:30px;height:30px;object-fit:contain;flex-shrink:0;border-radius:8px;background:rgba(255,255,255,.05);padding:2px}
.team-name{font-size:13px;font-weight:800;overflow-wrap:anywhere}
.team-role{font-size:10px;color:var(--accent2);font-weight:700;margin-top:2px}
.team-score{font-size:19px;font-weight:900;margin-top:9px;font-variant-numeric:tabular-nums;color:var(--text)}
.inn-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.inn-tab{flex:1 1 160px;border:1px solid var(--line);background:var(--card);color:#c5d2e8;border-radius:14px;padding:10px 12px;text-align:left;cursor:pointer}
.inn-tab.active{background:linear-gradient(105deg,#ffad82,#ff7954);border-color:transparent;color:#1b1c25}
.inn-tab-title{font-size:12px;font-weight:800;line-height:1.25}
.inn-tab-sub{font-size:11px;font-weight:700;opacity:.85;margin-top:2px;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.panel-head{padding:13px 14px;background:linear-gradient(100deg,#1b2942,#172238);display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.panel-title{font-weight:800;font-size:14px}
.panel-meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 14px}
.metric{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:10px 11px}
.metric-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.metric-val{font-size:13px;font-weight:800;margin-top:4px;overflow-wrap:anywhere;line-height:1.35}
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.score-table{width:100%;border-collapse:collapse;min-width:340px;font-size:12px}
.score-table th{background:rgba(255,255,255,.025);color:var(--muted);font-size:10px;font-weight:700;text-align:right;padding:10px 6px;white-space:nowrap}
.score-table td{padding:11px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.score-table th:first-child,.score-table td:first-child{text-align:left;padding-left:14px}
.score-table th:last-child,.score-table td:last-child{padding-right:14px}
.player-name{font-weight:750;color:var(--text)}
.player-sub{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600}
.player-sub.not-out{color:var(--green);font-weight:700}
.info-strip{padding:11px 14px;border-top:1px solid var(--line);font-size:12px;color:#c3d0e6;line-height:1.55}
.info-strip strong{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:11px;color:#dce5f5}
.filters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015)}
.filter-btn{border:1px solid var(--line);background:var(--card2);color:#c5d2e8;border-radius:999px;padding:5px 11px;font-size:11px;font-weight:750;cursor:pointer}
.filter-btn.active{background:linear-gradient(105deg,#ffad82,#ff7954);border-color:transparent;color:#1b1c25}
.squad-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 14px}
.player-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:10px 11px;min-width:0}
.player-card-name{font-weight:800;font-size:12px;color:var(--text)}
.player-card-sub{font-size:11px;color:var(--accent2);margin-top:2px;font-weight:700}
.player-card-meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4;overflow-wrap:anywhere}
.empty-box{padding:18px 14px;text-align:center;color:var(--muted);font-size:12px}
.footer{text-align:center;color:#7686a3;font-size:11px;padding:12px 6px 20px}
@media(max-width:480px){.squad-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="container">
  <section class="match-card">
    <div class="status-row">
      <span class="dot" id="statusDot"></span>
      <span id="statusStr">LIVE</span>
      <span class="status-sub" id="gameState">· Play Ongoing</span>
      <span class="updated-top" id="updatedTop">Syncing...</span>
    </div>
    <div class="match-title" id="matchTitle">New Zealand vs India · 2nd Test</div>
    <div class="match-note" id="matchNote">2nd Test · Test</div>
    <div class="banner-note" id="tossBanner">New Zealand vs India · 2nd Test</div>
    <div class="teams" id="teamsGrid"></div>
  </section>

  <div class="inn-tabs" id="inningsTabs"></div>

  <section class="panel">
    <div class="panel-head">
      <div class="panel-title">Batting</div>
      <div class="panel-meta" id="batPanelMeta">Scorecard</div>
    </div>
    <div class="table-wrap">
      <table class="score-table">
        <thead>
          <tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>
        </thead>
        <tbody id="batBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div class="panel-title">Bowling</div>
      <div class="panel-meta" id="bowlPanelMeta">Spell</div>
    </div>
    <div class="table-wrap">
      <table class="score-table">
        <thead>
          <tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr>
        </thead>
        <tbody id="bowlBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div class="panel-title" id="inningTitle">Inning</div>
      <div class="panel-meta" id="inningScore">—</div>
    </div>
    <div class="metrics" id="metricsGrid"></div>
    <div class="info-strip" id="extraInfo"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div class="panel-title">Venue &amp; Conditions</div>
      <div class="panel-meta" id="startIstLabel">2nd Test</div>
    </div>
    <div class="metrics" id="conditionsGrid"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div class="panel-title">Squad</div>
      <div class="panel-meta" id="squadCount">0 players</div>
    </div>
    <div class="filters" id="squadFilters">
      <button type="button" class="filter-btn active" data-team="all">All</button>
      <button type="button" class="filter-btn" data-team="nz">New Zealand (NZ)</button>
      <button type="button" class="filter-btn" data-team="in">India (IND)</button>
    </div>
    <div class="squad-grid" id="squadGrid"></div>
  </section>

  <div class="footer" id="footerText">Auto refresh every 2 minutes</div>
</main>

<script>
(function(){
'use strict';

const API_URL = 'https://bdcr2.aminurmarch.workers.dev/?id=98450';
const REFRESH_MS = 2 * 60 * 1000;

const FALLBACK_DATA = {
  status: 'ok',
  response: {
    match_id: 98450,
    title: 'New Zealand vs India',
    short_title: 'NZ vs IND',
    subtitle: '2nd Test',
    match_number: '2',
    format: 1,
    format_str: 'Test',
    status: 3,
    status_str: 'Live',
    status_note: 'New Zealand vs India · 2nd Test',
    game_state: 3,
    game_state_str: 'Play Ongoing',
    competition: { title: '2nd Test', abbr: 'NZ vs IND' },
    teama: { team_id: 1, name: 'New Zealand', short_name: 'NZ', logo_url: '', scores_full: '', scores: '' },
    teamb: { team_id: 2, name: 'India', short_name: 'IND', logo_url: '', scores_full: '', scores: '' },
    venue: { name: '—', location: '', country: '' },
    weather: {},
    pitch: {},
    toss: {},
    latest_inning_number: 1,
    innings: [],
    players: [],
    match_notes: []
  }
};

const ROLE_LABELS = {
  bat: 'Batter',
  bowl: 'Bowler',
  all: 'All-rounder',
  wk: 'Wicketkeeper'
};

const $ = id => document.getElementById(id);
const esc = v => String(v === null || v === undefined || v === '' ? '—' : v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let busy = false;
let hasLiveData = false;
let latestPayload = null;
let latestStamp = '';
let selectedInningNumber = null;
let lastKnownLatestInn = null;
let currentPlayers = [];
let activeTeamFilter = 'all';

function normalizeNoteKey(str){
  return String(str || '')
    .toLowerCase()
    .replace(/\b(india|ind)\b/g, 'teamind')
    .replace(/\b(new zealand|nz)\b/g, 'teamnz')
    .replace(/\b(australia|aus)\b/g, 'teamaus')
    .replace(/\b(england|eng)\b/g, 'teameng')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
}

function buildBannerText(items){
  const parts = items.map(s => String(s || '').trim()).filter(Boolean);
  const kept = [];
  const seenKeys = [];

  for(const part of parts){
    const key = normalizeNoteKey(part);
    if(!key) continue;
    const isDuplicate = seenKeys.some(prev => prev === key || prev.includes(key) || key.includes(prev));
    if(!isDuplicate){
      seenKeys.push(key);
      kept.push(part);
    }
  }
  return kept.join(' · ') || 'Live match update';
}

function isPlayerNotOut(b){
  const pos = String(b.position || '').toLowerCase();
  const howOut = String(b.how_out || '').toLowerCase().trim();
  const battingFlag = String(b.batting || '').toLowerCase();
  if(pos === 'striker' || pos === 'non striker' || pos === 'non-striker' || battingFlag === 'true') return true;
  if(!howOut) return false;
  if(/\b(c & b|c\b|b\b|lbw|run out|stumped|hit wicket|retired out|retired hurt)\b/i.test(howOut) && !/not\s*out/i.test(howOut)){
    return false;
  }
  return /not\s*out/i.test(howOut);
}

function renderSquad(){
  const filtered = activeTeamFilter === 'all'
    ? currentPlayers
    : currentPlayers.filter(p => String(p.country || '').toLowerCase() === activeTeamFilter);

  $('squadCount').textContent = `${filtered.length} players`;
  if(!filtered.length){
    $('squadGrid').innerHTML = '<div class="empty-box" style="grid-column:1/-1">No players in this filter</div>';
    return;
  }

  $('squadGrid').innerHTML = filtered.map(p => {
    const roleText = ROLE_LABELS[String(p.playing_role || '').toLowerCase()] || p.playing_role || 'Squad';
    const teamText = p.nationality || (String(p.country || '').toUpperCase());
    const badge = p.role_str ? ` ${p.role_str}` : '';
    const styles = [p.batting_style, p.bowling_style].filter(Boolean).join(' · ');
    return `
      <div class="player-card">
        <div class="player-card-name">${esc(p.title || p.short_name)}${esc(badge)}</div>
        <div class="player-card-sub">${esc(roleText)}${teamText ? ` · ${esc(teamText)}` : ''}</div>
        <div class="player-card-meta">${esc(styles || 'Squad member')}</div>
      </div>`;
  }).join('');
}

function renderSelectedInning(r, innings){
  const latestNum = Number(r.latest_inning_number || (innings[innings.length - 1] && innings[innings.length - 1].number) || 1);
  if(lastKnownLatestInn !== latestNum || selectedInningNumber === null){
    selectedInningNumber = latestNum;
    lastKnownLatestInn = latestNum;
  }

  $('inningsTabs').innerHTML = innings.map(inn => {
    const num = Number(inn.number);
    const active = num === Number(selectedInningNumber);
    const label = String(inn.short_name || inn.name || `Inning ${num}`).trim();
    const score = String(inn.scores_full || inn.scores || '').trim() || '—';
    return `
      <button type="button" class="inn-tab${active ? ' active' : ''}" data-inn="${esc(num)}">
        <div class="inn-tab-title">${esc(label)}</div>
        <div class="inn-tab-sub">${esc(score)}</div>
      </button>`;
  }).join('');

  $('inningsTabs').querySelectorAll('.inn-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedInningNumber = Number(btn.dataset.inn);
      renderSelectedInning(r, innings);
    });
  });

  const activeInn = innings.find(i => Number(i.number) === Number(selectedInningNumber))
    || innings[innings.length - 1]
    || {};
  const eq = activeInn.equations || {};
  const isCurrentLiveInn = Number(activeInn.number) === latestNum;

  $('batPanelMeta').textContent = isCurrentLiveInn ? 'Current Crease' : (activeInn.short_name || activeInn.name || 'Inning');
  $('bowlPanelMeta').textContent = isCurrentLiveInn ? 'Current Spell' : 'Bowling Figures';

  const batsmen = Array.isArray(activeInn.batsmen) ? activeInn.batsmen : [];
  $('batBody').innerHTML = batsmen.length ? batsmen.map(b => {
    const notOut = isPlayerNotOut(b);
    const posTag = b.position === 'striker' ? 'striker*' : (notOut ? 'not out' : (b.how_out || 'out'));
    const roleBadge = b.role_str ? ` ${b.role_str}` : '';
    return `
      <tr>
        <td><div class="player-name">${esc(b.name)}${esc(roleBadge)}</div><div class="player-sub${notOut ? ' not-out' : ''}">${esc(posTag)}</div></td>
        <td><strong>${esc(b.runs)}</strong></td>
        <td>${esc(b.balls_faced)}</td>
        <td>${esc(b.fours)}</td>
        <td>${esc(b.sixes)}</td>
        <td>${esc(b.strike_rate)}</td>
      </tr>`;
  }).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted)">No batters available</td></tr>';

  const bowlers = Array.isArray(activeInn.bowlers) ? activeInn.bowlers : [];
  $('bowlBody').innerHTML = bowlers.length ? bowlers.map(bw => `
    <tr>
      <td><div class="player-name">${esc(bw.name)}</div><div class="player-sub">${esc(bw.position || 'bowler')}</div></td>
      <td>${esc(bw.overs)}</td>
      <td>${esc(bw.maidens)}</td>
      <td>${esc(bw.runs_conceded)}</td>
      <td><strong>${esc(bw.wickets)}</strong></td>
      <td>${esc(bw.econ)}</td>
    </tr>
  `).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted)">No bowlers available</td></tr>';

  const runs = eq.runs ?? activeInn.scores ?? '—';
  const overs = eq.overs ?? activeInn.overs ?? '—';
  const rr = eq.runrate ?? '—';
  $('inningTitle').textContent = String(activeInn.name || `${(r.teama && r.teama.name) || 'Team'} Inning`).trim();
  $('inningScore').textContent = activeInn.scores_full || (runs !== '—' ? `${runs} (${overs} ov)` : '—');

  const pship = activeInn.current_partnership;
  const pshipBatters = Array.isArray(pship && pship.batsmen)
    ? pship.batsmen.map(b => `${b.name} ${b.runs} (${b.balls})`).join(' & ')
    : '';
  const pshipText = pship
    ? `${pship.runs} (${pship.balls}b · ${pship.overs} ov)${pshipBatters ? ` · ${pshipBatters}` : ''}`
    : '—';

  const p1 = activeInn.powerplay && activeInn.powerplay.p1;
  const ppText = p1 ? `Overs ${p1.startover} – ${p1.endover}` : '—';

  const ex = activeInn.extra_runs || {};
  const extrasText = `Total ${ex.total ?? 0} (b ${ex.byes ?? 0}, lb ${ex.legbyes ?? 0}, w ${ex.wides ?? 0}, nb ${ex.noballs ?? 0})`;

  $('metricsGrid').innerHTML = `
    <div class="metric"><div class="metric-label">Score &amp; Overs</div><div class="metric-val">${esc(activeInn.scores_full || `${runs} (${overs} ov)`)}</div></div>
    <div class="metric"><div class="metric-label">Run Rate</div><div class="metric-val">${esc(rr)}</div></div>
    <div class="metric"><div class="metric-label">Partnership</div><div class="metric-val">${esc(pshipText)}</div></div>
    <div class="metric"><div class="metric-label">Powerplay / Extras</div><div class="metric-val">${esc(ppText)} · ${esc(extrasText)}</div></div>
  `;

  const dnb = Array.isArray(activeInn.did_not_bat) ? activeInn.did_not_bat.map(x => x.name || x).filter(Boolean) : [];
  const mNotes = Array.isArray(r.match_notes) ? r.match_notes.flat().filter(Boolean) : [];
  $('extraInfo').innerHTML = `
    ${mNotes.length ? `<div><strong>Match Notes:</strong> <span class="chips">${mNotes.map(n => `<span class="chip">${esc(n)}</span>`).join('')}</span></div>` : ''}
    ${dnb.length ? `<div style="${mNotes.length ? 'margin-top:8px' : ''}"><strong>Yet to Bat:</strong> ${esc(dnb.join(', '))}</div>` : ''}
  `;
}

function renderData(payload, feedStamp){
  const r = payload && payload.response ? payload.response : payload;
  if(!r || typeof r !== 'object') return;
  latestPayload = payload;
  if(feedStamp) latestStamp = feedStamp;

  const ta = r.teama || {};
  const tb = r.teamb || {};
  const comp = r.competition || {};
  const venue = r.venue || {};
  const weather = r.weather || {};
  const pitch = r.pitch || {};
  const toss = r.toss || {};
  const innings = Array.isArray(r.innings) ? r.innings : [];
  const activeInn = innings.find(i => Number(i.number) === Number(r.latest_inning_number)) || innings[innings.length - 1] || {};

  const statusStr = String(r.status_str || 'Live');
  const gameStateStr = String(r.game_state_str || '');
  const statusNoteStr = String(r.status_note || '');
  const isStumps = /\bstumps\b|\bday\s*end\b|\bend\s*of\s*day\b/i.test(statusStr + ' ' + gameStateStr + ' ' + statusNoteStr);
  const isLive = !isStumps && /live|ongoing|in progress/i.test(statusStr + ' ' + gameStateStr);
  const badgeColor = isLive ? 'var(--green)' : 'var(--yellow)';

  $('statusStr').textContent = isStumps ? 'STUMPS' : statusStr.toUpperCase();
  $('statusStr').style.color = badgeColor;
  $('gameState').textContent = (isStumps && !/stumps/i.test(gameStateStr) && gameStateStr)
    ? `· ${gameStateStr}`
    : (gameStateStr && !isStumps ? `· ${gameStateStr}` : '');
  $('statusDot').style.background = badgeColor;

  const baseTitle = r.title || `${ta.name || 'New Zealand'} vs ${tb.name || 'India'}`;
  $('matchTitle').textContent = r.subtitle ? `${baseTitle} · ${r.subtitle}` : baseTitle;
  $('matchNote').textContent = [
    comp.title,
    r.match_number ? `Match #${r.match_number}` : '',
    r.format_str
  ].filter(Boolean).join(' · ') || 'NZ vs IND · 2nd Test';

  $('tossBanner').textContent = buildBannerText([r.status_note, toss.text, r.live]);

  const batTeamId = Number(activeInn.batting_team_id || (toss.decision === 1 ? toss.winner : 0) || 0);
  $('teamsGrid').innerHTML = [ta, tb].map(t => {
    const isBatting = batTeamId && Number(t.team_id) === batTeamId;
    const roleTag = isBatting ? 'BATTING' : (t.short_name || 'FIELDING');
    const cleanScore = String(t.scores_full || '').replace(/^\*\s*/, '').trim() || (isBatting && activeInn.scores_full ? activeInn.scores_full : 'Yet to bat');
    return `
      <div class="team-box">
        <div class="team-head">
          ${t.logo_url ? `<img class="team-logo" src="${esc(t.logo_url)}" alt="${esc(t.short_name || t.name)}" onerror="this.style.display='none'">` : ''}
          <div>
            <div class="team-name">${esc(t.name || t.short_name)}</div>
            <div class="team-role">${esc(roleTag)}</div>
          </div>
        </div>
        <div class="team-score">${esc(cleanScore)}</div>
      </div>`;
  }).join('');

  renderSelectedInning(r, innings);

  $('startIstLabel').textContent = r.date_start_ist || r.date_start || 'Test';
  const venueStr = [venue.name, venue.location, venue.country].filter(Boolean).join(', ') || '—';
  const weatherStr = weather.weather_desc
    ? `${weather.weather_desc}${weather.temp !== undefined ? ` (${weather.temp}°C)` : ''} · Hum ${weather.humidity ?? '—'}%`
    : '—';
  const pitchStr = [pitch.pitch_condition, pitch.batting_condition].filter(Boolean).join(' · ') || '—';
  const bowlCondStr = [pitch.pace_bowling_condition, pitch.spine_bowling_condition].filter(Boolean).join(' · ') || '—';

  $('conditionsGrid').innerHTML = `
    <div class="metric"><div class="metric-label">Venue</div><div class="metric-val">${esc(venueStr)}</div></div>
    <div class="metric"><div class="metric-label">Weather</div><div class="metric-val">${esc(weatherStr)}</div></div>
    <div class="metric"><div class="metric-label">Pitch</div><div class="metric-val">${esc(pitchStr)}</div></div>
    <div class="metric"><div class="metric-label">Bowling Surface</div><div class="metric-val">${esc(bowlCondStr)}</div></div>
  `;

  currentPlayers = Array.isArray(r.players) ? r.players : [];
  renderSquad();

  const nowStr = new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
  const stamp = latestStamp || payload.datetime || payload.modified || '';
  $('updatedTop').textContent = nowStr;
  $('footerText').textContent = `Last updated: ${nowStr}${stamp ? ` · Feed: ${stamp}` : ''} · Auto refresh every 2 minutes`;
}

document.querySelectorAll('#squadFilters .filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#squadFilters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTeamFilter = btn.dataset.team || 'all';
    renderSquad();
  });
});

async function fetchMatch(){
  if(busy || document.hidden) return;
  busy = true;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 9000);
  try{
    const res = await fetch(API_URL, {cache:'no-store', signal:ctrl.signal});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if(!json || !json.response) throw new Error('Invalid JSON');
    hasLiveData = true;
    renderData(json, json.datetime || json.modified);
  }catch(_){
    if(!hasLiveData){
      renderData(FALLBACK_DATA, FALLBACK_DATA.datetime || 'Snapshot');
      $('updatedTop').textContent = 'Offline sample';
      $('footerText').textContent = 'Showing sample fallback data · Auto refresh every 2 minutes';
    }else{
      $('updatedTop').textContent = 'Retry in 2m';
    }
  }finally{
    clearTimeout(timer);
    busy = false;
  }
}

renderData(FALLBACK_DATA, FALLBACK_DATA.datetime || 'Snapshot');
fetchMatch();
setInterval(fetchMatch, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if(!document.hidden) fetchMatch(); });
})();
</script>
</body>
