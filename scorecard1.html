<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d19">
<title>India A vs United Arab Emirates — Live Scorecard</title>
<style>
:root{
  --bg:#080d19;--card:#111a2b;--card2:#18243a;--text:#f5f7ff;
  --muted:#91a0bb;--accent:#ff8757;--accent2:#ffb184;
  --green:#4ade80;--yellow:#fbbf24;--line:rgba(255,255,255,.085);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% -15%,rgba(72,105,180,.2),transparent 50%),var(--bg)}
.container{width:100%;max-width:680px;margin:0 auto;padding:16px 13px 32px}
.match-card{position:relative;overflow:hidden;background:linear-gradient(145deg,#1a2944 0%,#111a2b 72%);border:1px solid rgba(155,180,255,.15);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 14px 38px rgba(0,0,0,.25)}
.status-row{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px currentColor;flex-shrink:0}
.status-sub{color:#c8d4ea;font-weight:700;letter-spacing:.4px}
.updated-top{margin-left:auto;color:var(--muted);font-weight:500;letter-spacing:0;white-space:nowrap}
.match-title{font-size:18px;font-weight:850;margin-top:14px;line-height:1.35;letter-spacing:-.3px}
.match-note{font-size:12px;color:#aebbd2;margin-top:5px;line-height:1.5}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.team-box{min-width:0;background:rgba(5,11,23,.4);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px}
.team-head{display:flex;align-items:center;gap:8px}
.team-logo{width:28px;height:28px;object-fit:contain;flex-shrink:0;border-radius:6px}
.team-name{font-size:12px;font-weight:800;overflow-wrap:anywhere}
.team-role{font-size:10px;color:var(--accent2);font-weight:700;margin-top:2px}
.team-score{font-size:20px;font-weight:900;margin-top:9px;font-variant-numeric:tabular-nums}
.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.panel-head{padding:13px 14px;background:linear-gradient(100deg,#1b2942,#172238);display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.panel-title{font-weight:800;font-size:14px}
.panel-meta{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px 14px}
.metric{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);border-radius:12px;padding:10px 11px}
.metric-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.metric-val{font-size:14px;font-weight:800;margin-top:4px;overflow-wrap:anywhere}
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.score-table{width:100%;border-collapse:collapse;min-width:340px;font-size:12px}
.score-table th{background:rgba(255,255,255,.025);color:var(--muted);font-size:10px;font-weight:700;text-align:right;padding:10px 6px;white-space:nowrap}
.score-table td{padding:11px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.score-table th:first-child,.score-table td:first-child{text-align:left;padding-left:14px}
.score-table th:last-child,.score-table td:last-child{padding-right:14px}
.player-name{font-weight:750;color:var(--text)}
.player-sub{font-size:10px;color:var(--green);margin-top:2px;font-weight:700}
.info-strip{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:#c3d0e6;line-height:1.55}
.info-strip strong{color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:11px;color:#dce5f5}
.comm-list{padding:6px 14px 12px}
.comm-item{padding:10px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:start}
.comm-item:first-child{border-top:0}
.comm-badge{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 4px;text-align:center;font-size:11px;font-weight:800;color:var(--accent2);font-variant-numeric:tabular-nums}
.comm-badge.four{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.35);color:var(--green)}
.comm-badge.over{background:rgba(255,135,87,.16);border-color:rgba(255,135,87,.35);color:var(--accent2)}
.comm-text{font-size:12px;line-height:1.5;color:#dbe4f4;overflow-wrap:anywhere}
.comm-head{font-weight:750;color:var(--text);margin-bottom:2px}
.footer{text-align:center;color:#7686a3;font-size:11px;padding:12px 6px 20px}
</style>
</head>
<body>
<main class="container">
  <section class="match-card">
    <div class="status-row">
      <span class="dot" id="statusDot"></span>
      <span id="statusStr">LIVE</span>
      <span class="status-sub" id="gameState">Play Ongoing</span>
      <span class="updated-top" id="updatedTop">Syncing...</span>
    </div>
    <div class="match-title" id="matchTitle">India A vs United Arab Emirates</div>
    <div class="match-note" id="matchNote">UAE elected to bat</div>
    <div class="teams" id="teamsGrid"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div class="panel-title" id="inningTitle">United Arab Emirates Inning</div>
      <div class="panel-meta" id="inningScore">45/2 (10 ov)</div>
    </div>
    <div class="metrics" id="metricsGrid"></div>
    <div class="info-strip" id="extraInfo"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div class="panel-title">Batting</div>
      <div class="panel-meta">Current Crease</div>
    </div>
    <div class="table-wrap">
      <table class="score-table">
        <thead>
          <tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>
        </thead>
        <tbody id="batBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div class="panel-title">Bowling</div>
      <div class="panel-meta">Current Spell</div>
    </div>
    <div class="table-wrap">
      <table class="score-table">
        <thead>
          <tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr>
        </thead>
        <tbody id="bowlBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div class="panel-title">Recent Commentary</div>
      <div class="panel-meta" id="commCount">Latest balls &amp; overs</div>
    </div>
    <div class="comm-list" id="commList"></div>
  </section>

  <div class="footer" id="footerText">Auto refresh every 2 minutes</div>
</main>

<script>
(function(){
'use strict';

const API_URL = 'https://bdcr.aminurmarch.workers.dev/?id=100463';
const REFRESH_MS = 2 * 60 * 1000; // Auto update every 2 minutes

const FALLBACK_DATA = {"status":"ok","response":{"mid":100463,"status":3,"status_str":"Live","game_state":3,"game_state_str":"Play Ongoing","status_note":"UAE elected to bat","team_batting":"United Arab Emirates","team_bowling":"India A","live_inning_number":1,"live_score":{"runs":45,"overs":10,"wickets":2,"target":0,"runrate":4.5,"required_runrate":""},"batsmen":[{"name":"Muhammad Shahdad","batsman_id":121711,"runs":9,"balls_faced":10,"fours":1,"sixes":0,"strike_rate":"90.00"},{"name":"Harpreet Singh Bhatia","batsman_id":53789,"runs":24,"balls_faced":31,"fours":5,"sixes":0,"strike_rate":"77.42"}],"bowlers":[{"name":"Arshad Khan","bowler_id":105049,"overs":5,"runs_conceded":23,"wickets":1,"maidens":0,"econ":"4.60"},{"name":"Harshit Rana","bowler_id":115284,"overs":5,"runs_conceded":22,"wickets":1,"maidens":0,"econ":"4.40"}],"commentaries":[{"event":"overend","over":10,"runs":7,"score":"45/2","commentary":"End of over 10 (7 runs), United Arab Emirates 45/2"},{"event_id":"15538891","event":"ball","over":"9","ball":"6","score":0,"commentary":"Arshad Khan to Harpreet Singh Bhatia, no run,","four":false},{"event_id":"15538885","event":"ball","over":"9","ball":"5","score":4,"commentary":"Arshad Khan to Harpreet Singh Bhatia, Four, Back of a length outside off from Arshad Khan. Harpreet Singh Bhatia hangs in the crease and pulls it away to square leg for four.","four":true},{"event_id":"15538878","event":"ball","over":"9","ball":"4","score":1,"commentary":"Arshad Khan to Muhammad Shahdad, 1 run, Good length on the stumps, and he hangs back in the crease to push it toward slip for one.","four":false}],"live_inning":{"name":"United Arab Emirates Inning","scores_full":"45/2 (10 ov)","equations":{"runs":45,"wickets":2,"overs":"10","runrate":"4.50"},"current_partnership":{"runs":25,"balls":29,"overs":4.5},"last_wicket":{"name":"Ansh Tandon","runs":"8","balls":"15","how_out":"c A Sharma b A Khan","score_at_dismissal":20,"overs_at_dismissal":"5.1"},"did_not_bat":[{"name":"Aftab Alam Shah"},{"name":"Basil Hameed"},{"name":"Ethan Dsouza"},{"name":"Uddish Suri"},{"name":"Ibrar Ahmad"},{"name":"Simranjeet Singh"},{"name":"Zahid Ali"}],"recent_scores":"0,4,1,0,1,1,0,4,0,0,0,0,4,0,0,0,1,0","last_five_overs":"25/1 4.69","last_ten_overs":"45/2 4.35"},"teams":[{"tid":15,"title":"United Arab Emirates","abbr":"UAE","logo_url":"https://gcdnimages.entitysport.com/assets/uploads/2023/05/United_Arab_Emirates.png","scores_full":"*45/2 (10 ov)"},{"tid":11383,"title":"India A","abbr":"IND-A","logo_url":"https://gcdnimages.entitysport.com/assets/uploads//2023/01/india-4.png","scores_full":""}]}};

const $ = id => document.getElementById(id);
const esc = v => String(v === null || v === undefined || v === '' ? '—' : v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

let busy = false;
let hasLiveData = false;

function renderMatch(payload, feedStamp){
  const r = payload && payload.response ? payload.response : payload;
  if(!r || typeof r !== 'object') return;

  const liveScore = r.live_score || {};
  const inn = r.live_inning || {};
  const eq = inn.equations || {};
  const teams = Array.isArray(r.teams) ? r.teams : [];
  const battingTeam = r.team_batting || (teams[0] && teams[0].title) || 'United Arab Emirates';
  const bowlingTeam = r.team_bowling || (teams[1] && teams[1].title) || 'India A';

  const runs = liveScore.runs ?? eq.runs ?? '—';
  const wkts = liveScore.wickets ?? eq.wickets ?? '—';
  const overs = liveScore.overs ?? eq.overs ?? '—';
  const rr = liveScore.runrate ?? eq.runrate ?? '—';

  const statusStr = String(r.status_str || 'Live');
  const isLive = /live|ongoing|in progress/i.test(statusStr + ' ' + String(r.game_state_str || ''));
  $('statusStr').textContent = statusStr.toUpperCase();
  $('gameState').textContent = r.game_state_str ? '· ' + r.game_state_str : '';
  $('statusDot').style.background = isLive ? 'var(--green)' : 'var(--yellow)';

  $('matchTitle').textContent = teams.length >= 2
    ? `${teams[0].title || battingTeam} vs ${teams[1].title || bowlingTeam}`
    : `${battingTeam} vs ${bowlingTeam}`;
  $('matchNote').textContent = r.status_note || `Match #${r.mid || '100463'}`;

  $('teamsGrid').innerHTML = teams.slice(0,2).map(t => {
    const tName = t.title || 'Team';
    const isBat = tName === battingTeam;
    const scoreText = (t.scores_full || '').replace(/\s*\(\s*ov\s*\)/i, '').trim() || (isBat ? `${runs}/${wkts} (${overs} ov)` : 'Yet to bat');
    return `
      <div class="team-box">
        <div class="team-head">
          ${t.logo_url ? `<img class="team-logo" src="${esc(t.logo_url)}" alt="" onerror="this.style.display='none'">` : ''}
          <div>
            <div class="team-name">${esc(tName)}</div>
            <div class="team-role">${isBat ? 'BATTING' : 'BOWLING'}</div>
          </div>
        </div>
        <div class="team-score">${esc(scoreText)}</div>
      </div>`;
  }).join('');

  $('inningTitle').textContent = inn.name || `${battingTeam} · Inning ${r.live_inning_number || 1}`;
  $('inningScore').textContent = inn.scores_full || `${runs}/${wkts} (${overs} ov)`;

  const pship = inn.current_partnership;
  const pshipText = pship ? `${pship.runs} (${pship.balls} balls · ${pship.overs} ov)` : '—';
  const lw = inn.last_wicket;
  const lwText = lw ? `${lw.name} ${lw.runs} (${lw.balls}b, ${lw.how_out}) at ${lw.score_at_dismissal}/${lw.number} (${lw.overs_at_dismissal} ov)` : '—';

  $('metricsGrid').innerHTML = `
    <div class="metric"><div class="metric-label">Current Score</div><div class="metric-val">${esc(`${runs}/${wkts}`)} <span style="font-size:12px;color:var(--muted);font-weight:600">(${esc(overs)} ov)</span></div></div>
    <div class="metric"><div class="metric-label">Run Rate</div><div class="metric-val">${esc(rr)}</div></div>
    <div class="metric"><div class="metric-label">Partnership</div><div class="metric-val">${esc(pshipText)}</div></div>
    <div class="metric"><div class="metric-label">Last 5 / 10 Ov</div><div class="metric-val">${esc(inn.last_five_overs || '—')} · ${esc(inn.last_ten_overs || '—')}</div></div>
  `;

  const dnb = Array.isArray(inn.did_not_bat) ? inn.did_not_bat.map(x => x.name || x).filter(Boolean) : [];
  const recentBalls = inn.recent_scores ? String(inn.recent_scores).split(',').map(s => s.trim()).filter(Boolean) : [];
  $('extraInfo').innerHTML = `
    <div><strong>Last Wicket:</strong> ${esc(lwText)}</div>
    ${recentBalls.length ? `<div style="margin-top:8px"><strong>Recent Balls:</strong> <span class="chips">${recentBalls.map(b => `<span class="chip">${esc(b)}</span>`).join('')}</span></div>` : ''}
    ${dnb.length ? `<div style="margin-top:8px"><strong>Yet to Bat:</strong> ${esc(dnb.join(', '))}</div>` : ''}
  `;

  const batsmen = Array.isArray(r.batsmen) ? r.batsmen : [];
  $('batBody').innerHTML = batsmen.length ? batsmen.map(b => `
    <tr>
      <td><div class="player-name">${esc(b.name)}</div><div class="player-sub">batting*</div></td>
      <td><strong>${esc(b.runs)}</strong></td>
      <td>${esc(b.balls_faced)}</td>
      <td>${esc(b.fours)}</td>
      <td>${esc(b.sixes)}</td>
      <td>${esc(b.strike_rate)}</td>
    </tr>
  `).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted)">No active batters</td></tr>';

  const bowlers = Array.isArray(r.bowlers) ? r.bowlers : [];
  $('bowlBody').innerHTML = bowlers.length ? bowlers.map(bw => `
    <tr>
      <td><div class="player-name">${esc(bw.name)}</div></td>
      <td>${esc(bw.overs)}</td>
      <td>${esc(bw.maidens)}</td>
      <td>${esc(bw.runs_conceded)}</td>
      <td><strong>${esc(bw.wickets)}</strong></td>
      <td>${esc(bw.econ)}</td>
    </tr>
  `).join('') : '<tr><td colspan="6" style="text-align:center;color:var(--muted)">No active bowlers</td></tr>';

  const comms = Array.isArray(r.commentaries) ? r.commentaries.slice().reverse().slice(0, 12) : [];
  $('commCount').textContent = `${comms.length} latest items`;
  $('commList').innerHTML = comms.length ? comms.map(c => {
    if(c.event === 'overend'){
      return `
        <div class="comm-item">
          <div class="comm-badge over">OV ${esc(c.over)}</div>
          <div class="comm-text"><div class="comm-head">${esc(c.commentary || `End of over ${c.over}`)}</div></div>
        </div>`;
    }
    const sc = c.score;
    const isFour = Boolean(c.four) || String(sc) === '4';
    const badgeText = `${esc(c.over)}.${esc(c.ball)} · ${esc(sc === 0 ? '•' : sc)}`;
    const parts = String(c.commentary || '').split(',');
    const head = parts.shift() || '';
    const desc = parts.join(',').trim() || c.text || '';
    return `
      <div class="comm-item">
        <div class="comm-badge${isFour ? ' four' : ''}">${badgeText}</div>
        <div class="comm-text">${head ? `<div class="comm-head">${esc(head)}</div>` : ''}${esc(desc)}</div>
      </div>`;
  }).join('') : '<div style="padding:14px;text-align:center;color:var(--muted)">No commentary available</div>';

  const nowStr = new Date().toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
  const stamp = feedStamp || payload.datetime || payload.modified || '';
  $('updatedTop').textContent = nowStr;
  $('footerText').textContent = `Last updated: ${nowStr}${stamp ? ` · Feed: ${stamp}` : ''} · Auto refresh every 2 minutes`;
}

async function fetchScore(){
  if(busy || document.hidden) return;
  busy = true;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 9000);
  try{
    const res = await fetch(API_URL, {cache:'no-store', signal:ctrl.signal});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if(!json || !json.response) throw new Error('Invalid JSON');
    hasLiveData = true;
    renderMatch(json, json.datetime || json.modified);
  }catch(_){
    if(!hasLiveData){
      renderMatch(FALLBACK_DATA, 'Snapshot');
      $('updatedTop').textContent = 'Offline sample';
      $('footerText').textContent = 'Showing sample data — will retry every 2 minutes';
    }else{
      $('updatedTop').textContent = 'Retry in 2m';
    }
  }finally{
    clearTimeout(timer);
    busy = false;
  }
}

renderMatch(FALLBACK_DATA, FALLBACK_DATA.datetime || 'Snapshot');
fetchScore();
setInterval(fetchScore, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if(!document.hidden) fetchScore(); });
})();
</script>
</body>
</html>
