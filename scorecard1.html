<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>England vs Sri Lanka - 1st T20I Scorecard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            padding: 8px;
            display: flex;
            justify-content: center;
        }

        .scorecard-app {
            width: 100%;
            max-width: 550px;
            background: #161f30;
            border: 1px solid #283548;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Match Top Banner */
        .match-card-header {
            border-bottom: 1px solid #232e42;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .match-title {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            background-color: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 10px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .status-badge.live {
            background-color: #ef4444;
            border-color: #ef4444;
            color: #ffffff;
            animation: pulse 1.5s infinite;
        }

        .status-badge.completed {
            background-color: #10b981;
            border-color: #10b981;
            color: #ffffff;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .match-sub {
            font-size: 11.5px;
            color: #94a3b8;
            margin-top: 3px;
        }

        .status-text {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11.5px;
            margin-top: 8px;
            text-align: center;
            font-weight: 600;
        }

        .status-text.completed {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        /* Tabs */
        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 12px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #283548;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.2s ease-in-out;
        }

        .tab-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
        }

        .inning-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #232e42;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #38bdf8;
            margin: 12px 0 6px 0;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        th {
            color: #64748b;
            font-weight: 600;
            text-align: right;
            padding: 6px 3px;
            border-bottom: 1px solid #232e42;
            white-space: nowrap;
            font-size: 10.5px;
        }

        th:first-child {
            text-align: left;
            padding-left: 2px;
        }

        td {
            padding: 6px 3px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            text-align: right;
            color: #cbd5e1;
            white-space: nowrap;
            font-size: 11px;
        }

        td:first-child {
            text-align: left;
            white-space: normal;
            padding-left: 2px;
        }

        .player-name {
            font-weight: 600;
            color: #f1f5f9;
            word-break: break-word;
        }

        .player-role {
            font-size: 9.5px;
            color: #38bdf8;
            margin-left: 2px;
        }

        .out-desc {
            font-size: 9.5px;
            color: #64748b;
            margin-top: 1px;
            line-height: 1.2;
            word-break: break-word;
        }

        .out-desc.not-out {
            color: #22c55e;
            font-weight: 600;
        }

        .num-bold {
            font-weight: 700;
            color: #ffffff;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #232e42;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 11.5px;
            margin-bottom: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: #94a3b8;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .fow-text, .dnb-text {
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        /* Playing XI Container */
        .xi-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .xi-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #232e42;
            border-radius: 8px;
            padding: 8px;
        }

        .xi-team-title {
            font-size: 12px;
            font-weight: 700;
            color: #38bdf8;
            border-bottom: 1px solid #232e42;
            padding-bottom: 4px;
            margin-bottom: 6px;
        }

        .xi-player {
            font-size: 11px;
            color: #cbd5e1;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #loading, #error-msg {
            text-align: center;
            padding: 24px;
            font-size: 12.5px;
            color: #94a3b8;
        }

        .retry-btn {
            margin-top: 10px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            body { padding: 4px; }
            .scorecard-app { padding: 10px 8px; border-radius: 10px; }
            th, td { padding: 5px 2px; font-size: 10.5px; }
            .xi-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="scorecard-app">
        <div class="match-card-header">
            <div class="match-title">
                <span id="header-match">ENG vs SL • 1st T20I</span>
                <span class="status-badge live" id="header-status">LIVE</span>
            </div>
            <div class="match-sub" id="header-venue">📍 The Rose Bowl, Southampton</div>
            <div class="status-text" id="header-note">SL elected to bowl</div>
        </div>

        <div class="tabs-container" id="tabs-container"></div>

        <div id="content-container">
            <div id="loading">Fetching scorecard data...</div>
        </div>
    </div>

    <script>
        const MATCH_ID = "95154"; 
        const scorecardProxyUrl = `https://bdcr2.aminurmarch.workers.dev/?id=${MATCH_ID}`;
        
        let matchData = null;
        let activeInningIndex = 0;
        let userManuallySelectedInning = false;

        async function loadScorecard() {
            const container = document.getElementById("content-container");

            try {
                const res = await fetch(`${scorecardProxyUrl}&_t=${Date.now()}`, { cache: "no-store" });
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
                const json = await res.json();

                // EntitySport JSON parse
                matchData = json.response || json.data?.[0] || json.data || json;

                if (!matchData || Object.keys(matchData).length === 0) {
                    container.innerHTML = `<div id="loading">No match details available.</div>`;
                    return;
                }

                // Title & Subtitle
                const mainTitle = matchData.short_title || matchData.title || 'ENG vs SL';
                const formatTitle = matchData.format_str || 'T20I';
                const subTitle = matchData.subtitle || '1st Match';
                document.getElementById("header-match").textContent = `${mainTitle} • ${subTitle} (${formatTitle})`;

                // Venue
                const v = matchData.venue || {};
                const venueName = [v.name, v.location || v.country].filter(Boolean).join(', ') || "The Rose Bowl, Southampton";
                document.getElementById("header-venue").textContent = `📍 ${venueName}`;

                // Status & Toss Note
                const statusNum = Number(matchData.status || 0);
                const badgeEl = document.getElementById("header-status");
                const noteEl = document.getElementById("header-note");
                
                const noteText = matchData.status_note || matchData.live || (matchData.toss && matchData.toss.text) || "Match in progress";
                noteEl.textContent = noteText;

                if (statusNum === 2 || statusNum === 4) {
                    badgeEl.textContent = statusNum === 4 ? "ABANDONED" : "COMPLETED";
                    badgeEl.className = "status-badge completed";
                    noteEl.className = "status-text completed";
                } else {
                    badgeEl.textContent = "LIVE";
                    badgeEl.className = "status-badge live";
                    noteEl.className = "status-text";
                }

                const inningsList = Array.isArray(matchData.innings) ? matchData.innings : [];

                if (inningsList.length === 0) {
                    renderPlayingXIFallback(container);
                    return;
                }

                if (!userManuallySelectedInning) {
                    activeInningIndex = inningsList.length - 1;
                }

                renderInningTabs(inningsList);
                renderInningDetails(inningsList[activeInningIndex]);

            } catch (err) {
                console.error("Scorecard fetch error:", err);
                container.innerHTML = `
                    <div id="error-msg">
                        Failed to load scorecard data.<br>
                        <button class="retry-btn" onclick="loadScorecard()">Retry</button>
                    </div>
                `;
            }
        }

        function renderInningTabs(inningsList) {
            const tabs = document.getElementById("tabs-container");
            tabs.innerHTML = "";

            inningsList.forEach((inn, idx) => {
                const btn = document.createElement("button");
                const isActive = idx === activeInningIndex;
                btn.className = `tab-btn ${isActive ? 'active' : ''}`;
                btn.textContent = inn.name || inn.short_name || `Inning ${idx + 1}`;
                
                btn.onclick = () => {
                    userManuallySelectedInning = true;
                    activeInningIndex = idx;
                    renderInningTabs(inningsList);
                    renderInningDetails(inningsList[idx]);
                };
                tabs.appendChild(btn);
            });
        }

        function renderInningDetails(inn) {
            const container = document.getElementById("content-container");
            if (!inn) return;

            const batsmen = inn.batsmen || [];
            const bowlers = inn.bowlers || [];

            // If inning created (0/0) but players haven't faced balls yet
            if (batsmen.length === 0 && bowlers.length === 0) {
                container.innerHTML = `
                    <div class="inning-summary">
                        <span>${inn.name || 'England Inning'}</span>
                        <span style="color: #38bdf8;">${inn.scores_full || inn.scores || '0/0 (0 ov)'}</span>
                    </div>
                    <div class="info-card" style="text-align:center; padding: 14px; margin-top: 10px;">
                        <div style="font-weight: 700; color: #38bdf8; margin-bottom: 4px;">🏏 Play will commence shortly</div>
                        <div style="font-size: 11.5px; color: #94a3b8;">${matchData.status_note || "Sri Lanka elected to bowl"}</div>
                    </div>
                    ${getPlayingXIHtml()}
                `;
                return;
            }

            // Batting Rows
            let batHtml = "";
            batsmen.forEach(b => {
                const isNotOut = !b.how_out || b.how_out.toLowerCase().includes('not out');
                batHtml += `
                    <tr>
                        <td>
                            <span class="player-name">${b.name || 'Unknown'}</span>
                            ${b.role_str ? `<span class="player-role">${b.role_str}</span>` : ''}
                            <div class="out-desc ${isNotOut ? 'not-out' : ''}">${b.how_out || 'not out'}</div>
                        </td>
                        <td class="num-bold">${b.runs ?? 0}</td>
                        <td>${b.balls_faced ?? 0}</td>
                        <td>${b.fours ?? 0}</td>
                        <td>${b.sixes ?? 0}</td>
                        <td>${b.strike_rate || '0.00'}</td>
                    </tr>
                `;
            });

            // Bowling Rows
            let bowlHtml = "";
            bowlers.forEach(bw => {
                bowlHtml += `
                    <tr>
                        <td><span class="player-name">${bw.name || 'Unknown'}</span></td>
                        <td>${bw.overs ?? 0}</td>
                        <td>${bw.maidens ?? 0}</td>
                        <td>${bw.runs_conceded ?? 0}</td>
                        <td class="num-bold">${bw.wickets ?? 0}</td>
                        <td>${bw.noballs ?? 0}</td>
                        <td>${bw.wides ?? 0}</td>
                        <td>${bw.econ || '0.00'}</td>
                    </tr>
                `;
            });

            // Extras & Equations
            const ext = inn.extra_runs || {};
            const extDetails = `(b ${ext.byes ?? 0}, lb ${ext.legbyes ?? 0}, w ${ext.wides ?? 0}, nb ${ext.noballs ?? 0}, p ${ext.penalty ?? 0})`;
            const eq = inn.equations || {};

            // Fall of wickets
            let fowHtml = "";
            if (Array.isArray(inn.fows) && inn.fows.length > 0) {
                const fowList = inn.fows.map(f => `<span><b>${f.score_at_dismissal ?? 0}-${f.number ?? ''}</b> (${f.name || ''}, ${f.overs_at_dismissal ?? 0} ov)</span>`).join(" • ");
                fowHtml = `
                    <div class="section-label">Fall of Wickets</div>
                    <div class="info-card fow-text">${fowList}</div>
                `;
            }

            container.innerHTML = `
                <div class="inning-summary">
                    <span>${inn.name || 'Innings'}</span>
                    <span style="color: #38bdf8;">${inn.scores_full || inn.scores || '-'}</span>
                </div>

                <div class="section-label">Batting</div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Batter</th>
                                <th>R</th>
                                <th>B</th>
                                <th>4s</th>
                                <th>6s</th>
                                <th>SR</th>
                            </tr>
                        </thead>
                        <tbody>${batHtml || '<tr><td colspan="6" style="text-align:center;">Yet to bat</td></tr>'}</tbody>
                    </table>
                </div>

                <div class="info-card">
                    <div class="info-row">
                        <span>Extras ${extDetails}</span>
                        <span class="num-bold">${ext.total ?? 0}</span>
                    </div>
                    <div class="info-row" style="border-top: 1px solid #232e42; padding-top: 5px; margin-top: 4px;">
                        <span>Total (Run Rate: ${eq.runrate || '0.00'})</span>
                        <span class="num-bold" style="color: #38bdf8;">${inn.scores_full || inn.scores || '0/0'}</span>
                    </div>
                </div>

                <div class="section-label">Bowling</div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Bowler</th>
                                <th>O</th>
                                <th>M</th>
                                <th>R</th>
                                <th>W</th>
                                <th>NB</th>
                                <th>WD</th>
                                <th>ECO</th>
                            </tr>
                        </thead>
                        <tbody>${bowlHtml || '<tr><td colspan="8" style="text-align:center;">Yet to bowl</td></tr>'}</tbody>
                    </table>
                </div>

                ${fowHtml}
            `;
        }

        // Helper to extract Playing XI from player list
        function getPlayingXIHtml() {
            if (!matchData.players || !Array.isArray(matchData.players)) return "";

            // Players with role !== "squad" are in playing 11
            const playingList = matchData.players.filter(p => p.role && p.role.toLowerCase() !== "squad");
            const engPlayers = playingList.filter(p => (p.nationality || "").toLowerCase().includes("england") || p.country === "en");
            const slPlayers = playingList.filter(p => (p.nationality || "").toLowerCase().includes("sri lanka") || p.country === "lk");

            if (engPlayers.length === 0 && slPlayers.length === 0) return "";

            return `
                <div class="section-label" style="margin-top: 14px;">Playing XI</div>
                <div class="xi-container">
                    <div class="xi-card">
                        <div class="xi-team-title">🏴󠁧󠁢󠁥󠁮󠁧󠁿 England</div>
                        ${engPlayers.map(p => `<div class="xi-player">• ${p.title || p.short_name} <span style="color:#38bdf8;font-size:9.5px;">${p.role_str || ''}</span></div>`).join('')}
                    </div>
                    <div class="xi-card">
                        <div class="xi-team-title">🇱🇰 Sri Lanka</div>
                        ${slPlayers.map(p => `<div class="xi-player">• ${p.title || p.short_name} <span style="color:#38bdf8;font-size:9.5px;">${p.role_str || ''}</span></div>`).join('')}
                    </div>
                </div>
            `;
        }

        function renderPlayingXIFallback(container) {
            container.innerHTML = `
                <div class="info-card" style="text-align:center; padding: 16px;">
                    <div style="font-size: 14px; font-weight:700; color:#38bdf8; margin-bottom:4px;">England vs Sri Lanka</div>
                    <div style="font-size:12px; color:#cbd5e1;">${matchData.status_note || "Sri Lanka elected to bowl"}</div>
                </div>
                ${getPlayingXIHtml()}
            `;
        }

        loadScorecard();
        setInterval(loadScorecard, 25000);
    </script>
</body>
</html>
