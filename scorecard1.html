<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Full Scorecard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .scorecard-app {
            width: 100%;
            max-width: 550px;
            background: #161f30;
            border: 1px solid #283548;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* Match Top Banner */
        .match-card-header {
            border-bottom: 1px solid #232e42;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .match-title {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            background-color: #ef4444;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 10px;
        }

        .match-sub {
            font-size: 11.5px;
            color: #94a3b8;
            margin-top: 3px;
        }

        .status-text {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 11.5px;
            margin-top: 8px;
            text-align: center;
        }

        /* Tabs */
        .tabs-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 10px;
            scrollbar-width: none;
        }

        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #283548;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
        }

        /* Inning Summary Header */
        .inning-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #232e42;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #38bdf8;
            margin: 12px 0 6px 0;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11.5px;
            margin-bottom: 10px;
        }

        th {
            color: #64748b;
            font-weight: 600;
            text-align: right;
            padding: 5px 3px;
            border-bottom: 1px solid #232e42;
        }

        th:first-child {
            text-align: left;
        }

        td {
            padding: 6px 3px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            text-align: right;
            color: #cbd5e1;
        }

        td:first-child {
            text-align: left;
        }

        .player-name {
            font-weight: 600;
            color: #f1f5f9;
        }

        .player-role {
            font-size: 10px;
            color: #38bdf8;
            margin-left: 2px;
        }

        .out-desc {
            font-size: 9.5px;
            color: #64748b;
            margin-top: 1px;
            line-height: 1.2;
        }

        .num-bold {
            font-weight: 700;
            color: #ffffff;
        }

        /* Extras & Totals Box */
        .info-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #232e42;
            border-radius: 8px;
            padding: 8px 10px;
            font-size: 11.5px;
            margin-bottom: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: #94a3b8;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .fow-text {
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .dnb-text {
            font-size: 11.5px;
            color: #cbd5e1;
        }

        #loading, #error-msg {
            text-align: center;
            padding: 24px;
            font-size: 12.5px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="scorecard-app">
        <!-- Header Info -->
        <div class="match-card-header">
            <div class="match-title">
                <span id="header-match">Match Scorecard</span>
                <span class="status-badge" id="header-status">Live</span>
            </div>
            <div class="match-sub" id="header-venue">📍 -</div>
            <div class="status-text" id="header-note">Loading match details...</div>
        </div>

        <!-- Innings Tabs -->
        <div class="tabs-container" id="tabs-container"></div>

        <!-- Scorecard Data Render -->
        <div id="content-container">
            <div id="loading">Fetching scorecard data...</div>
        </div>
    </div>

    <script>
        const currentMatchId = "95254";
        const scorecardProxyUrl = `https://scorecard.aminurmarch.deno.net?matchId=${currentMatchId}`;
        
        let matchData = null;
        let activeInningIndex = 0;

        async function loadScorecard() {
            try {
                const res = await fetch(scorecardProxyUrl);
                if (!res.ok) throw new Error("Network response failed");
                const json = await res.json();

                // JSON গাঠনি অনুযায়ী ডাটা লোড
                if (json.data && json.data.length > 0 && json.data[0].scoreCard) {
                    matchData = json.data[0].scoreCard;
                } else if (json.scoreCard) {
                    matchData = json.scoreCard;
                } else {
                    matchData = json;
                }

                if (!matchData || !matchData.innings || matchData.innings.length === 0) {
                    document.getElementById("content-container").innerHTML = `<div id="loading">No scorecard details available.</div>`;
                    return;
                }

                // বেনাৰৰ তথ্য আপডেট
                document.getElementById("header-match").textContent = `${matchData.subtitle || ''} • ${matchData.short_title || matchData.title}`;
                document.getElementById("header-status").textContent = matchData.game_state_str || matchData.status_str || "Live";
                if (matchData.venue) {
                    document.getElementById("header-venue").textContent = `📍 ${matchData.venue.name || ''}, ${matchData.venue.location || ''}`;
                }
                document.getElementById("header-note").textContent = matchData.status_note || matchData.live || "Match in progress";

                // বৰ্তমান চলি থকা ইনিংছৰ নম্বৰ নিৰ্বাচন
                if (matchData.innings.length > 0) {
                    activeInningIndex = matchData.innings.length - 1; // শেহতীয়া ইনিংছটো ডিফল্টভাৱে খুলিব
                }

                renderInningTabs();
                renderInningDetails(activeInningIndex);
            } catch (err) {
                console.error("Scorecard fetch error:", err);
                document.getElementById("content-container").innerHTML = `<div id="error-msg">Failed to load scorecard data.</div>`;
            }
        }

        function renderInningTabs() {
            const tabs = document.getElementById("tabs-container");
            tabs.innerHTML = "";

            matchData.innings.forEach((inn, idx) => {
                const btn = document.createElement("button");
                btn.className = `tab-btn ${idx === activeInningIndex ? 'active' : ''}`;
                btn.textContent = inn.name || `Inning ${inn.number}`;
                btn.onclick = () => {
                    activeInningIndex = idx;
                    renderInningTabs();
                    renderInningDetails(idx);
                };
                tabs.appendChild(btn);
            });
        }

        function renderInningDetails(index) {
            const inn = matchData.innings[index];
            if (!inn) return;

            const container = document.getElementById("content-container");

            // ১. বেটিং তালিকা
            let batHtml = "";
            (inn.batsmen || []).forEach(b => {
                batHtml += `
                    <tr>
                        <td>
                            <span class="player-name">${b.name}</span>
                            <span class="player-role">${b.role_str || ''}</span>
                            <div class="out-desc">${b.how_out || 'not out'}</div>
                        </td>
                        <td class="num-bold">${b.runs}</td>
                        <td>${b.balls_faced}</td>
                        <td>${b.fours}</td>
                        <td>${b.sixes}</td>
                        <td>${b.strike_rate}</td>
                    </tr>
                `;
            });

            // ২. বেটিং নকৰা খেলুৱৈ (Did Not Bat)
            let dnbHtml = "";
            if (inn.did_not_bat && inn.did_not_bat.length > 0) {
                const names = inn.did_not_bat.map(p => p.name).join(", ");
                dnbHtml = `
                    <div class="info-card">
                        <div style="font-size: 11px; color: #64748b; margin-bottom: 2px;">YET TO BAT</div>
                        <div class="dnb-text">${names}</div>
                    </div>
                `;
            }

            // ৩. এক্সট্ৰা (Extras)
            const ext = inn.extra_runs || {};
            const extDetails = `(b ${ext.byes || 0}, lb ${ext.legbyes || 0}, w ${ext.wides || 0}, nb ${ext.noballs || 0}, p ${ext.penalty || 0})`;
            const eq = inn.equations || {};

            // ৪. বলিং তালিকা
            let bowlHtml = "";
            (inn.bowlers || []).forEach(bw => {
                bowlHtml += `
                    <tr>
                        <td><span class="player-name">${bw.name}</span></td>
                        <td>${bw.overs}</td>
                        <td>${bw.maidens}</td>
                        <td>${bw.runs_conceded}</td>
                        <td class="num-bold">${bw.wickets}</td>
                        <td>${bw.noballs || 0}</td>
                        <td>${bw.wides || 0}</td>
                        <td>${bw.econ}</td>
                    </tr>
                `;
            });

            // ৫. উইকেট পতন (Fall of Wickets)
            let fowHtml = "";
            if (inn.fows && inn.fows.length > 0) {
                const fowList = inn.fows.map(f => `<span><b>${f.score_at_dismissal}-${f.number}</b> (${f.name}, ${f.overs_at_dismissal} ov)</span>`).join(" • ");
                fowHtml = `
                    <div class="section-label">Fall of Wickets</div>
                    <div class="info-card fow-text">${fowList}</div>
                `;
            }

            container.innerHTML = `
                <!-- Inning Score Banner -->
                <div class="inning-summary">
                    <span>${inn.name}</span>
                    <span style="color: #38bdf8;">${inn.scores_full || inn.scores}</span>
                </div>

                <!-- Batting -->
                <div class="section-label">Batting</div>
                <table>
                    <thead>
                        <tr>
                            <th>Batter</th>
                            <th>R</th>
                            <th>B</th>
                            <th>4s</th>
                            <th>6s</th>
                            <th>SR</th>
                        </tr>
                    </thead>
                    <tbody>${batHtml}</tbody>
                </table>

                <!-- Extras & Total -->
                <div class="info-card">
                    <div class="info-row">
                        <span>Extras ${extDetails}</span>
                        <span class="num-bold">${ext.total || 0}</span>
                    </div>
                    <div class="info-row" style="border-top: 1px solid #232e42; padding-top: 5px; margin-top: 4px;">
                        <span>Total (Run Rate: ${eq.runrate || '-'})</span>
                        <span class="num-bold" style="color: #38bdf8;">${inn.scores_full || inn.scores}</span>
                    </div>
                </div>

                ${dnbHtml}

                <!-- Bowling -->
                <div class="section-label">Bowling</div>
                <table>
                    <thead>
                        <tr>
                            <th>Bowler</th>
                            <th>O</th>
                            <th>M</th>
                            <th>R</th>
                            <th>W</th>
                            <th>NB</th>
                            <th>WD</th>
                            <th>ECO</th>
                        </tr>
                    </thead>
                    <tbody>${bowlHtml}</tbody>
                </table>

                <!-- FOW -->
                ${fowHtml}
            `;
        }

        // পেজ লোড হ'লে ফেচ আৰম্ভ হ'ব
        loadScorecard();
    </script>
</body>
</html>
