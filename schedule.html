<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>India Cricket Schedule</title>
    <style>
        :root {
            --bg-base: #020617;
            --card-bg: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(3, 7, 18, 0.98) 100%);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --t20-badge: #38bdf8;
            --odi-badge: #fbbf24;
            --test-badge: #f87171;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background-color: var(--bg-base);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 14px 8px;
            color: var(--text-primary);
        }

        .schedule-app {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* App Header */
        .header {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-flag-main {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            object-fit: cover;
        }

        .header-title-box h1 {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.2px;
        }

        .header-title-box span {
            font-size: 10.5px;
            color: var(--text-secondary);
        }

        .time-badge {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent);
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* Filter Tabs */
        .filter-wrapper {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .filter-wrapper::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        /* Matches List */
        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Match Card */
        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8);
            transition: transform 0.15s ease, border-color 0.2s ease;
        }

        .match-card:hover {
            border-color: var(--border-highlight);
        }

        .match-meta-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .format-badge {
            font-size: 9.5px;
            font-weight: 800;
            padding: 2.5px 7px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-t20 {
            background: rgba(56, 189, 248, 0.12);
            color: var(--t20-badge);
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .badge-odi {
            background: rgba(251, 191, 36, 0.12);
            color: var(--odi-badge);
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .badge-test {
            background: rgba(248, 113, 113, 0.12);
            color: var(--test-badge);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .match-date {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
        }

        /* Teams Display */
        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 8px 12px;
        }

        .team-unit {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .team-flag {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .team-name {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
        }

        .vs-text {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* Match Footer */
        .match-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
            border-top: 1px dashed rgba(255, 255, 255, 0.06);
            gap: 8px;
        }

        .venue-info {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10.5px;
            color: #cbd5e1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .venue-info svg {
            width: 12px;
            height: 12px;
            fill: #38bdf8;
            flex-shrink: 0;
        }

        .ist-time {
            font-size: 11.5px;
            font-weight: 800;
            color: #34d399;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
            font-variant-numeric: tabular-nums;
        }

        .ist-time svg {
            width: 11px;
            height: 11px;
            fill: #34d399;
        }
    </style>
</head>

                    <span class="match-date">${m.date}</span>
                </div>

                <div class="match-teams">
                    <div class="team-unit">
                        <img src="${m.teamA.flag}" class="team-flag" alt="${m.teamA.name}">
                        <span class="team-name">${m.teamA.name}</span>
                    </div>
                    <span class="vs-text">VS</span>
                    <div class="team-unit">
                        <span class="team-name">${m.teamB.name}</span>
                        <img src="${m.teamB.flag}" class="team-flag" alt="${m.teamB.name}">
                    </div>
                </div>

                <div class="match-footer">
                    <div class="venue-info">
                        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                        <span>${m.venue}</span>
                    </div>
                    <div class="ist-time">
                        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                        <span>${m.timeIST}</span>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterMatches(format) {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.textContent.toUpperCase().includes(format) || (format === 'ALL' && btn.textContent.includes('All')));
        });

        if (format === 'ALL') {
            renderMatches(matchesData);
        } else {
            renderMatches(matchesData.filter(m => m.format === format));
        }
    }

    renderMatches(matchesData);
</script>

</body>
</html>
