<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>India team schedule</title>
  <style>
    :root {
      --bg-body: #090e1a;
      --bg-header: #0f172a;
      --bg-card: #131c31;
      --bg-card-alt: #18233c;
      --bg-pill: #1e293b;
      --border-color: #253352;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-blue: #38bdf8;
      --india-blue: #2563eb;
      --badge-odi: #0284c7;
      --badge-test: #d97706;
      --badge-t20: #7c3aed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-primary);
      line-height: 1.45;
      padding-bottom: 28px;
    }

    /* Sticky Top Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 16px 12px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1d4ed8, #0ea5e9);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text-primary);
    }

    .brand-title p {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    .match-counter {
      background-color: var(--bg-pill);
      border: 1px solid var(--border-color);
      color: var(--accent-blue);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* Filter Bar */
    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .filter-row::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      background-color: var(--bg-pill);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }

    .filter-btn.active {
      background-color: var(--india-blue);
      color: #ffffff;
      border-color: #3b82f6;
    }

    /* Container */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 12px 14px;
    }

    /* Series Divider */
    .series-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 16px 2px 10px;
      padding-left: 8px;
      border-left: 3px solid var(--accent-blue);
    }

    .series-banner:first-child {
      margin-top: 4px;
    }

    .series-name {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-blue);
    }

    .series-year {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Match Card */
    .match-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 11px;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .match-date {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .format-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: #ffffff;
      flex-shrink: 0;
    }

    .format-odi { background-color: var(--badge-odi); }
    .format-test { background-color: var(--badge-test); }
    .format-t20i { background-color: var(--badge-t20); }

    .match-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 500;
    }

    /* Teams Section */
    .teams-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background-color: var(--bg-card-alt);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 11px;
    }

    .team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .team-code {
      width: 30px;
      height: 22px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.4px;
      color: #ffffff;
      flex-shrink: 0;
    }

    .code-ind { background-color: #1d4ed8; }
    .code-nz  { background-color: #334155; }
    .code-sl  { background-color: #0369a1; }
    .code-zim { background-color: #b91c1c; }
    .code-aus { background-color: #ca8a04; color: #0f172a; }
    .code-pak { background-color: #15803d; }
    .code-afg { background-color: #1e40af; }
    .code-tbc { background-color: #475569; }

    .team-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .team-name.india {
      color: #ffffff;
      font-weight: 700;
    }

    /* Footer Details */
    .card-footer {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .meta-line {
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .meta-line svg {
      width: 14px;
      height: 14px;
      margin-top: 2px;
      flex-shrink: 0;
      color: var(--accent-blue);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-secondary);
      font-size: 14px;
    }
  </style>
</head>
<body>

    function renderSchedule(formatFilter = "ALL") {
      const filtered = formatFilter === "ALL"
        ? scheduleData
        : scheduleData.filter(m => m.format === formatFilter);

      countEl.textContent = `${filtered.length} ${filtered.length === 1 ? "Match" : "Matches"}`;

      if (!filtered.length) {
        listEl.innerHTML = `<div class="empty-state">No matches found for this format.</div>`;
        return;
      }

      let html = "";
      let currentSeries = "";

      filtered.forEach(match => {
        if (match.series !== currentSeries) {
          currentSeries = match.series;
          html += `
            <div class="series-banner">
              <span class="series-name">${match.series}</span>
              <span class="series-year">${match.year}</span>
            </div>
          `;
        }

        const badgeClass =
          match.format === "TEST" ? "format-test" :
          match.format === "T20I" ? "format-t20i" : "format-odi";

        html += `
          <article class="match-card">
            <div class="card-top">
              <span class="match-date">${match.date}</span>
              <span class="format-badge ${badgeClass}">${match.format}</span>

            <div class="match-subtitle">${match.title}</div>

                <div class="team-info">
                  <span class="team-code code-${match.team1.code.toLowerCase()}">${match.team1.code}</span>
                  <span class="team-name ${match.team1.code === 'IND' ? 'india' : ''}">${match.team1.name}</span>
                </div>
              </div>

              <div class="team-row">
                <div class="team-info">
                  <span class="team-code code-${match.team2.code.toLowerCase()}">${match.team2.code}</span>
                  <span class="team-name ${match.team2.code === 'IND' ? 'india' : ''}">${match.team2.name}</span>
                </div>
              </div>
            </div>

            <div class="card-footer">
              <div class="meta-line">${pinIcon}<span>${match.venue}</span></div>
              ${match.time ? `<div class="meta-line">${clockIcon}<span>${match.time}</span></div>` : ""}
            </div>
          </article>
        `;
      });

      listEl.innerHTML = html;
    }

    filterBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        filterBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        renderSchedule(btn.dataset.format);
      });
    });

    renderSchedule("ALL");
