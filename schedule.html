<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Upcoming Matches</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; color: #f1f5f9; padding: 12px; display: flex; justify-content: center; }
        .schedule-container { width: 100%; max-width: 520px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #161f30; padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #232e42; }
        .title { font-size: 15px; font-weight: 700; color: #38bdf8; }
        .count { background: #1e293b; color: #94a3b8; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
        .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { background: #161f30; color: #94a3b8; border: 1px solid #283548; padding: 5px 12px; border-radius: 16px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: #2563eb; color: #fff; border-color: #3b82f6; }
        .list { display: flex; flex-direction: column; gap: 8px; }
        .card { background: #161f30; border: 1px solid #232e42; border-radius: 10px; padding: 10px 12px; }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .match-id { font-size: 10px; color: #64748b; font-weight: 700; }
        .badge { font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
        .t20i { background: rgba(56,189,248,0.15); color: #38bdf8; }
        .odi { background: rgba(52,211,153,0.15); color: #34d399; }
        .test { background: rgba(248,113,113,0.15); color: #f87171; }
        .match-name { font-size: 13px; font-weight: 600; color: #f8fafc; margin-bottom: 8px; }
        .card-info { border-top: 1px solid #1e293b; padding-top: 6px; display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #94a3b8; }
        .row { display: flex; justify-content: space-between; align-items: center; }
        .time { background: #1e293b; color: #38bdf8; padding: 1px 5px; border-radius: 3px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="schedule-container">
        <div class="header">
            <span class="title">🏏 Upcoming Fixtures</span>
            <span class="count" id="count-badge">0 Matches</span>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="filterSchedule('ALL')">All</button>
            <button class="tab-btn" onclick="filterSchedule('T20I')">T20I</button>
            <button class="tab-btn" onclick="filterSchedule('ODI')">ODI</button>
            <button class="tab-btn" onclick="filterSchedule('TEST')">Test</button>
        </div>

        <div class="list" id="match-list"></div>
    </div>

    <script>
        const matches = [
            { id: 1, name: "New Zealand vs India — 1st T20I", date: "22 Oct 2026", stadium: "Hagley Oval, Christchurch", time: "12:30 PM", format: "T20I" },
            { id: 2, name: "New Zealand vs India — 2nd T20I", date: "24 Oct 2026", stadium: "Hagley Oval, Christchurch", time: "12:30 PM", format: "T20I" },
            { id: 3, name: "New Zealand vs India — 3rd T20I", date: "27 Oct 2026", stadium: "Hnry Stadium, Wellington", time: "12:30 PM", format: "T20I" },
            { id: 4, name: "New Zealand vs India — 4th T20I", date: "30 Oct 2026", stadium: "Eden Park, Auckland", time: "12:30 PM", format: "T20I" },
            { id: 5, name: "United Arab Emirates vs India — Group C", date: "31 Oct 2026", stadium: "Mission Road Ground, Mong Kok", time: "8:05 AM", format: "T20I" },
            { id: 6, name: "New Zealand vs India — 5th T20I", date: "1 Nov 2026", stadium: "Seddon Park, Hamilton", time: "12:30 PM", format: "T20I" },
            { id: 7, name: "New Zealand vs India — 1st ODI", date: "4 Nov 2026", stadium: "Eden Park, Auckland", time: "7:30 AM", format: "ODI" },
            { id: 8, name: "New Zealand vs India — 2nd ODI", date: "7 Nov 2026", stadium: "Hnry Stadium, Wellington", time: "7:30 AM", format: "ODI" },
            { id: 9, name: "New Zealand vs India — 3rd ODI", date: "10 Nov 2026", stadium: "Seddon Park, Hamilton", time: "7:30 AM", format: "ODI" },
            { id: 10, name: "New Zealand vs India — 4th ODI", date: "13 Nov 2026", stadium: "Bay Oval, Mount Maunganui", time: "7:30 AM", format: "ODI" },
            { id: 11, name: "New Zealand vs India — 5th ODI", date: "15 Nov 2026", stadium: "Bay Oval, Mount Maunganui", time: "7:30 AM", format: "ODI" },
            { id: 12, name: "New Zealand vs India — 1st Test", date: "19–23 Nov 2026", stadium: "Basin Reserve, Wellington", time: "3:30 AM", format: "Test" },
            { id: 13, name: "New Zealand vs India — 2nd Test", date: "27 Nov–1 Dec 2026", stadium: "Hagley Oval, Christchurch", time: "3:30 AM", format: "Test" },
            { id: 14, name: "India vs Sri Lanka — 1st ODI", date: "13 Dec 2026", stadium: "Arun Jaitley Stadium, Delhi", time: "2:00 PM", format: "ODI" },
            { id: 15, name: "India vs Sri Lanka — 2nd ODI", date: "16 Dec 2026", stadium: "M.Chinnaswamy Stadium, Bengaluru", time: "2:00 PM", format: "ODI" },
            { id: 16, name: "India vs Sri Lanka — 3rd ODI", date: "19 Dec 2026", stadium: "Narendra Modi Stadium, Ahmedabad", time: "2:00 PM", format: "ODI" },
            { id: 17, name: "India vs Sri Lanka — 1st T20I", date: "22 Dec 2026", stadium: "Niranjan Shah Stadium, Rajkot", time: "7:00 PM", format: "T20I" },
            { id: 18, name: "India vs Sri Lanka — 2nd T20I", date: "24 Dec 2026", stadium: "Barabati Stadium, Cuttack", time: "7:00 PM", format: "T20I" },
            { id: 19, name: "India vs Sri Lanka — 3rd T20I", date: "27 Dec 2026", stadium: "MCA Stadium, Pune", time: "7:00 PM", format: "T20I" },
            { id: 20, name: "India vs Zimbabwe — 1st ODI", date: "3 Jan 2027", stadium: "Eden Gardens, Kolkata", time: "2:00 PM", format: "ODI" },
            { id: 21, name: "India vs Zimbabwe — 2nd ODI", date: "6 Jan 2027", stadium: "Rajiv Gandhi Stadium, Hyderabad", time: "2:00 PM", format: "ODI" },
            { id: 22, name: "India vs Zimbabwe — 3rd ODI", date: "9 Jan 2027", stadium: "Wankhede Stadium, Mumbai", time: "2:00 PM", format: "ODI" },
            { id: 23, name: "India vs Australia — 1st Test", date: "21–25 Jan 2027", stadium: "VCA Stadium, Nagpur", time: "9:30 AM", format: "Test" },
            { id: 24, name: "India vs Australia — 2nd Test", date: "29 Jan–2 Feb 2027", stadium: "MA Chidambaram Stadium, Chennai", time: "9:30 AM", format: "Test" },
            { id: 25, name: "India vs Australia — 3rd Test", date: "11–15 Feb 2027", stadium: "Barsapara Cricket Stadium, Guwahati", time: "9:00 AM", format: "Test" },
            { id: 26, name: "India vs Australia — 4th Test", date: "19–23 Feb 2027", stadium: "JSCA Stadium, Ranchi", time: "9:30 AM", format: "Test" },
            { id: 27, name: "India vs Australia — 5th Test", date: "27 Feb–3 Mar 2027", stadium: "Narendra Modi Stadium, Ahmedabad", time: "9:30 AM", format: "Test" },
            { id: 28, name: "India vs Australia — Group A", date: "7 Oct 2027", stadium: "Newlands, Cape Town", time: "1:30 PM", format: "ODI" },
            { id: 29, name: "India vs Pakistan — Group A", date: "10 Oct 2027", stadium: "Wanderers Stadium, Johannesburg", time: "1:30 PM", format: "ODI" },
            { id: 30, name: "India vs Afghanistan — Group A", date: "14 Oct 2027", stadium: "SuperSport Park, Centurion", time: "1:30 PM", format: "ODI" },
            { id: 31, name: "India vs TBC — Group A", date: "17 Oct 2027", stadium: "Mangaung Oval, Bloemfontein", time: "1:30 PM", format: "ODI" },
            { id: 32, name: "Zimbabwe vs India — Group A", date: "24 Oct 2027", stadium: "Mosi-oa-Tunya Stadium, Victoria Falls", time: "1:30 PM", format: "ODI" }
        ];

        function render(list) {
            const container = document.getElementById("match-list");
            container.innerHTML = "";
            list.forEach(m => {
                const f = m.format.toLowerCase();
                const badgeClass = f === 'test' ? 'test' : (f === 'odi' ? 'odi' : 't20i');
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <div class="card-top">
                        <span class="match-id">#${m.id}</span>
                        <span class="badge ${badgeClass}">${m.format}</span>
                    </div>
                    <div class="match-name">${m.name}</div>
                    <div class="card-info">
                        <div class="row">
                            <span>📅 ${m.date}</span>
                            <span class="time">⏰ ${m.time} IST</span>
                        </div>
                        <div>📍 ${m.stadium}</div>
                    </div>
                `;
                container.appendChild(card);
            });
            document.getElementById("count-badge").textContent = `${list.length} Matches`;
        }

        function filterSchedule(type) {
            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.classList.toggle("active", btn.textContent.toUpperCase() === type);
            });
            if (type === 'ALL') render(matches);
            else render(matches.filter(m => m.format.toUpperCase() === type));
        }

        render(matches);
    </script>
</body>
</html>
