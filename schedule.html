<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>India team schedule</title>
  <style>
    /* Design Tokens & Reset */
    :root {
      --bg-page: #0b0f19;
      --bg-card: #131a2a;
      --bg-card-hover: #172034;
      --bg-header: rgba(11, 15, 25, 0.88);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;

      /* Format Accents */
      --odi-bg: rgba(56, 189, 248, 0.14);
      --odi-text: #38bdf8;
      --odi-border: rgba(56, 189, 248, 0.3);

      --t20-bg: rgba(168, 85, 247, 0.14);
      --t20-text: #c084fc;
      --t20-border: rgba(168, 85, 247, 0.3);

      --test-bg: rgba(244, 63, 94, 0.14);
      --test-text: #fb7185;
      --test-border: rgba(244, 63, 94, 0.3);

      --accent-ind: #2563eb;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      line-height: 1.45;
      padding-bottom: 2.5rem;
    }

    /* Sticky Header & Filter Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background-color: var(--bg-header);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .header-inner {
      padding: 1rem 0 0.85rem;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-bar {
      width: 4px;
      height: 1.5rem;
      border-radius: 99px;
      background: linear-gradient(180deg, #ff9933 0%, #ffffff 50%, #138808 100%);
      flex-shrink: 0;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .ist-pill {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      padding: 0.28rem 0.6rem;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* Filter Tabs */
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 0.15rem;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      appearance: none;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-card);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      touch-action: manipulation;
    }

    .tab-btn:hover {
      background-color: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .tab-btn:active {
      transform: scale(0.97);
    }

    .tab-btn.active {
      background-color: var(--accent-ind);
      border-color: #3b82f6;
      color: #ffffff;
    }

    .tab-count {
      font-size: 0.72rem;
      padding: 0.05rem 0.42rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.25);
      color: inherit;
    }

    .tab-btn:not(.active) .tab-count {
      background: rgba(255, 255, 255, 0.07);
      color: var(--text-muted);
    }

    /* Main List & Series Groupings */
    main {
      padding-top: 1rem;
    }

    .series-group {
      margin-bottom: 1.5rem;
    }

    .series-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin: 0.5rem 0 0.7rem;
      padding: 0 0.15rem;
    }

    .series-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
    }

    .series-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* Match Card */
    .match-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 0.95rem 1rem;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .match-card:hover {
      border-color: var(--border-strong);
      background-color: var(--bg-card-hover);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.65rem;
      flex-wrap: wrap;
    }

    .match-date {
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .badges {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .format-badge {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      border: 1px solid transparent;
    }

    .format-ODI {
      background-color: var(--odi-bg);
      color: var(--odi-text);
      border-color: var(--odi-border);
    }

    .format-T20I {
      background-color: var(--t20-bg);
      color: var(--t20-text);
      border-color: var(--t20-border);
    }

    .format-Test {
      background-color: var(--test-bg);
      color: var(--test-text);
      border-color: var(--test-border);
    }

    .match-label {
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* Teams Row */
    .teams-row {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .team-name {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .team-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #3b82f6;
      flex-shrink: 0;
    }

    .vs-tag {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: lowercase;
    }

    /* Footer Info: Venue & IST Time */
    .card-bottom {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.8rem;
    }

    .venue {
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      color: var(--text-secondary);
      flex: 1;
      min-width: 0;
    }

    .venue svg {
      width: 14px;
      height: 14px;
      margin-top: 2px;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .time-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-weight: 700;
      font-size: 0.78rem;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.06);
      padding: 0.24rem 0.55rem;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .time-badge svg {
      width: 13px;
      height: 13px;
      color: #38bdf8;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      margin-top: 1.5rem;
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 1.12rem;
      }
      .card-bottom {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <!-- Sticky Header with Title and Format Filters -->
  <header>
    <div class="container header-inner">
      <div class="title-row">
        <div class="brand">
          <span class="brand-bar" aria-hidden="true"></span>
          <h1>India team schedule</h1>
        </div>
        <span class="ist-pill">ALL TIMES IST</span>
      </div>

      <nav class="filter-bar" role="tablist" aria-label="Match format filter">
        <button class="tab-btn active" data-filter="ALL" role="tab" aria-selected="true">
          All <span class="tab-count" id="count-ALL">19</span>
        </button>
        <button class="tab-btn" data-filter="Test" role="tab" aria-selected="false">
          Test <span class="tab-count" id="count-Test">5</span>
        </button>
        <button class="tab-btn" data-filter="ODI" role="tab" aria-selected="false">
          ODI <span class="tab-count" id="count-ODI">11</span>

        <button class="tab-btn" data-filter="T20I" role="tab" aria-selected="false">
          T20I <span class="tab-count" id="count-T20I">3</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Schedule Container -->
  <main class="container" id="schedule-root" aria-live="polite"></main>

  <footer class="container">
    Upcoming fixtures only &bull; Start times in Indian Standard Time (IST)
  </footer>

  <script>

        },
        {

          format: "ODI",
          team1: "India",

        },
        {

        {

        {

        },
        {
          id: 17,
          series: "ICC Cricket World Cup 2027",
          date: "Thu, 14 Oct 2027",
          title: "13th Match, Group A",
          format: "ODI",

          team2: "Afghanistan",
          venue: "SuperSport Park, Centurion",
          time: "1:30 PM IST"
        },
        {
          id: 18,
          series: "ICC Cricket World Cup 2027",
          date: "Sun, 17 Oct 2027",
          title: "18th Match, Group A",
          format: "ODI",
          team1: "India",
          team2: "TBC (Qualifier A)",
          venue: "Mangaung Oval, Bloemfontein",
          time: "1:30 PM IST"
        },
        {
          id: 19,
          series: "ICC Cricket World Cup 2027",
          date: "Sun, 24 Oct 2027",
          title: "30th Match, Group A",
          format: "ODI",
          team1: "Zimbabwe",
          team2: "India",
          venue: "Mosi-oa-Tunya International Cricket Stadium, Victoria Falls",
          time: "1:30 PM IST"
        }
      ];

      const root = document.getElementById("schedule-root");
      const buttons = document.querySelectorAll(".tab-btn");

      // Inline SVG icons (zero external requests)
      const PIN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>';
      const CLOCK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderTeam(name) {
        const isIndia = name === "India";
        return `<span class="team-name">${isIndia ? '<span class="team-dot" aria-hidden="true"></span>' : ""}${escapeHtml(name)}</span>`;
      }

      function renderSchedule(filter) {
        const filtered = filter === "ALL"
          ? MATCHES
          : MATCHES.filter((m) => m.format === filter);

        // Preserve chronological order while grouping consecutive series matches cleanly
        const groups = [];
        for (const match of filtered) {
          const lastGroup = groups[groups.length - 1];
          if (lastGroup && lastGroup.series === match.series) {
            lastGroup.matches.push(match);
          } else {
            groups.push({ series: match.series, matches: [match] });
          }
        }

        const html = groups.map((group) => {
          const cardsHtml = group.matches.map((m) => `
            <article class="match-card">
              <div class="card-top">
                <span class="match-date">${escapeHtml(m.date)}</span>
                <div class="badges">
                  <span class="match-label">${escapeHtml(m.title)}</span>
                  <span class="format-badge format-${escapeHtml(m.format)}">${escapeHtml(m.format)}</span>
                </div>
              </div>
              <div class="teams-row">
                ${renderTeam(m.team1)}
                <span class="vs-tag">vs</span>
                ${renderTeam(m.team2)}
              </div>
              <div class="card-bottom">
                <div class="venue">
                  ${PIN_ICON}
                  <span>${escapeHtml(m.venue)}</span>
                </div>
                <div class="time-badge">
                  ${CLOCK_ICON}
                  <span>${escapeHtml(m.time)}</span>
                </div>
              </div>
            </article>
          `).join("");

          return `
            <section class="series-group">
              <div class="series-header">
                <h2 class="series-title">${escapeHtml(group.series)}</h2>
                <span class="series-meta">${group.matches.length} ${group.matches.length === 1 ? "match" : "matches"}</span>
              </div>
              <div class="match-list">
                ${cardsHtml}
              </div>
            </section>
          `;
        }).join("");

        root.innerHTML = html;
      }

      // Filter button interactions
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          const selected = btn.getAttribute("data-filter");
          buttons.forEach((b) => {
            const isActive = b === btn;
            b.classList.toggle("active", isActive);
            b.setAttribute("aria-selected", String(isActive));
          });
          renderSchedule(selected);
        });
      });

      // Initial render
      renderSchedule("ALL");
    })();
  </script>
</body>
</html>
