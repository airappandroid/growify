<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India Match Schedule</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .schedule-container {
            width: 100%;
            max-width: 550px;
        }

        /* Top Banner */
        .page-header {
            background: #161f30;
            border: 1px solid #283548;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .match-count {
            background: #1e293b;
            color: #94a3b8;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 4px;
            scrollbar-width: none;
        }

        .filter-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: #161f30;
            color: #94a3b8;
            border: 1px solid #283548;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
        }

        /* Match List Cards */
        .match-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-card {
            background: #161f30;
            border: 1px solid #283548;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s ease, border-color 0.2s ease;
        }

        .match-card:hover {
            border-color: #38bdf8;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .match-no {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
        }

        .format-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 7px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .format-t20i {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .format-odi {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .format-test {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        .match-title-text {
            font-size: 14px;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .card-bottom {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px solid #232e42;
            padding-top: 9px;
            font-size: 11.5px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
        }

        .info-item.venue {
            color: #94a3b8;
        }

        .date-time-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-badge {
            background: #1e293b;
            color: #38bdf8;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <div class="schedule-container">
        <!-- Header -->
        <div class="page-header">
            <span class="header-title">🏏 India Fixtures</span>
            <span class="match-count" id="count-badge">38 Matches</span>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="tab-btn active" onclick="filterSchedule('ALL')">All</button>
            <button class="tab-btn" onclick="filterSchedule('T20I')">T20I</button>
            <button class="tab-btn" onclick="filterSchedule('ODI')">ODI</button>
            <button class="tab-btn" onclick="filterSchedule('TEST')">Test</button>
        </div>

        <!-- Dynamic Match List -->
        <div class="match-list" id="match-list-container"></div>
    </div>

    <script>

            { id: 32, name: "India vs Zimbabwe — 2nd ODI", date: "6 Jan 2027", stadium: "Rajiv Gandhi International Stadium, Hyderabad", time: "2:00 PM", format: "ODI" },
            { id: 33, name: "India vs Zimbabwe — 3rd ODI", date: "9 Jan 2027", stadium: "Wankhede Stadium, Mumbai", time: "2:00 PM", format: "ODI" },
            { id: 34, name: "India vs Australia — 1st Test", date: "21–25 Jan 2027", stadium: "VCA Stadium, Nagpur", time: "9:30 AM", format: "Test" },
            { id: 35, name: "India vs Australia — 2nd Test", date: "29 Jan–2 Feb 2027", stadium: "MA Chidambaram Stadium, Chennai", time: "9:30 AM", format: "Test" },
            { id: 36, name: "India vs Australia — 3rd Test", date: "11–15 Feb 2027", stadium: "Barsapara Cricket Stadium, Guwahati", time: "9:00 AM", format: "Test" },
            { id: 37, name: "India vs Australia — 4th Test", date: "19–23 Feb 2027", stadium: "JSCA International Stadium, Ranchi", time: "9:30 AM", format: "Test" },
            { id: 38, name: "India vs Australia — 5th Test", date: "27 Feb–3 Mar 2027", stadium: "Narendra Modi Stadium, Ahmedabad", time: "9:30 AM", format: "Test" }
        ];

        function renderMatches(list) {
            const container = document.getElementById("match-list-container");
            container.innerHTML = "";

            list.forEach(m => {
                const formatClass = m.format.toLowerCase() === 'test' ? 'format-test' : (m.format.toLowerCase() === 'odi' ? 'format-odi' : 'format-t20i');
                
                const card = document.createElement("div");
                card.className = "match-card";
                card.innerHTML = `
                    <div class="card-top">
                        <span class="match-no">MATCH #${m.id}</span>
                        <span class="format-badge ${formatClass}">${m.format}</span>
                    </div>
                    <div class="match-title-text">${m.name}</div>
                    <div class="card-bottom">
                        <div class="date-time-row">
                            <span class="info-item">📅 ${m.date}</span>
                            <span class="time-badge">⏰ ${m.time} IST</span>
                        </div>
                        <div class="info-item venue">📍 ${m.stadium}</div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById("count-badge").textContent = `${list.length} Matches`;
        }

        function filterSchedule(type) {
            // Tab Active Switch
            const buttons = document.querySelectorAll(".tab-btn");
            buttons.forEach(btn => {
                btn.classList.toggle("active", btn.textContent.toUpperCase() === type);
            });

            if (type === 'ALL') {
                renderMatches(matches);
            } else {
                const filtered = matches.filter(m => m.format.toUpperCase() === type);
                renderMatches(filtered);
            }
        }

        // প্ৰথমবাৰ সম্পূৰ্ণ সূচী লোড হ'ব
        renderMatches(matches);
    </script>
</body>
</html>
