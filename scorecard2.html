<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Full Scorecard</title>
<style>
:root{--bg:#0b1020;--card:#161d33;--card2:#202940;--text:#fff;--muted:#a7b1c9;--accent:#ff7a45;--green:#4cd964;--line:rgba(255,255,255,.09);--yellow:#ffbd59}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px Arial,Roboto,sans-serif}
body{-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.topbar{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 14px;border-bottom:1px solid var(--line)}
.topline{display:flex;align-items:center;gap:10px}
.back-btn{width:40px;height:40px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:white;flex-shrink:0}
.brand{min-width:0;flex:1}
.name{font-size:17px;font-weight:800}
.tagline{font-size:11px;color:var(--muted);margin-top:4px}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;padding:0;background:var(--card2);border:1px solid var(--line);color:white;border-radius:10px;flex-shrink:0}
.container{width:100%;max-width:650px;margin:0 auto;padding:12px}
.match-card{background:linear-gradient(135deg,#202a46,#161d33);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.status-row{display:flex;align-items:center;gap:7px;color:var(--green);font-weight:800;font-size:11px;letter-spacing:.4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.status-text{margin-left:auto;color:var(--muted);font-weight:500;letter-spacing:0}
.match-title{font-size:14px;font-weight:700;margin-top:12px;line-height:1.45}
.match-note{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.5}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.team{min-width:0;background:rgba(8,13,27,.36);border:1px solid var(--line);border-radius:12px;padding:10px}
.team-head{display:flex;align-items:center;gap:7px}
.team-logo{width:27px;height:27px;object-fit:contain;flex-shrink:0}
.team-name{font-size:12px;font-weight:800;overflow-wrap:anywhere}
.team-score{font-size:clamp(17px,5vw,20px);font-weight:800;margin-top:8px;overflow-wrap:anywhere;line-height:1.35}
.team-overs{display:none}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;overscroll-behavior-x:contain}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:10px 14px;font-weight:700;font-size:12px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#101827}
.innings-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.innings-head{padding:12px;background:var(--card2);display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0}
.innings-name{font-weight:800;font-size:14px}
.innings-total{text-align:right;font-size:16px;font-weight:800;white-space:nowrap}
.innings-sub{font-size:11px;color:var(--muted);font-weight:500;margin-top:4px}
.table-wrap{width:100%;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.score-table{width:100%;border-collapse:collapse;min-width:0;table-layout:fixed;font-size:12px}
.score-table th{background:rgba(255,255,255,.025);color:var(--muted);font-size:10px;font-weight:700;text-align:right;padding:10px 7px;white-space:nowrap}
.score-table th:first-child,.score-table td:first-child{text-align:left;padding-left:13px}
.score-table td{padding:10px 7px;border-top:1px solid var(--line);text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}
.score-table td:first-child{width:40%;min-width:0;overflow-wrap:break-word;word-break:normal}
.player{font-weight:700;font-size:12px;overflow-wrap:break-word;word-break:normal;line-height:1.35}
.dismissal{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.35;font-weight:400}.dismissal.not-out{color:var(--green);font-weight:700}
.total-row td{font-weight:800;background:rgba(255,255,255,.025)}
.section-label{padding:12px 13px 8px;font-weight:800;font-size:12px}
.extras-line{display:flex;justify-content:space-between;gap:12px;padding:9px 13px;color:var(--muted);font-size:12px}
.extras-line strong{color:var(--text)}
.fow{padding:0 13px 13px;color:var(--muted);font-size:11px;line-height:1.7}
.fow strong{color:var(--text)}
.fow-item{padding:3px 0;overflow-wrap:anywhere}.fow-item span{white-space:nowrap}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.panel-title{font-size:14px;font-weight:800;padding:14px;border-bottom:1px solid var(--line)}
.footer{text-align:center;color:#8996b2;font-size:11px;padding:12px 5px 24px}
.error{color:#ffb49a}
.score-table th,.score-table td{padding:10px 5px}
@media(max-width:390px){
 .container{padding:10px 8px}
 .match-card{padding:12px}
 .status-row{font-size:10px}
 .match-title{font-size:13px}
 .team{padding:9px}
 .team-name{font-size:11px}
 .team-logo{width:24px;height:24px}
 .score-table{font-size:11px}
 .score-table th{font-size:9px;padding:9px 3px}
 .score-table td{padding:10px 3px}
 .score-table th:first-child,.score-table td:first-child{padding-left:9px}
 .score-table td:first-child{width:40%}
 .player{font-size:11px}
 .dismissal{font-size:9px}
}
@media(max-width:330px){
 .container{padding:8px 5px}
 .team-score{font-size:16px}
 .innings-name{font-size:12px}
 .innings-total{font-size:14px}
 .score-table th,.score-table td{padding-left:2px;padding-right:2px}
}
</style>
</head>
<body>


<main class="container">
  <section class="match-card">
    <div class="status-row"><span class="dot" id="statusDot"></span><span id="statusLabel">LOADING</span><span class="status-text" id="updatedTop">Updating...</span></div>
    <div class="match-title" id="matchTitle">Loading match details...</div>
    <div class="match-note" id="matchNote">Please wait while the scorecard loads.</div>
    <div class="teams" id="teams"></div>
  </section>

  <div class="tabs" id="inningsTabs" aria-label="Innings navigation"></div>
  <div id="scorecards"><div class="panel"><div class="empty">Loading full scorecard...</div></div></div>
  <section class="panel" id="currentPlayersPanel" hidden>
    <div class="panel-title">Current Batters</div><div id="currentBatters"></div>
    <div class="panel-title">Current Bowlers</div><div id="currentBowlers"></div>
  </section>
  <div class="footer" id="updated">Cricket Score App · Auto refresh every 60 seconds</div>
</main>

<script>
(function(){
'use strict';
const API='https://bdcr2.aminurmarch.workers.dev/?id=98442';
const REFRESH_MS=120000;
const $=id=>document.getElementById(id);
const val=v=>(v===null||v===undefined||v===''?'—':String(v));
const esc=v=>val(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const first=(...a)=>a.find(v=>v!==undefined&&v!==null&&v!=='');
let busy=false,hasData=false,lastData=null,activeInnings=0;


function getTeams(m){
  if(Array.isArray(m.teams)&&m.teams.length)return m.teams;
  const a=m.teama||m.team_a||{},b=m.teamb||m.team_b||{};
  return [a,b].filter(t=>Object.keys(t).length);
}
function cleanTeamScore(t){
  const full=first(t.scores_full,t.score_full);
  if(full!==undefined){
    const cleaned=String(full).replace(/\s*\(\s*ov\s*\)/i,'').trim();
    if(cleaned)return cleaned;
  }
  return first(t.scores,t.score,'—');
}
function teamName(t){return first(t.title,t.name,t.team_name,t.short_name,t.abbr,'Team');}
function teamScore(t){return cleanTeamScore(t);}
function renderTeams(m){
  const teams=getTeams(m);
  $('teams').innerHTML=teams.slice(0,2).map(t=>{
    const logo=first(t.logo_url,t.thumb_url,t.image);
    const score=teamScore(t);
    const overs=first(t.overs,t.over);
    return '<div class="team"><div class="team-head">'+(logo?'<img class="team-logo" src="'+esc(logo)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">':'')+
      '<div class="team-name">'+esc(teamName(t))+'</div></div>'+
      (score?'<div class="team-score">'+esc(score)+'</div>':'<div class="team-score">—</div>')+'</div>';
  }).join('');
}
function asArray(v){return Array.isArray(v)?v:[];}
function inningsFrom(m){
  const candidates=[
    m.innings,m.scorecard&&m.scorecard.innings,
    m.match_scorecard&&m.match_scorecard.innings,
    m.response&&m.response.innings
  ];
  for(const c of candidates)if(Array.isArray(c)&&c.length)return c;
  // Fallback to the live innings object exposed by the current API shape.
  if(m.live_inning&&typeof m.live_inning==='object')return [Object.assign({},m.live_inning,{
    batsmen:first(m.batsmen,m.live_inning.batsmen,[]),
    bowlers:first(m.bowlers,m.live_inning.bowlers,[]),
    equations:first(m.live_inning.equations,m.live_score,{})
  })];
  if(m.live_score||m.score||m.batsmen||m.bowlers){
    return [Object.assign({},m,{
      name:first(m.live_inning_name,m.team_batting,m.batting_team,'Current Innings'),
      batsmen:first(m.batsmen,m.batters,[]),bowlers:first(m.bowlers,[]),
      equations:first(m.live_score,m.score,{})
    })];
  }
  return [];
}
function getBatters(i){return asArray(first(i.batsmen,i.batting,i.batters,[]));}
function getBowlers(i){return asArray(first(i.bowlers,i.bowling,[]));}
function scoreTotals(i){
  const e=i.equations||{};
  const runs=first(e.runs,i.runs,i.score_runs);
  const wickets=first(e.wickets,i.wickets);
  const overs=first(e.overs,i.overs);
  return {runs,wickets,overs,rr:first(e.runrate,e.run_rate,i.runrate,i.run_rate)};
}
function inningsLabel(i,index){
  return first(i.name,i.short_name,i.innings_name,i.team&&i.team.name,i.batting_team,`Innings ${index+1}`);
}
function batterRow(p){
  const name=first(p.name,p.title,p.batter,p.player_name,'Batter');
  const rawHow=first(p.how_out,p.dismissal,p.out_str,p.status_str,p.notout===true?'not out':'');
  const isNotOut=p.notout===true || /\\bnot\\s*out\\b/i.test(String(rawHow||'')) || /\\bnot\\s*out\\b/i.test(String(p.status||''));
  const how=isNotOut?'not out':rawHow;
  return '<tr><td><div class="player">'+esc(name)+'</div>'+(how?'<div class="dismissal'+(isNotOut?' not-out':'')+'">'+esc(how)+'</div>':'')+'</td>'+
    '<td>'+esc(first(p.runs,p.r,0))+'</td><td>'+esc(first(p.balls_faced,p.balls,p.b,0))+'</td>'+
    '<td>'+esc(first(p.fours,p.boundaries,0))+'</td><td>'+esc(first(p.sixes,0))+'</td>'+
    '<td>'+esc(first(p.strike_rate,p.sr,'—'))+'</td></tr>';
}
function bowlerRow(p){
  return '<tr><td><div class="player">'+esc(first(p.name,p.title,p.bowler,p.player_name,'Bowler'))+'</div></td>'+
    '<td>'+esc(first(p.overs,p.o,'—'))+'</td><td>'+esc(first(p.maidens,p.m,0))+'</td>'+
    '<td>'+esc(first(p.runs_conceded,p.runs,p.r,0))+'</td><td>'+esc(first(p.wickets,p.w,0))+'</td>'+
    '<td>'+esc(first(p.econ,p.economy,p.economy_rate,'—'))+'</td></tr>';
}
function extrasText(extras){
  if(extras===undefined||extras===null)return '';
  if(typeof extras!=='object')return '<div class="extras-line"><span>Extras</span><strong>'+esc(extras)+'</strong></div>';
  const total=first(extras.total,extras.runs,extras.extra_runs);
  const bits=[
    ['b',first(extras.byes,extras.b)],['lb',first(extras.legbyes,extras.lb)],
    ['w',first(extras.wides,extras.w)],['nb',first(extras.noballs,extras.nb)],
    ['p',first(extras.penalty,extras.p)]
  ].filter(x=>x[1]!==undefined&&x[1]!==null&&x[1]!=='');
  const detail=bits.map(x=>x[0]+' '+x[1]).join(', ');
  return '<div class="extras-line"><span>Extras'+(detail?' ('+esc(detail)+')':'')+'</span><strong>'+esc(total!==undefined?total:bits.reduce((n,x)=>n+(Number(x[1])||0),0))+'</strong></div>';
}
function renderFow(i){
  const list=asArray(first(i.fows,i.fall_of_wickets,i.fall_of_wicket,[]));
  if(list.length){
    return '<div class="section-label">Fall of Wickets</div><div class="fow">'+list.map(w=>{
      const score=first(w.score_at_dismissal,w.score,w.runs,w.total,'—');
      const wicket=first(w.number,w.wicket,w.wkt,'—');
      const over=first(w.overs_at_dismissal,w.overs,w.over,'—');
      const name=first(w.name,w.batsman,w.player_name,'');
      return '<div class="fow-item"><strong>'+esc(wicket)+'/'+esc(score)+'</strong> <span>('+esc(over)+' ov)</span>'+(name?' — '+esc(name):'')+'</div>';
    }).join('')+'</div>';
  }
  const lw=i.last_wicket;
  if(lw&&typeof lw==='object'&&!Array.isArray(lw)&&Object.keys(lw).length)return '<div class="section-label">Fall of Wickets</div><div class="fow"><div class="fow-item"><strong>'+esc(first(lw.number,'—'))+'/'+esc(first(lw.score_at_dismissal,lw.runs,'—'))+'</strong> <span>('+esc(first(lw.overs_at_dismissal,lw.overs,'—'))+' ov)</span> — '+esc(first(lw.name,lw.batsman,'Batter'))+'</div></div>';
  const totals=scoreTotals(i);
  if(Number(totals.wickets)===0)return '<div class="section-label">Fall of Wickets</div><div class="fow">No wickets fallen</div>';
  return '';
}
function renderInnings(i,index){
  const total=scoreTotals(i);
  const batters=getBatters(i),bowlers=getBowlers(i);
  const ex=first(i.extra_runs,i.extras,i.extra);
  const didNotBat=asArray(first(i.did_not_bat,i.did_not_bat_list,[]));
  const totalText=(total.runs!==undefined?total.runs:'—')+'/'+(total.wickets!==undefined?total.wickets:'—');
  const oversText=(total.overs!==undefined&&total.overs!=='')?total.overs:'';
  const rrText=total.rr!==undefined?total.rr:'—';
  let out='<section class="innings-card" id="innings-'+index+'"><div class="innings-head"><div><div class="innings-name">'+esc(inningsLabel(i,index))+'</div><div class="innings-sub">Run Rate: '+esc(rrText)+'</div></div><div class="innings-total">'+esc(totalText)+(oversText!==''?'<div class="innings-sub">'+esc(oversText)+' overs</div>':'')+'</div></div>';
  if(batters.length){
    out+='<div class="table-wrap"><table class="score-table"><thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>'+batters.map(batterRow).join('')+
      '<tr class="total-row"><td>Innings Total</td><td colspan="5">'+esc(totalText)+'</td></tr></tbody></table></div>';
  }else out+='<div class="empty">Batting scorecard is not available in this API response.</div>';
  if(ex!==undefined)out+=extrasText(ex);
  if(bowlers.length){
    out+='<div class="section-label">Bowling</div><div class="table-wrap"><table class="score-table"><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th> Econ</th></tr></thead><tbody>'+bowlers.map(bowlerRow).join('')+'</tbody></table></div>';
  }else out+='<div class="section-label">Bowling</div><div class="empty">Bowling figures are not available in this API response.</div>';
  if(didNotBat.length)out+='<div class="section-label">Did Not Bat</div><div class="fow">'+didNotBat.map(p=>esc(typeof p==='string'?p:first(p.name,p.title,p.player_name,'Player'))).join(', ')+'</div>';
  out+=renderFow(i)+'</section>';
  return out;
}
function renderCurrentPlayers(m){
  const bat=asArray(first(m.batsmen,m.batters,[]));
  const bowl=asArray(first(m.bowlers,[]));
  if(!bat.length&&!bowl.length){$('currentPlayersPanel').hidden=true;return;}
  $('currentPlayersPanel').hidden=false;
  $('currentBatters').innerHTML=bat.length?'<div class="table-wrap"><table class="score-table"><thead><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead><tbody>'+bat.map(batterRow).join('')+'</tbody></table></div>':'<div class="empty">No batting details available.</div>';
  $('currentBowlers').innerHTML=bowl.length?'<div class="table-wrap"><table class="score-table"><thead><tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr></thead><tbody>'+bowl.map(bowlerRow).join('')+'</tbody></table></div>':'<div class="empty">No bowling details available.</div>';
}
function findCurrentInnings(innings,m){
  if(!innings.length)return 0;
  const teams=getTeams(m);
  const liveTeam=teams.find(t=>/\*/.test(String(first(t.scores_full,t.score_full,''))));
  const liveId=liveTeam&&first(liveTeam.team_id,liveTeam.id);
  if(liveId!==undefined&&liveId!==null){
    const found=innings.findIndex(i=>String(first(i.batting_team_id,i.team_id,i.team&&i.team.id,''))===String(liveId));
    if(found>=0)return found;
  }
  const ongoing=innings.findIndex(i=>Number(i.status)===3 && Number(scoreTotals(i).wickets)<10);
  if(ongoing>=0)return ongoing;
  return Math.max(0,innings.length-1);
}
function render(data){
  const m=data.response||data.data||data;
  const state=String(first(m.status_str,m.match_status,m.status,'Match Update'));
  const game=String(first(m.game_state_str,''));
  const note=first(m.status_note,m.note,m.match_note,'');
  const breakNow=/innings?\s*break/i.test(game+' '+String(note));
  const live=/live|ongoing|in progress/i.test(state)&&!breakNow;
  $('statusLabel').textContent=breakNow?'INNINGS BREAK':(live?'LIVE MATCH':state.toUpperCase());
  $('statusDot').style.background=live?'var(--green)':(breakNow?'var(--yellow)':'#8996b2');
  $('matchTitle').textContent=first(m.title,m.match_title,m.short_title,m.subtitle,'Full Match Scorecard');
  $('matchNote').textContent=note||'Full innings scorecard and player figures';
  renderTeams(m);

  const innings=inningsFrom(m);
  activeInnings=findCurrentInnings(innings,m);
  const tabs=$('inningsTabs');
  if(innings.length>1){
    tabs.style.display='flex';
    tabs.innerHTML=innings.map((inn,index)=>'<button type="button" class="tab '+(index===activeInnings?'active':'')+'" data-innings="'+index+'">'+esc(inningsLabel(inn,index))+'</button>').join('');
    tabs.querySelectorAll('[data-innings]').forEach(btn=>btn.onclick=()=>{
      activeInnings=Number(btn.getAttribute('data-innings'));
      tabs.querySelectorAll('[data-innings]').forEach(tab=>tab.classList.toggle('active',Number(tab.getAttribute('data-innings'))===activeInnings));
      renderScorecards(innings);
    });
  }else{tabs.style.display='none';tabs.innerHTML='';}
  renderScorecards(innings);
  renderCurrentPlayers(m);
  const time=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
  $('updatedTop').textContent='Updated '+time;
  $('updated').textContent='Last updated: '+time+' · Auto refresh every 60 seconds';
}
function renderScorecards(innings){
  if(!innings.length){
    $('scorecards').innerHTML='<section class="panel"><div class="empty">Full scorecard is not available yet. Live match details may be shown here instead.</div></section>';
    return;
  }
  if(innings.length>1){
    $('scorecards').innerHTML=innings.map((inn,index)=>'<div style="'+(index===activeInnings?'':'display:none')+'">'+renderInnings(inn,index)+'</div>').join('');
  }else{
    $('scorecards').innerHTML=innings.map(renderInnings).join('');
  }
}
async function loadData(){
  if(busy||document.hidden)return;
  busy=true;
  const ctrl=new AbortController();
  const timeout=setTimeout(()=>ctrl.abort(),10000);
  try{
    const res=await fetch(API,{cache:'no-store',signal:ctrl.signal});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const m=data&&(data.response||data.data||data);
    if(!m||typeof m!=='object')throw new Error('Invalid API response');
    lastData=data;render(data);hasData=true;
  }catch(err){
    if(!hasData){
      $('scorecards').innerHTML='<section class="panel"><div class="empty error">Unable to load scorecard. Please check your internet connection and try again.</div></section>';
      $('matchTitle').textContent='Scorecard unavailable';
      $('matchNote').textContent='Unable to connect right now. Please try again later.';
    }else{
      $('updatedTop').textContent='Connection issue';
      $('updated').textContent='Connection issue — showing last available scorecard';
    }
  }finally{clearTimeout(timeout);busy=false;}
}
loadData();
setInterval(loadData,REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadData();});
})();
</script>
</body>
</html>
