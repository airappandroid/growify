<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Scorecard</title>
    <style>
        :root {
            --bg-base: #030712;
            --card-bg: #0b1329;
            --accent: #38bdf8;
            --border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.25);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #34d399;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background-color: var(--bg-base);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 8px 4px;
            color: var(--text-primary);
        }

        .scorecard-app {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px 6px 4px;
            border-bottom: 1px solid var(--border);
        }

        .match-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 2px 7px;
            border-radius: 12px;
            font-size: 9.5px;
            font-weight: 700;
            color: #60a5fa;
            text-transform: uppercase;
        }

        .match-badge.live {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .match-badge.completed {
            background: rgba(52, 211, 153, 0.12);
            border-color: rgba(52, 211, 153, 0.3);
            color: var(--success);
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--danger);
            border-radius: 50%;
            display: none;
            
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .refresh-status {
            font-size: 9px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 2px 7px;
            border-radius: 10px;
        }

        .match-meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .match-title-text {
            font-weight: 700;
            color: var(--accent);
        }

        .tabs-wrapper {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 1px 2px;
        }

        .tabs-wrapper::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: #111c38;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 10.5px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tab-btn.active {
            background: #0284c7;
            color: #ffffff;
            border-color: var(--accent);
        }

        .current-indicator {
            width: 5px;
            height: 5px;
            background: var(--success);
            border-radius: 50%;
        }

        .hero-banner {
            background: #0f1c3f;
            border: 1px solid var(--border-highlight);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hero-team-name {
            font-size: 13.5px;
            font-weight: 700;
            color: #ffffff;
        }

        .hero-status-tag {
            font-size: 9.5px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
        }

        .hero-score-box {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .hero-score-main {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.1;
        }

        .hero-score-sub {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 500;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .section-header {
            font-size: 9.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
        }

        .table-container {
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #080e21;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-muted);
            font-weight: 700;
            font-size: 9px;
            text-transform: uppercase;
            padding: 6px 4px;
            text-align: right;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th:first-child {
            text-align: left;
            padding-left: 8px;
            width: 44%;
        }

        th:last-child {
            padding-right: 8px;
        }

        td {
            padding: 6px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        td:first-child {
            text-align: left;
            padding-left: 8px;
            white-space: normal;
        }

        td:last-child {
            padding-right: 8px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
            max-width: 150px;
        }

        .player-name {
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .player-dismissal {
            font-size: 9px;
            color: var(--text-secondary);
            line-height: 1.1;
            word-break: break-word;
        }

        .not-out {
            color: var(--success);
            font-weight: 600;
        }

        .highlight-val {
            font-weight: 700;
            color: #ffffff;
        }

        .wickets-val {
            font-weight: 700;
            color: var(--accent);
        }

        .meta-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px;
            font-size: 10px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
        }

        .meta-summary-row.total-row {
            background: rgba(14, 165, 233, 0.05);
            border-top: 1px solid var(--border-highlight);
            color: #ffffff;
            font-weight: 700;
        }

        .fow-box, .yet-to-bat-box {
            background: #080e21;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 7px 9px;
            font-size: 10px;
            color: #cbd5e1;
            line-height: 1.4;
        }

        .yet-to-bat-box {
            color: var(--text-secondary);
        }

        .fow-item {
            display: inline-block;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 5px;
            border-radius: 4px;
            margin: 2px;
        }

        .loading-ph {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-muted);
            font-size: 11px;
        }
    </style>
</head>
<body>

<div class="scorecard-app">
    <div class="top-bar">
        <div class="match-badge" id="matchBadge">
            <span class="live-dot" id="liveDot"></span>
            <span id="badgeText">UPCOMING</span>
        </div>
        <div class="refresh-status" id="refreshTimer">
            <span id="updateTime">Syncing...</span>
        </div>
    </div>

    <div class="match-meta-bar">
        <span class="match-title-text" id="matchHeader">IND vs NZ 1st T20I</span>
        <span id="venueHeader"></span>
    </div>

    <div class="tabs-wrapper" id="inningsTabs"></div>

    <div id="contentView">
        <div class="loading-ph">Loading live data...</div>
    </div>
</div>

<script>
    const API_URL = "https://bdcr2.aminurmarch.workers.dev/?id=99754";
    
    let matchData = null;
    let selectedInningIndex = 0;
    let isInitialLoad = true;
    let isMatchFinishedGlobal = false;

    function normalizeApiResponse(data) {
        const src = data?.response;
        if (!src) return null;

        const teamA = src.teama || {};
        const teamB = src.teamb || {};
        const teams = {
            a: { name: teamA.name || "Team A", shortName: teamA.short_name || teamA.name || "A", id: teamA.team_id, logo: teamA.logo_url },
            b: { name: teamB.name || "Team B", shortName: teamB.short_name || teamB.name || "B", id: teamB.team_id, logo: teamB.logo_url }
        };

        const innings = (Array.isArray(src.innings) ? src.innings : []).map((inn) => {
            const batsmen = Array.isArray(inn.batsmen) ? inn.batsmen : [];
            const bowlers = Array.isArray(inn.bowlers) ? inn.bowlers : [];
            const eq = inn.equations || {};
            const extras = inn.extra_runs || {};
            return {
                name: inn.name || inn.short_name || "Innings",
                batting_team_id: inn.batting_team_id,
                runs: Number(eq.runs ?? inn.scores?.split("/")?.[0] ?? 0),
                wickets: Number(eq.wickets ?? inn.scores?.split("/")?.[1] ?? 0),
                overs: eq.overs || inn.overs || "0.0",
                run_rate: eq.runrate || "",
                run_str: inn.scores_full || `${inn.scores || "0/0"} (${eq.overs || inn.overs || "0.0"} ov)`,
                extras: Number(extras.total ?? 0),
                bye: Number(extras.byes ?? 0),
                legbye: Number(extras.legbyes ?? 0),
                wide: Number(extras.wides ?? 0),
                noball: Number(extras.noballs ?? 0),
                player_batting_order: batsmen.map(b => ({
                    name: b.name || "Batter",
                    mobileName: b.name || "Batter",
                    batting: {
                        runs: Number(b.runs ?? 0),
                        balls: Number(b.balls_faced ?? 0),
                        fours: Number(b.fours ?? 0),
                        sixes: Number(b.sixes ?? 0),
                        strike_rate: b.strike_rate || "0.00",
                        dismissed: String(b.how_out || "").toLowerCase() !== "not out",
                        out_str: String(b.how_out || "").toLowerCase() === "not out" ? "" : (b.how_out || "")
                    }
                })),
                player_bowling_order: bowlers.map(bw => ({
                    name: bw.name || "Bowler",
                    mobileName: bw.name || "Bowler",
                    bowling: {
                        overs: bw.overs ?? "0.0",
                        maidens: Number(bw.maidens ?? 0),
                        runs: Number(bw.runs_conceded ?? 0),
                        wickets: Number(bw.wickets ?? 0),
                        economy: bw.econ || "0.00"
                    }
                })),
                fall_of_wickets: (inn.fows || []).map(f => ({
                    score: f.score_at_dismissal,
                    number: f.number,
                    name: f.name,
                    overs: f.overs_at_dismissal
                })),
                yet_to_bat: batsmen.filter(b => String(b.how_out || "").toLowerCase() === "not out" && Number(b.balls_faced || 0) === 0)
            };
        });

        return {
            teams,
            seriesName: src.competition?.title || "",
            format: src.format_str || "Cricket",
            venue: src.venue?.name ? `${src.venue.name}, ${src.venue.location || ""}` : "",
            announcement1: `${src.title || `${teams.a.name} vs ${teams.b.name}`} • ${src.status_note || src.status_str || ""}`.trim(),
            status: src.status_str || "",
            status_note: src.status_note || "",
            result: src.result || "",
            winner: src.winning_team_id ? String(src.winning_team_id) : "",
            is_completed: String(src.status_str || "").toLowerCase() === "completed",
            is_live: String(src.status_str || "").toLowerCase() === "live",
            innings_batting_order: innings
        };
    }

    function updateLastRefresh() {
        const d = new Date();
        const time = d.toLocaleTimeString('en-IN', { 
            timeZone: 'Asia/Kolkata',
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit',
            hour12: true 
        });
        const updateEl = document.getElementById("updateTime");
        if (updateEl) updateEl.textContent = `Sync: ${time} IST`;
    }

    function resolveInningTeam(inn, teamA, teamB, idx) {
        const battingId = String(inn.batting_team_id ?? "");
        if (battingId && battingId === String(teamA.id ?? "")) {
            return { shortName: teamA.shortName || teamA.name || "A", fullName: teamA.name || "Team A" };
        }
        if (battingId && battingId === String(teamB.id ?? "")) {
            return { shortName: teamB.shortName || teamB.name || "B", fullName: teamB.name || "Team B" };
        }
        const label = inn.name || inn.short_name || `Innings ${idx + 1}`;
        return { shortName: label.replace(/\s+Inning.*/i, "").slice(0, 12), fullName: label };
    }

    function getInningsTabLabel(inn, idx, teamA, teamB) {
        return resolveInningTeam(inn, teamA, teamB, idx).shortName;
    }

    function getInningsDisplayName(inn, idx, teamA, teamB) {
        return `${resolveInningTeam(inn, teamA, teamB, idx).fullName} Innings`;
    }

    async function loadScorecard() {
        try {
            const response = await fetch(`${API_URL}&_t=${Date.now()}`, { cache: "no-store" });
            if (!response.ok) return;
            const resData = await response.json();

            const result = normalizeApiResponse(resData);
            if (!result) throw new Error("API response format was not recognized");
            matchData = result;

            const teamA = result.teams?.a || {};
            const teamB = result.teams?.b || {};
            const nameA = teamA.shortName || teamA.name || 'IND';
            const nameB = teamB.shortName || teamB.name || 'NZ';
            const format = (result.format || 'T20').toUpperCase();
            const tournament = result.seriesName || `${nameA} vs ${nameB}`;

            const matchHdr = document.getElementById("matchHeader");
            const venueHdr = document.getElementById("venueHeader");
            if (matchHdr) matchHdr.textContent = result.announcement1 || `${tournament} (${format})`;
            if (venueHdr) venueHdr.textContent = result.venue ? `📍 ${result.venue}` : '';

            let rawInnings = result.innings_batting_order || result.scoreCard || [];
            let innings = [];

            if (Array.isArray(rawInnings)) {
                innings = rawInnings;
            } else if (typeof rawInnings === 'object' && rawInnings !== null) {
                innings = Object.keys(rawInnings).map(k => ({ ...rawInnings[k], key: rawInnings[k].key || k }));
            }

            const hasStartedPlaying = Array.isArray(innings) && innings.some(inn =>
                (inn.player_batting_order && inn.player_batting_order.length > 0) ||
                (Number(inn.runs) > 0) ||
                (parseFloat(inn.overs || 0) > 0)
            );

            const rawStatus = (result.status || result.matchStatus || result.state || "").toLowerCase().replace(/\s+/g, "");
            const statusFields = [
                result.match_status, result.matchStatus, result.state,
                result.status_note, result.status_text, result.result,
                result.winning_team, result.winner
            ].filter(Boolean).map(s => String(s).toLowerCase()).join(" ");

            const completionKeywords = ["complete", "completed", "finish", "finished", "ended", "won", "win", "tied", "tie", "abandoned"];
            const isCompleted = completionKeywords.some(kw => rawStatus.includes(kw) || statusFields.includes(kw)) ||
                Boolean(result.winner || result.winning_team || result.is_completed);

            isMatchFinishedGlobal = isCompleted;

            const isLive = !isCompleted && (hasStartedPlaying || rawStatus.includes("live") || rawStatus.includes("progress") || result.is_live);
            const isUpcoming = !isCompleted && !isLive;

            const badgeEl = document.getElementById("matchBadge");
            const badgeText = document.getElementById("badgeText");
            const dotEl = document.getElementById("liveDot");

            if (isCompleted) {
                if (badgeText) badgeText.textContent = "COMPLETED";
                if (badgeEl) badgeEl.className = "match-badge completed";
                if (dotEl) dotEl.style.display = "none";
            } else if (isLive) {
                if (badgeText) badgeText.textContent = "LIVE";
                if (badgeEl) badgeEl.className = "match-badge live";
                if (dotEl) dotEl.style.display = "inline-block";
            } else {
                if (badgeText) badgeText.textContent = "UPCOMING";
                if (badgeEl) badgeEl.className = "match-badge";
                if (dotEl) dotEl.style.display = "none";
            }

            if (isUpcoming || !Array.isArray(innings) || innings.length === 0) {
                const tabsEl = document.getElementById("inningsTabs");
                const viewEl = document.getElementById("contentView");
                if (tabsEl) tabsEl.innerHTML = "";
                if (viewEl) {
                    viewEl.innerHTML = `
                        <div class="hero-banner">
                            <div>
                                <div class="hero-team-name">${tournament}</div>
                                <span class="hero-status-tag">${format}</span>
                            </div>
                            <div class="hero-score-box">
                                <div class="hero-score-main">Upcoming</div>
                                <div class="hero-score-sub">${result.announcement1 || "IND vs NZ 1st T20I"}</div>
                            </div>
                        </div>
                        <div class="loading-ph">⏳ Match has not started yet. Full live scorecard will appear once play begins.</div>
                    `;
                }
                updateLastRefresh();
                return;
            }

            // সক্ৰিয়ভাৱে চলি থকা শেষৰ ইনিংছটো বাচি লোৱা (যেনে: 2nd Inning - IND)
            if (isInitialLoad || selectedInningIndex >= innings.length) {
                selectedInningIndex = innings.length - 1;
                isInitialLoad = false;
            }

            renderTabs(innings, teamA, teamB);
            renderScorecard(innings[selectedInningIndex], selectedInningIndex, teamA, teamB);
            updateLastRefresh();

        } catch (err) {
            console.error("Scorecard Load Error:", err);
        }
    }

    function renderTabs(innings, teamA, teamB) {
        const tabContainer = document.getElementById("inningsTabs");
        if (!tabContainer) return;
        tabContainer.innerHTML = "";

        innings.forEach((inn, idx) => {
            const isLatest = (idx === innings.length - 1);
            const btn = document.createElement("button");
            btn.className = `tab-btn ${idx === selectedInningIndex ? 'active' : ''}`;
            const tabTitle = getInningsTabLabel(inn, idx, teamA, teamB);
            
            btn.innerHTML = `${(isLatest && !isMatchFinishedGlobal) ? '<span class="current-indicator"></span>' : ''}<span>${tabTitle}</span>`;
            btn.onclick = () => {
                selectedInningIndex = idx;
                renderTabs(innings, teamA, teamB);
                renderScorecard(innings[idx], idx, teamA, teamB);
            };
            tabContainer.appendChild(btn);
        });
    }

    function renderScorecard(inn, idx, teamA, teamB) {
        if (!inn) return;

        const container = document.getElementById("contentView");
        if (!container) return;

        const rawBatsmen = (inn.player_batting_order && inn.player_batting_order.length > 0) ? inn.player_batting_order : (inn.battingOrder || []);
        const activeBatters = [];
        const unbattedFromOrder = [];

        rawBatsmen.forEach(b => {
            const bData = b.batting || b;
            const isOut = Boolean(bData.dismissed === true || bData.dismissed === 1 || (bData.out_str && bData.out_str.trim().toLowerCase() !== "not out"));
            const balls = Number(bData.balls || 0);
            const runs = Number(bData.runs || 0);

            if (isOut || balls > 0 || runs > 0 || bData.dismissed === false) {
                activeBatters.push(b);
            } else {
                unbattedFromOrder.push(b);
            }
        });

        const battingHTML = activeBatters.length > 0 ? activeBatters.map(b => {
            const bData = b.batting || b;
            const isOut = Boolean(bData.dismissed === true || bData.dismissed === 1 || (bData.out_str && bData.out_str.trim().toLowerCase() !== "not out"));
            const dismissal = isOut ? (bData.out_str || 'out') : '<span class="not-out">not out</span>';
            const pName = b.mobileName || b.name || b.fullname || 'Batter';

            return `
                <tr>
                    <td>
                        <div class="player-info">
                            <span class="player-name">${pName}</span>
                            <span class="player-dismissal">${dismissal}</span>
                        </div>
                    </td>
                    <td class="highlight-val">${bData.runs ?? 0}</td>
                    <td>${bData.balls ?? 0}</td>
                    <td>${bData.fours ?? 0}</td>
                    <td>${bData.sixes ?? 0}</td>
                    <td>${bData.strike_rate || '0.00'}</td>
                </tr>
            `;
        }).join("") : '<tr><td colspan="6" style="text-align:center; padding:8px; color:var(--text-muted);">Yet to bat</td></tr>';

        const rawBowlers = (inn.player_bowling_order && inn.player_bowling_order.length > 0) ? inn.player_bowling_order : (inn.bowlingOrder || []);
        const bowlingHTML = rawBowlers.length > 0 ? rawBowlers.map(bw => {
            const bwData = bw.bowling || bw;
            const bwName = bw.mobileName || bw.name || bw.fullname || 'Bowler';

            return `
                <tr>
                    <td><span class="player-name">${bwName}</span></td>
                    <td class="highlight-val">${bwData.overs ?? '0.0'}</td>
                    <td>${bwData.maiden_overs ?? bwData.maidens ?? 0}</td>
                    <td>${bwData.runs ?? 0}</td>
                    <td class="wickets-val">${bwData.wickets ?? 0}</td>
                    <td>${bwData.economy || '0.00'}</td>
                </tr>
            `;
        }).join("") : '<tr><td colspan="6" style="text-align:center; padding:8px; color:var(--text-muted);">No bowling data</td></tr>';

        const fows = inn.fall_of_wickets || [];
        let fowList = '<span style="color:var(--text-muted)">No wickets fallen</span>';
        if (Array.isArray(fows) && fows.length > 0) {
            fowList = fows.map(f => {
                if (typeof f === 'string') return `<span class="fow-item">${f}</span>`;
                const wkt = `${f.score ?? f.runs ?? 0}-${f.number ?? f.wicket ?? ''}`;
                return `<span class="fow-item"><b>${wkt}</b> (${f.name || ''}, ${f.overs ?? 0} ov)</span>`;
            }).join(" ");
        }

        const fullYetToBat = inn.yet_to_bat || [];
        const ytbHTML = fullYetToBat.length > 0 ? `
            <div class="section-header">Yet to Bat</div>
            <div class="yet-to-bat-box">
                ${fullYetToBat.map(p => p.name || p.mobileName || p.fullname).join(", ")}
            </div>
        ` : '';

        const extrasDetail = `b ${inn.bye ?? 0}, lb ${inn.legbye ?? 0}, w ${inn.wide ?? 0}, nb ${inn.noball ?? 0}`;
        const totalExtras = inn.extras ?? 0;
        const totalScore = inn.run_str || `${inn.runs ?? 0}/${inn.wickets ?? 0} in ${inn.overs ?? '0.0'}`;
        const runRate = inn.run_rate ? `${inn.run_rate} CRR` : "";

        let statusSubText = (matchData?.status_note || matchData?.status_text || matchData?.result || matchData?.status || "").toUpperCase();
        if (isMatchFinishedGlobal && (statusSubText === "LIVE" || statusSubText === "STARTED" || !statusSubText)) {
            statusSubText = "MATCH COMPLETED";
        }

        const teamDisplayName = getInningsDisplayName(inn, idx, teamA, teamB);

        container.innerHTML = `
            <div class="hero-banner">
                <div>
                    <div class="hero-team-name">${teamDisplayName}</div>
                    <span class="hero-status-tag">${runRate}</span>
                </div>
                <div class="hero-score-box">
                    <div class="hero-score-main">${totalScore}</div>
                    <div class="hero-score-sub" title="${statusSubText}">${statusSubText}</div>
                </div>
            </div>

            <div class="section-header">Batting</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Batter</th>
                            <th>R</th>
                            <th>B</th>
                            <th>4s</th>
                            <th>6s</th>
                            <th>SR</th>
                        </tr>
                    </thead>
                    <tbody>${battingHTML}</tbody>
                </table>
                <div class="meta-summary-row">
                    <span>Extras (${extrasDetail})</span>
                    <span class="highlight-val">${totalExtras}</span>
                </div>
                <div class="meta-summary-row total-row">
                    <span>TOTAL</span>
                    <span>${totalScore}</span>
                </div>
            </div>

            ${ytbHTML}

            <div class="section-header">Fall of Wickets</div>
            <div class="fow-box">${fowList}</div>

            <div class="section-header">Bowling</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Bowler</th>
                            <th>O</th>
                            <th>M</th>
                            <th>R</th>
                            <th>W</th>
                            <th>ECO</th>
                        </tr>
                    </thead>
                    <tbody>${bowlingHTML}</tbody>
                </table>
            </div>
        `;
    }

    loadScorecard();
    setInterval(loadScorecard, 60000);
</script>
</body>
</html>
