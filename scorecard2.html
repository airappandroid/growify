<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Scorecard</title>
    <style>
        :root {
            --bg-base: #020617;
            --card-bg: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(3, 7, 18, 0.98) 100%);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #34d399;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background-color: var(--bg-base);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px 6px;
            color: var(--text-primary);
        }

        .scorecard-app {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 14px 10px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.95), 0 0 35px rgba(14, 165, 233, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Top Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px 8px 4px;
            border-bottom: 1px solid var(--border);
        }

        .match-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.6px;
            color: #f87171;
        }

        .live-dot {
            width: 5.5px;
            height: 5.5px;
            background-color: var(--danger);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--danger);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }

        .refresh-status {
            font-size: 9.5px;
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 12px;
        }

        /* Tabs */
        .tabs-wrapper {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 1px 2px;
        }

        .tabs-wrapper::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            font-size: 10.5px;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 9px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 3px 12px var(--accent-glow);
        }

        .current-indicator {
            width: 5px;
            height: 5px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--success);
        }

        /* Hero Card */
        .hero-banner {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15) 0%, rgba(15, 23, 42, 0.5) 100%);
            border: 1px solid var(--border-highlight);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .hero-team-name {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
        }

        .hero-status-tag {
            font-size: 9.5px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
        }

        .hero-score-box {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .hero-score-main {
            font-size: 19px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.1;
        }

        .hero-score-sub {
            font-size: 10.5px;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 600;
        }

        .section-header {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-top: 4px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Responsive Table */
        .table-container {
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.4);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-weight: 800;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 7px 4px;
            text-align: right;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th:first-child {
            text-align: left;
            padding-left: 8px;
            width: 44%;
        }

        th:last-child {
            padding-right: 8px;
        }

        td {
            padding: 7px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        td:first-child {
            text-align: left;
            padding-left: 8px;
            white-space: normal;
        }

        td:last-child {
            padding-right: 8px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr.active-player-row {
            background: rgba(56, 189, 248, 0.08);
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
            max-width: 155px;
        }

        .player-name-wrapper {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 3px;
        }

        .player-name {
            font-size: 11.5px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .player-dismissal {
            font-size: 9px;
            color: var(--text-secondary);
            line-height: 1.15;
            word-break: break-word;
        }

        .not-out {
            color: var(--success);
            font-weight: 700;
        }

        .highlight-val {
            font-weight: 800;
            color: #ffffff;
        }

        .wickets-val {
            font-weight: 800;
            color: var(--accent);
        }

        /* Striker & Bowler Badges */
        .bat-badge {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 3px;
            padding: 0.5px 3.5px;
            font-size: 8px;
            font-weight: 800;
            color: #38bdf8;
            vertical-align: middle;
        }

        .ball-badge {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 3px;
            padding: 0.5px 3.5px;
            font-size: 8px;
            font-weight: 800;
            color: #f87171;
            vertical-align: middle;
        }

        .meta-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 8px;
            font-size: 10.5px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.015);
        }

        .meta-summary-row.total-row {
            background: rgba(14, 165, 233, 0.06);
            border-top: 1px solid var(--border-highlight);
            color: #ffffff;
            font-weight: 800;
        }

        .fow-box {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 10px;
            font-size: 10px;
            color: #cbd5e1;
            line-height: 1.4;
        }

        .fow-item {
            display: inline-block;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 5px;
            border-radius: 5px;
            margin: 1.5px 1px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .shimmer {
            height: 160px;
            border-radius: 12px;
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

<div class="scorecard-app">
    <div class="top-bar">
        <div class="match-badge">
            <span class="live-dot"></span>
            <span>LIVE SCORECARD</span>
        </div>
        <div class="refresh-status" id="refreshTimer">
            <span id="updateTime">Syncing...</span>
        </div>
    </div>

    <div class="tabs-wrapper" id="inningsTabs"></div>

    <div id="contentView">
        <div class="shimmer"></div>
    </div>
</div>

<script>
    const API_URL = "https://match1.aminurmarch.workers.dev/scoreCard?matchId=69bd420b1dbf177ca4e58e72";
    
    let inningsData = [];
    let selectedInningIndex = -1;
    let isInitialLoad = true;

    async function loadScorecard() {
        try {
            // cache: "no-store" আৰু Timestamp ব্যৱহাৰ কৰা হৈছে যাতে সদায় সতেজ ডাটা পোৱা যায়
            const response = await fetch(`${API_URL}&_t=${Date.now()}`, { cache: "no-store" });
            if (!response.ok) return;
            const resData = await response.json();

            if (resData?.statusCode === 1 && resData?.responseData?.result?.innings_batting_order) {
                inningsData = resData.responseData.result.innings_batting_order;
                
                if (inningsData.length > 0) {
                    if (isInitialLoad || selectedInningIndex === -1) {
                        selectedInningIndex = inningsData.length - 1;
                        isInitialLoad = false;
                    }

                    renderTabs();
                    renderScorecard(selectedInningIndex);
                    updateLastRefresh();
                }
            }
        } catch (err) {
            console.error("Scorecard Load Error:", err);
        }
    }

    function updateLastRefresh() {
        const d = new Date();
        const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        document.getElementById("updateTime").textContent = `Sync: ${time}`;
    }

    function renderTabs() {
        const tabContainer = document.getElementById("inningsTabs");
        tabContainer.innerHTML = "";

        inningsData.forEach((inn, idx) => {
            const isLatest = (idx === inningsData.length - 1);
            const btn = document.createElement("button");
            btn.className = `tab-btn ${idx === selectedInningIndex ? 'active' : ''}`;
            
            const isSecond = inn.key && inn.key.endsWith("_2");
            const suffix = isSecond ? "2nd Inn" : "1st Inn";
            const team = inn.teamName || "Team";
            
            btn.innerHTML = `
                ${isLatest ? '<span class="current-indicator"></span>' : ''}
                <span>${team} ${suffix}</span>
            `;

            btn.onclick = () => {
                selectedInningIndex = idx;
                renderTabs();
                renderScorecard(idx);
            };
            tabContainer.appendChild(btn);
        });
    }

    function renderScorecard(idx) {
        const inn = inningsData[idx];
        if (!inn) return;

        const isCurrentInning = (idx === inningsData.length - 1);
        const container = document.getElementById("contentView");

        const isDeclared = inn.declare ? " (d)" : "";
        const isFollon = inn.follon ? "Follow-On" : "";
        const statusBadge = isFollon || (inn.declare ? "Declared" : "Innings Detail");

        // ১. সক্ৰিয় বেটাৰ চিনাক্তকৰণ
        const notOutList = (inn.player_batting_order || []).filter(p => !p.batting?.dismissed);
        let activeStrikerId = null;

        if (isCurrentInning && !inn.declare && inn.wickets < 10 && notOutList.length > 0) {
            const explicitStriker = notOutList.find(p => p.batting?.isStriker);
            // API-ৰ পৰা explicit নহ'লে শেষত নট-আউট হোৱাজন বা প্ৰথমজনক ডিফল্ট কৰা হয়
            activeStrikerId = explicitStriker 
                ? (explicitStriker.playerId || explicitStriker.key) 
                : (notOutList[notOutList.length - 1]?.playerId || notOutList[0]?.playerId);
        }

        // Batting HTML
        const battingHTML = (inn.player_batting_order || []).map(p => {
            const b = p.batting || {};
            const isNotOut = !b.dismissed;
            const pId = p.playerId || p.key;
            const isStriker = isCurrentInning && (pId === activeStrikerId);

            let batSymbol = isStriker ? `<span class="bat-badge">🏏 BAT</span>` : '';
            let rowClass = (isCurrentInning && isNotOut) ? 'class="active-player-row"' : '';
            let dismissal = isNotOut ? '<span class="not-out">not out</span>' : (b.out_str || "out");

            return `
                <tr ${rowClass}>
                    <td>
                        <div class="player-info">
                            <div class="player-name-wrapper">
                                <span class="player-name">${p.fullname || p.name}</span>
                                ${batSymbol}
                            </div>
                            <span class="player-dismissal">${dismissal}</span>
                        </div>
                    </td>
                    <td class="highlight-val">${b.runs ?? 0}</td>
                    <td>${b.balls ?? 0}</td>
                    <td>${b.fours ?? 0}</td>
                    <td>${b.sixes ?? 0}</td>
                    <td>${b.strike_rate ?? '0.0'}</td>
                </tr>
            `;
        }).join("");

        // ২. বৰ্তমান বলিং কৰি থকা বলাৰ চিনাক্তকৰণ (Incomplete Over / Fractional Check)
        const bowlers = inn.player_bowling_order || [];
        let activeBowlerId = null;

        if (isCurrentInning && !inn.declare && inn.wickets < 10 && bowlers.length > 0) {
            const explicitBowler = bowlers.find(p => p.bowling?.isCurrentBowler);
            
            if (explicitBowler) {
                activeBowlerId = explicitBowler.playerId || explicitBowler.key;
            } else {
                // যিজন বলাৰৰ অভাৰ চলি আছে (যেনে: 18.2, 5.1 ইত্যাদি য'ত .0 নহয়)
                const currentActiveBowler = bowlers.find(p => {
                    const ov = String(p.bowling?.overs || "");
                    return ov.includes(".") && !ov.endsWith(".0");
                });

                activeBowlerId = currentActiveBowler 
                    ? (currentActiveBowler.playerId || currentActiveBowler.key) 
                    : (bowlers[bowlers.length - 1]?.playerId || bowlers[bowlers.length - 1]?.key);
            }
        }

        // Bowling HTML
        const bowlingHTML = bowlers.map(p => {
            const b = p.bowling || {};
            const pId = p.playerId || p.key;
            const isBowler = isCurrentInning && (pId === activeBowlerId);

            let ballSymbol = isBowler ? `<span class="ball-badge">🔴 BOWL</span>` : '';
            let rowClass = isBowler ? 'class="active-player-row"' : '';

            return `
                <tr ${rowClass}>
                    <td>
                        <div class="player-name-wrapper">
                            <span class="player-name">${p.fullname || p.name}</span>
                            ${ballSymbol}
                        </div>
                    </td>
                    <td class="highlight-val">${b.overs ?? '0.0'}</td>
                    <td>${b.maiden_overs ?? 0}</td>
                    <td>${b.runs ?? 0}</td>
                    <td class="wickets-val">${b.wickets ?? 0}</td>
                    <td>${b.economy ?? '0.0'}</td>
                </tr>
            `;
        }).join("");

        // Fall of Wickets
        const fowList = (inn.fall_of_wickets && inn.fall_of_wickets.length > 0)
            ? inn.fall_of_wickets.map(item => `<span class="fow-item">${item}</span>`).join(" ")
            : '<span style="color:var(--text-muted)">No wickets fallen</span>';

        const extrasDetail = `b ${inn.bye || 0}, lb ${inn.legbye || 0}, w ${inn.wide || 0}, nb ${inn.noball || 0}`;

        container.innerHTML = `
            <div class="hero-banner">
                <div class="hero-team">
                    <span class="hero-team-name">${inn.teamName}</span>
                    <span class="hero-status-tag">${statusBadge}</span>
                </div>
                <div class="hero-score-box">
                    <div class="hero-score-main">${inn.runs}/${inn.wickets}${isDeclared}</div>
                    <div class="hero-score-sub">${inn.overs} Overs • ${inn.run_rate || '0.00'} CRR</div>
                </div>
            </div>

            <div class="section-header">Batting Performance</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Batter</th>
                            <th>R</th>
                            <th>B</th>
                            <th>4s</th>
                            <th>6s</th>
                            <th>SR</th>
                        </tr>
                    </thead>
                    <tbody>${battingHTML}</tbody>
                </table>
                <div class="meta-summary-row">
                    <span>Extras (${extrasDetail})</span>
                    <span class="highlight-val">${inn.extras || 0}</span>
                </div>
                <div class="meta-summary-row total-row">
                    <span>TOTAL (${inn.overs} Ov, RR ${inn.run_rate || '0.00'})</span>
                    <span>${inn.runs}/${inn.wickets}</span>
                </div>
            </div>

            <div class="section-header">Fall of Wickets</div>
            <div class="fow-box">
                ${fowList}
            </div>

            <div class="section-header">Bowling Figures</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Bowler</th>
                            <th>O</th>
                            <th>M</th>
                            <th>R</th>
                            <th>W</th>
                            <th>ECO</th>
                        </tr>
                    </thead>
                    <tbody>${bowlingHTML}</tbody>
                </table>
            </div>
        `;
    }

    // প্ৰথম লোড
    loadScorecard();

    // প্ৰতি ৫ ছেকেণ্ডৰ মূৰে মূৰে স্বয়ংক্ৰিয়ভাৱে লাইভ ডাটা আপডেট হ'ব
    setInterval(loadScorecard, 5000);
</script>

</body>
</html>
