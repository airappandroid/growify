<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Scorecard - IND-W vs HK-W</title>
    <style>
        :root {
            --bg-base: #020617;
            --card-bg: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(3, 7, 18, 0.98) 100%);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.35);
            --border: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(56, 189, 248, 0.3);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --success: #34d399;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            width: 100vw;
            background-color: var(--bg-base);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px 6px;
            color: var(--text-primary);
        }

        .scorecard-app {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 14px 10px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.95), 0 0 35px rgba(14, 165, 233, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Top Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px 8px 4px;
            border-bottom: 1px solid var(--border);
        }

        .match-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.35);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.6px;
            color: #60a5fa;
            transition: all 0.3s ease;
        }

        .match-badge.live {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.35);
            color: #f87171;
        }

        .match-badge.completed {
            background: rgba(52, 211, 153, 0.12);
            border-color: rgba(52, 211, 153, 0.35);
            color: var(--success);
        }

        .live-dot {
            width: 5.5px;
            height: 5.5px;
            background-color: var(--danger);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--danger);
            animation: pulse 1.5s infinite;
            display: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }

        .refresh-status {
            font-size: 9.5px;
            font-weight: 600;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 12px;
        }

        /* Match Information Bar */
        .match-meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .match-title-text {
            font-weight: 700;
            color: var(--accent);
        }

        /* Tabs */
        .tabs-wrapper {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 1px 2px;
        }

        .tabs-wrapper::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            font-size: 10.5px;
            font-weight: 700;
            padding: 6px 10px;
            border-radius: 9px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 3px 12px var(--accent-glow);
        }

        .current-indicator {
            width: 5px;
            height: 5px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--success);
        }

        /* Hero Card */
        .hero-banner {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.15) 0%, rgba(15, 23, 42, 0.5) 100%);
            border: 1px solid var(--border-highlight);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .hero-team-name {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
        }

        .hero-status-tag {
            font-size: 9.5px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
        }

        .hero-score-box {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .hero-score-main {
            font-size: 19px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1.1;
        }

        .hero-score-sub {
            font-size: 10.5px;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 600;
        }

        .section-header {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-top: 4px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
        }

        /* Responsive Table */
        .table-container {
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.4);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-muted);
            font-weight: 800;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            padding: 7px 4px;
            text-align: right;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th:first-child {
            text-align: left;
            padding-left: 8px;
            width: 44%;
        }

        th:last-child {
            padding-right: 8px;
        }

        td {
            padding: 7px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        td:first-child {
            text-align: left;
            padding-left: 8px;
            white-space: normal;
        }

        td:last-child {
            padding-right: 8px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
            max-width: 155px;
        }

        .player-name-wrapper {
            display: inline-flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 3px;
        }

        .player-name {
            font-size: 11.5px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
        }

        .player-dismissal {
            font-size: 9px;
            color: var(--text-secondary);
            line-height: 1.15;
            word-break: break-word;
        }

        .not-out {
            color: var(--success);
            font-weight: 700;
        }

        .highlight-val {
            font-weight: 800;
            color: #ffffff;
        }

        .wickets-val {
            font-weight: 800;
            color: var(--accent);
        }

        .meta-summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 8px;
            font-size: 10.5px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.015);
        }

        .meta-summary-row.total-row {
            background: rgba(14, 165, 233, 0.06);
            border-top: 1px solid var(--border-highlight);
            color: #ffffff;
            font-weight: 800;
        }

        .fow-box {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 8px 10px;
            font-size: 10px;
            color: #cbd5e1;
            line-height: 1.4;
        }

        .fow-item {
            display: inline-block;
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 5px;
            border-radius: 5px;
            margin: 1.5px 1px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Scheduled / Upcoming Card */
        .scheduled-card {
            text-align: center;
            padding: 30px 14px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px dashed var(--border);
            border-radius: 14px;
        }

        .sched-title {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .sched-time {
            font-size: 13.5px;
            color: var(--accent);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .sched-venue {
            font-size: 11.5px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .shimmer {
            height: 160px;
            border-radius: 12px;
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

<div class="scorecard-app">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="match-badge" id="matchBadge">
            <span class="live-dot" id="liveDot"></span>
            <span id="badgeText">SCHEDULED</span>
        </div>
        <div class="refresh-status" id="refreshTimer">
            <span id="updateTime">Syncing...</span>
        </div>
    </div>

    <!-- Match Information Row -->
    <div class="match-meta-bar">
        <span class="match-title-text" id="matchHeader">IND-W vs HK-W T20</span>
        <span id="venueHeader">📍 Dubai</span>
    </div>

    <!-- Innings Navigation Tabs -->
    <div class="tabs-wrapper" id="inningsTabs"></div>

    <!-- Dynamic Scorecard View -->
    <div id="contentView">
        <div class="shimmer"></div>
    </div>
</div>

<script>
    const matchId = "98315";
    const API_URL = `https://cricvoice2.aminurmarch.workers.dev/?matchId=${matchId}`;
    
    let matchData = null;
    let selectedInningIndex = -1;
    let isInitialLoad = true;

    // ভাৰতীয় সময় (IST) নিৰ্ধাৰণ ফাংচন
    function getISTTimeString(dateStr, timestamp) {
        let dateObj;
        if (dateStr) {
            dateObj = new Date(dateStr.replace(" ", "T") + "+05:30");
        } else if (timestamp) {
            dateObj = new Date(timestamp * 1000);
        }

        if (!dateObj || isNaN(dateObj.getTime())) return "8:00 PM IST";

        const timeStr = new Intl.DateTimeFormat('en-IN', {
            timeZone: 'Asia/Kolkata',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
        }).format(dateObj).toUpperCase();

        return `${timeStr} IST`;
    }

    function updateLastRefresh() {
        const d = new Date();
        const time = d.toLocaleTimeString('en-IN', { 
            timeZone: 'Asia/Kolkata',
            hour: '2-digit', 
            minute: '2-digit', 
            second: '2-digit',
            hour12: true 
        });
        document.getElementById("updateTime").textContent = `Sync: ${time} IST`;
    }

    async function loadScorecard() {
        try {
            const response = await fetch(`${API_URL}&_t=${Date.now()}`, { cache: "no-store" });
            if (!response.ok) return;
            const resData = await response.json();

            // JSON ডাটা চিনাক্তকৰণ
            if (resData?.data && Array.isArray(resData.data) && resData.data.length > 0) {
                matchData = resData.data[0].scoreCard || resData.data[0].livescore || resData.data[0];
            } else if (resData?.scoreCard) {
                matchData = resData.scoreCard;
            } else if (resData?.livescore) {
                matchData = resData.livescore;
            } else {
                matchData = resData;
            }

            if (!matchData) return;

            // মেচ টাইটেল আৰু ভেনিউ
            const mainTitle = matchData.short_title || matchData.title || 'India Women vs Hong Kong Women T20';
            const subTitle = matchData.subtitle ? `${matchData.subtitle} • ` : '';
            document.getElementById("matchHeader").textContent = `${subTitle}${mainTitle}`;

            const venueName = matchData.venue?.name || matchData.venue?.location || 'Dubai International Cricket Stadium, Dubai';
            document.getElementById("venueHeader").textContent = `📍 ${venueName.split(',')[0]}`;

            // ষ্টেটাছ পৰীক্ষা (Live / Completed / Scheduled)
            const rawStatus = (matchData.status_str || matchData.game_state_str || "").toLowerCase();
            const isCompleted = rawStatus.includes("complete") || rawStatus.includes("finish") || matchData.status === 2;
            const isLive = rawStatus.includes("live") || matchData.status === 3;

            const badgeEl = document.getElementById("matchBadge");
            const badgeText = document.getElementById("badgeText");
            const dotEl = document.getElementById("liveDot");

            if (isLive) {
                badgeText.textContent = "LIVE";
                badgeEl.className = "match-badge live";
                dotEl.style.display = "inline-block";
            } else if (isCompleted) {
                badgeText.textContent = "COMPLETED";
                badgeEl.className = "match-badge completed";
                dotEl.style.display = "none";
            } else {
                badgeText.textContent = "SCHEDULED";
                badgeEl.className = "match-badge";
                dotEl.style.display = "none";
            }

            const innings = matchData.innings || [];

            // মেচ আৰম্ভ নোহোৱালৈকে অনুসূচী কাৰ্ড (Scheduled Card)
            if (!Array.isArray(innings) || innings.length === 0) {
                document.getElementById("inningsTabs").innerHTML = "";
                const istTime = getISTTimeString(matchData.date_start_ist, matchData.timestamp_start);
                const teamA = matchData.teama?.name || "India Women";
                const teamB = matchData.teamb?.name || "Hong Kong Women";

                document.getElementById("contentView").innerHTML = `
                    <div class="scheduled-card">
                        <div class="sched-title">${teamA} vs ${teamB} T20</div>
                        <div class="sched-time">Starts at ${istTime} Today</div>
                        <div class="sched-venue">
                            Venue: ${venueName}<br>
                            Live scores, commentary, and scorecard updates will be refreshed automatically here once the match begins.
                        </div>
                    </div>
                `;
                updateLastRefresh();
                return;
            }

            // সৰ্বশেষ ইনিংছ লোড কৰক
            if (isInitialLoad || selectedInningIndex === -1 || selectedInningIndex >= innings.length) {
                selectedInningIndex = innings.length - 1;
                isInitialLoad = false;
            }

            renderTabs(innings);
            renderScorecard(innings[selectedInningIndex]);
            updateLastRefresh();

        } catch (err) {
            console.error("Scorecard Load Error:", err);
        }
    }

    function renderTabs(innings) {
        const tabContainer = document.getElementById("inningsTabs");
        tabContainer.innerHTML = "";

        innings.forEach((inn, idx) => {
            const isLatest = (idx === innings.length - 1);
            const btn = document.createElement("button");
            btn.className = `tab-btn ${idx === selectedInningIndex ? 'active' : ''}`;
            
            const innName = inn.name || inn.short_name || `Inning ${inn.number || idx + 1}`;
            
            btn.innerHTML = `
                ${isLatest ? '<span class="current-indicator"></span>' : ''}
                <span>${innName}</span>
            `;

            btn.onclick = () => {
                selectedInningIndex = idx;
                renderTabs(innings);
                renderScorecard(innings[idx]);
            };
            tabContainer.appendChild(btn);
        });
    }

    function renderScorecard(inn) {
        if (!inn) return;

        const container = document.getElementById("contentView");

        // বেটিং তালিকা
        const batsmen = inn.batsmen || [];
        const battingHTML = batsmen.map(b => {
            const isNotOut = !b.how_out || b.how_out.toLowerCase().includes('not out');
            let dismissal = isNotOut ? '<span class="not-out">not out</span>' : (b.how_out || "out");

            return `
                <tr>
                    <td>
                        <div class="player-info">
                            <div class="player-name-wrapper">
                                <span class="player-name">${b.name || 'Unknown'}</span>
                            </div>
                            <span class="player-dismissal">${dismissal}</span>
                        </div>
                    </td>
                    <td class="highlight-val">${b.runs ?? 0}</td>
                    <td>${b.balls_faced ?? 0}</td>
                    <td>${b.fours ?? 0}</td>
                    <td>${b.sixes ?? 0}</td>
                    <td>${b.strike_rate || '0.00'}</td>
                </tr>
            `;
        }).join("") || '<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">No batting data available</td></tr>';

        // বলিং তালিকা
        const bowlers = inn.bowlers || [];
        const bowlingHTML = bowlers.map(bw => {
            return `
                <tr>
                    <td>
                        <div class="player-name-wrapper">
                            <span class="player-name">${bw.name || 'Unknown'}</span>
                        </div>
                    </td>
                    <td class="highlight-val">${bw.overs ?? '0.0'}</td>
                    <td>${bw.maidens ?? 0}</td>
                    <td>${bw.runs_conceded ?? 0}</td>
                    <td class="wickets-val">${bw.wickets ?? 0}</td>
                    <td>${bw.econ || '0.00'}</td>
                </tr>
            `;
        }).join("") || '<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">No bowling data available</td></tr>';

        // Fall of wickets
        let fowList = '<span style="color:var(--text-muted)">No wickets fallen</span>';
        if (Array.isArray(inn.fows) && inn.fows.length > 0) {
            fowList = inn.fows.map(f => {
                const wkt = `${f.score_at_dismissal ?? 0}-${f.number ?? ''}`;
                return `<span class="fow-item"><b>${wkt}</b> (${f.name || ''}, ${f.overs_at_dismissal ?? 0} ov)</span>`;
            }).join(" ");
        }

        // অতিৰিক্ত ৰাণ
        const ext = inn.extra_runs || {};
        const extrasDetail = `b ${ext.byes ?? 0}, lb ${ext.legbyes ?? 0}, w ${ext.wides ?? 0}, nb ${ext.noballs ?? 0}`;
        const totalExtras = ext.total ?? 0;
        const totalScore = inn.scores_full || inn.scores || "-";
        const runRate = inn.equations?.runrate ? `${inn.equations.runrate} CRR` : "";

        container.innerHTML = `
            <div class="hero-banner">
                <div class="hero-team">
                    <span class="hero-team-name">${inn.name || 'Innings'}</span>
                    <span class="hero-status-tag">${runRate}</span>
                </div>
                <div class="hero-score-box">
                    <div class="hero-score-main">${totalScore}</div>
                    <div class="hero-score-sub">${matchData?.status_note || matchData?.status_str || ''}</div>
                </div>
            </div>

            <div class="section-header">Batting Performance</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Batter</th>
                            <th>R</th>
                            <th>B</th>
                            <th>4s</th>
                            <th>6s</th>
                            <th>SR</th>
                        </tr>
                    </thead>
                    <tbody>${battingHTML}</tbody>
                </table>
                <div class="meta-summary-row">
                    <span>Extras (${extrasDetail})</span>
                    <span class="highlight-val">${totalExtras}</span>
                </div>
                <div class="meta-summary-row total-row">
                    <span>TOTAL</span>
                    <span>${totalScore}</span>
                </div>
            </div>

            <div class="section-header">Fall of Wickets</div>
            <div class="fow-box">
                ${fowList}
            </div>

            <div class="section-header">Bowling Figures</div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Bowler</th>
                            <th>O</th>
                            <th>M</th>
                            <th>R</th>
                            <th>W</th>
                            <th>ECO</th>
                        </tr>
                    </thead>
                    <tbody>${bowlingHTML}</tbody>
                </table>
            </div>
        `;
    }

    // প্ৰতি ৫ ছেকেণ্ডত স্বয়ংক্ৰিয় আপডেট
    loadScorecard();
    setInterval(loadScorecard, 5000);
</script>

</body>
</html>
