<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CricVoice - IND vs WI Live</title>
    <style>
        :root {
            --bg: #090d16;
            --card: #111827;
            --nested: #182234;
            --border: #1e293b;
            --cyan: #38bdf8;
            --blue: #2563eb;
            --live: #ef4444;
            --green: #10b981;
            --text: #ffffff;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 8px 10px;
        }

        .app-container {
            width: 100%;
            max-width: 390px;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 12px;
            contain: paint;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            display: grid;
            place-items: center;
        }

        .brand-icon svg, .icon-btn svg {
            width: 16px;
            height: 16px;
            fill: #fff;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
        }

        .top-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: var(--nested);
            border: 1px solid var(--border);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        /* Commentary Capsule */
        .commentary-capsule {
            margin: 10px 0;
            background: var(--nested);
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            padding: 9px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .commentary-content {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mic-box {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            background: rgba(56, 189, 248, 0.15);
            display: grid;
            place-items: center;
        }

        .mic-box svg {
            width: 15px;
            height: 15px;
            fill: var(--cyan);
        }

        .commentary-texts h4 { font-size: 12.5px; font-weight: 700; }
        .commentary-texts p { font-size: 10.5px; color: var(--cyan); }

        .listen-pill {
            background: var(--cyan);
            color: #000;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Match Card */
        .match-card {
            background: var(--nested);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
        }

        .match-meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .match-label {
            font-size: 12px;
            font-weight: 700;
            max-width: 65%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-tag {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 5px;
            background: #1e293b;
            color: var(--muted);
        }

        .status-tag.live {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .status-tag.completed {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .venue-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .ball-glow {
            background: var(--cyan);
            color: #000;
            font-weight: 700;
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 10px;
        }

        .teams-arena {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .team-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .team-profile {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .team-crest {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #1e293b;
        }

        .team-name-text {
            font-size: 13.5px;
            font-weight: 600;
        }

        .team-metrics {
            text-align: right;
        }

        .runs-val {
            font-size: 15px;
            font-weight: 700;
        }

        .overs-val {
            font-size: 10.5px;
            color: var(--cyan);
        }

        .summary-status {
            margin-top: 10px;
            padding: 8px 10px;
            background: var(--card);
            border-radius: 8px;
            text-align: center;
            font-size: 11px;
            color: #cbd5e1;
        }

        .toss-tag {
            margin-top: 6px;
            font-size: 10.5px;
            text-align: center;
            color: var(--muted);
        }

        /* Action Button */
        .btn-action-main {
            margin-top: 10px;
            width: 100%;
            background: var(--blue);
            color: #ffffff;
            border: none;
            font-size: 13px;
            font-weight: 700;
            padding: 11px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            place-items: center;
            padding: 16px;
            z-index: 99;
        }

        .modal-overlay.active { display: grid; }

        .modal-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            width: 100%;
            max-width: 320px;
            padding: 16px;
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .modal-head h3 { font-size: 14px; }
        .modal-close-icon { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
        .modal-content-text { font-size: 11.5px; color: var(--muted); line-height: 1.4; margin-bottom: 12px; }
        .modal-confirm-btn { width: 100%; background: var(--blue); color: #fff; border: none; padding: 9px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <main class="app-container">
        <!-- Top App Bar -->
        <header class="top-bar">
            <div class="brand-badge">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </div>
                <h1 class="brand-name">CricVoice</h1>
            </div>

            <div class="top-actions">
                <button class="icon-btn" onclick="toggleModal(true)" aria-label="Privacy">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                </button>
                <button class="icon-btn" onclick="location.href='http://action_share'" aria-label="Share">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92z"/></svg>
                </button>
            </div>
        </header>

        <!-- Live Commentary Capsule -->
        <div class="commentary-capsule" onclick="location.href='go:commentary'">
            <div class="commentary-content">
                <div class="mic-box">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </div>
                <div class="commentary-texts">
                    <h4>Audio Commentary</h4>
                    <p>Live ball-by-ball radio</p>
                </div>
            </div>
            <div class="listen-pill">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="#000"><path d="M8 5v14l11-7z"/></svg>
                Listen
            </div>
        </div>

        <!-- Main Cricket Score Card -->
        <section class="match-card">
            <div class="match-meta-bar">
                <span class="match-label" id="match-info">IND vs WI • ODI</span>
                <span class="status-tag" id="match-status">UPCOMING</span>
            </div>

            <div class="venue-row">
                <span id="match-format">ODI Match</span>
                <div id="last-ball-container" style="display: none;">
                    Last Ball: <span class="ball-glow" id="latest-ball">-</span>
                </div>
            </div>

            <!-- Teams -->
            <div class="teams-arena">
                <div class="team-box">
                    <div class="team-profile">
                        <img class="team-crest" id="team-a-logo" src="" alt="India" width="28" height="28" decoding="async">
                        <span class="team-name-text" id="team-a-name">India</span>
                    </div>
                    <div class="team-metrics">
                        <div class="runs-val" id="team-a-runs">--</div>
                        <div class="overs-val" id="team-a-overs"></div>
                    </div>
                </div>

                <div class="team-box">
                    <div class="team-profile">
                        <img class="team-crest" id="team-b-logo" src="" alt="West Indies" width="28" height="28" decoding="async">
                        <span class="team-name-text" id="team-b-name">West Indies</span>
                    </div>
                    <div class="team-metrics">
                        <div class="runs-val" id="team-b-runs">--</div>
                        <div class="overs-val" id="team-b-overs"></div>
                    </div>
                </div>
            </div>

            <div class="summary-status" id="status-box">2nd ODI • IND vs WI</div>
            <div class="toss-tag" id="toss-info" style="display: none;"></div>
        </section>

        <!-- Full Scorecard Trigger -->
        <button class="btn-action-main" onclick="location.href='go:card1'">
            Full Scorecard & Commentary
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-8.29-1.42 1.42 5.43 5.43H5v2z"/></svg>
        </button>
    </main>

    <!-- Privacy Modal -->
    <div class="modal-overlay" id="privacyModal" onclick="if(event.target===this) toggleModal(false)">
        <div class="modal-box">
            <div class="modal-head">
                <h3>Privacy Policy</h3>
                <button class="modal-close-icon" onclick="toggleModal(false)">&times;</button>
            </div>
            <p class="modal-content-text">
                Your privacy is paramount. CricVoice does not collect personal data. Match updates are pulled in real-time solely for scores.
            </p>
            <button class="modal-confirm-btn" onclick="toggleModal(false)">Got It</button>
        </div>
    </div>

    <script>
        const API_URL = "https://api.cricradio.com.au/api/v2/match/mini-match-card?matchId=6a3103727327c23debef2654";
        const DEFAULT_LOGO = "https://ik.imagekit.io/sqt8ptw1k/images_Re-FPn8G9.jpg";
        let isLive = false;

        // Cache DOM Elements এবাৰেই ধৰি ৰখা হৈছে
        const el = {
            modal: document.getElementById('privacyModal'),
            info: document.getElementById('match-info'),
            format: document.getElementById('match-format'),
            status: document.getElementById('match-status'),
            statusBox: document.getElementById('status-box'),
            lastBallBox: document.getElementById('last-ball-container'),
            latestBall: document.getElementById('latest-ball'),
            toss: document.getElementById('toss-info'),
            teamA: {
                name: document.getElementById('team-a-name'),
                logo: document.getElementById('team-a-logo'),
                runs: document.getElementById('team-a-runs'),
                overs: document.getElementById('team-a-overs')
            },
            teamB: {
                name: document.getElementById('team-b-name'),
                logo: document.getElementById('team-b-logo'),
                runs: document.getElementById('team-b-runs'),
                overs: document.getElementById('team-b-overs')
            }
        };

        function toggleModal(open) {
            el.modal.classList.toggle('active', open);
        }

        function getLogo(team) {
            if (!team) return DEFAULT_LOGO;
            const name = (team.shortName || team.name || "").toLowerCase();
            if (name.includes("ind")) return DEFAULT_LOGO;
            if (team.logo) {
                return team.logo.startsWith("http") ? team.logo : `https://api.cricradio.com.au${team.logo.startsWith('/') ? '' : '/'}${team.logo}`;
            }
            return DEFAULT_LOGO;
        }

        function getScore(teamData, key) {
            if (!teamData) return { runs: "--", overs: "" };
            const s = teamData[`${key}_1_score`] || teamData.score;
            if (!s || s.runs === undefined) return { runs: "Yet to bat", overs: "" };
            return {
                runs: `${s.runs ?? 0}/${s.wickets ?? 0}`,
                overs: s.overs ? `(${s.overs} ov)` : ""
            };
        }

        async function fetchScore() {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000); // 8 ছেকেণ্ডত timeout

            try {
                const res = await fetch(`${API_URL}&_t=${Date.now()}`, { 
                    cache: "no-store",
                    signal: controller.signal 
                });
                clearTimeout(timeoutId);

                const data = await res.json();
                const r = data?.responseData?.result;
                if (!r) return;

                const tA = r.teams?.a || {};
                const tB = r.teams?.b || {};
                const nameA = tA.name || tA.shortName || 'India';
                const nameB = tB.name || tB.shortName || 'West Indies';
                const format = (r.format || "ODI").toUpperCase();

                el.info.textContent = `${tA.shortName || 'IND'} vs ${tB.shortName || 'WI'} • ${format}`;
                el.format.textContent = `${format} Match`;

                // Status logic
                const st = (r.status || "").toLowerCase().replace(/[\s_-]+/g, "");
                const isCompleted = st.includes("complete") || st.includes("finish");
                const isUpcoming = st.includes("notstarted") || st.includes("upcoming") || !st;
                isLive = !isUpcoming && !isCompleted;

                if (isCompleted) {
                    el.status.textContent = "COMPLETED";
                    el.status.className = "status-tag completed";
                    el.statusBox.textContent = r.announcement1 || "Match Finished";
                } else if (isLive) {
                    el.status.textContent = "LIVE";
                    el.status.className = "status-tag live";
                    const crr = r.now?.run_rate ? ` • CRR: ${r.now.run_rate}` : "";
                    const activeTeam = r.settingObj?.currentTeam === "a" ? nameA : nameB;
                    el.statusBox.textContent = `${activeTeam} batting${crr}`;
                } else {
                    el.status.textContent = "UPCOMING";
                    el.status.className = "status-tag";
                    el.statusBox.textContent = r.announcement1 || "Match Scheduled";
                }

                // Last Ball
                if (isLive && r.lastCommentary?.primaryText) {
                    el.latestBall.textContent = r.lastCommentary.primaryText;
                    el.lastBallBox.style.display = "block";
                } else {
                    el.lastBallBox.style.display = "none";
                }

                // Teams details
                el.teamA.name.textContent = nameA;
                el.teamA.logo.src = getLogo(tA);
                const sA = getScore(tA, "a");
                el.teamA.runs.textContent = sA.runs;
                el.teamA.overs.textContent = sA.overs;

                el.teamB.name.textContent = nameB;
                el.teamB.logo.src = getLogo(tB);
                const sB = getScore(tB, "b");
                el.teamB.runs.textContent = sB.runs;
                el.teamB.overs.textContent = sB.overs;

                // Toss
                if (r.announcement1 && isLive) {
                    el.toss.textContent = `Toss: ${r.announcement1}`;
                    el.toss.style.display = "block";
                } else {
                    el.toss.style.display = "none";
                }

            } catch (e) {
                // Timeout বা Network error হ'লে নিৰৱে থাকিব
            } finally {
                setTimeout(fetchScore, isLive ? 15000 : 60000);
            }
        }

        fetchScore();
    </script>
</body>
</html>
