<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Score Card</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            padding: 10px;
            margin: 0;
        }

        .score-card {
            background: #161f30;
            border: 1px solid #283548;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* Top Commentary Button */
        .btn-commentary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #1e293b, #111c2e);
            border: 1px solid rgba(56, 189, 248, 0.45);
            border-radius: 12px;
            padding: 11px 14px;
            margin-bottom: 16px;
            cursor: pointer;
            text-decoration: none;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.12);
            transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .btn-commentary:active {
            transform: scale(0.98);
        }

        .commentary-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .commentary-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.2px;
        }

        .commentary-sub {
            font-size: 11.5px;
            color: #94a3b8;
            margin-top: 3px;
        }

        .listen-badge {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: #ffffff;
            font-size: 11.5px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.35);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #232e42;
        }

        .match-info {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }

        /* Dynamic Status Badge */
        .status-badge {
            background-color: rgba(59, 130, 246, 0.16);
            border: 1px solid rgba(59, 130, 246, 0.45);
            color: #60a5fa;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 12px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .status-badge.live {
            background-color: #ef4444;
            border-color: #ef4444;
            color: #ffffff;
            animation: blink 1.2s infinite ease-in-out;
        }

        .status-badge.completed {
            background-color: #10b981;
            border-color: #10b981;
            color: #ffffff;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 16px 0;
        }

        .venue {
            font-size: 12px;
            color: #94a3b8;
        }

        .last-ball-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #94a3b8;
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .ball-circle {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 18px;
            height: 18px;
            background: #38bdf8;
            color: #0b0f19;
            font-weight: 700;
            border-radius: 50%;
            font-size: 11px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .team-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .team-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #1e293b;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .team-name {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .team-score {
            text-align: right;
        }

        .runs {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        .overs {
            font-size: 12px;
            color: #94a3b8;
        }

        /* Dynamic Status Box */
        .status-box {
            background-color: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.25);
            color: #93c5fd;
            border-radius: 10px;
            padding: 10px;
            font-size: 13px;
            text-align: center;
            margin-top: 14px;
            line-height: 1.4;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .status-box.live {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.25);
            color: #f87171;
        }

        .status-box.completed {
            background-color: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.25);
            color: #38bdf8;
        }

        .footer-note {
            margin-top: 12px;
            font-size: 12.5px;
            color: #cbd5e1;
            font-weight: 500;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #232e42;
        }

        /* Bottom Full Scorecard Button */
        .btn-card {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 600;
            padding: 10px;
            border: none;
            border-radius: 10px;
            margin-top: 14px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s ease;
        }

        .btn-card:hover {
            background: #1d4ed8;
        }

        .btn-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="score-card">
        <!-- Top Commentary Button -->
        <div class="btn-commentary" onclick="window.location.href='go:commentary'">
            <div class="commentary-text">
                <span class="commentary-title">🎙️ Ball By Ball Commentary</span>
                <span class="commentary-sub">Listen to live audio coverage</span>
            </div>
            <span class="listen-badge">Listen Now</span>
        </div>

        <!-- Header -->
        <div class="card-header">
            <span class="match-info" id="match-info">India Women vs Pakistan Women T20</span>
            <span class="status-badge" id="match-status">LIVE</span>
        </div>

        <!-- Venue & Latest Ball -->
        <div class="sub-header">
            <span class="venue" id="venue-info">📍 T20 Match</span>
            <div class="last-ball-badge" id="last-ball-container" style="display: none;">
                <span>Last Ball:</span>
                <span class="ball-circle" id="latest-ball">-</span>
            </div>
        </div>

        <!-- Team 1 (India Women) -->
        <div class="team-row">
            <div class="team-details">
                <img class="team-logo" id="team-a-logo" src="" alt="" style="display: none;">
                <span class="team-name" id="team-a-name">India Women</span>
            </div>
            <div class="team-score">
                <div class="runs" id="team-a-runs">--</div>
                <div class="overs" id="team-a-overs"></div>
            </div>
        </div>

        <!-- Team 2 (Pakistan Women) -->
        <div class="team-row">
            <div class="team-details">
                <img class="team-logo" id="team-b-logo" src="" alt="" style="display: none;">
                <span class="team-name" id="team-b-name">Pakistan Women</span>
            </div>
            <div class="team-score">
                <div class="runs" id="team-b-runs">--</div>
                <div class="overs" id="team-b-overs"></div>
            </div>
        </div>

        <!-- Status Message -->
        <div class="status-box" id="status-box">
            Pak W opt to Bat
        </div>

        <!-- Toss Details -->
        <div class="footer-note" id="toss-info" style="display: none;">
            Toss: -
        </div>

        <!-- Bottom Full Scorecard Button -->
        <button class="btn-card" onclick="window.location.href='go:card1'">
            Full Score Card
        </button>
    </div>

    <script>
        const matchId = "6a7521ed78dcf065703188c1";
        const cricketApiUrl = `https://api.cricradio.com.au/api/v2/match/mini-match-card?matchId=${matchId}`;
        let isMatchLive = true;

        // নিৰ্দিষ্ট Cricbuzz ল'গ' নিৰ্ধাৰণ
        function getTeamLogo(team) {
            if (!team) return "";
            const name = (team.shortName || team.name || "").toLowerCase();

            if (name.includes("pak")) {
                return "https://static.cricbuzz.com/a/img/v1/0x0/i1/c776311/pakistan-women.jpg";
            }
            if (name.includes("ind")) {
                return "https://static.cricbuzz.com/a/img/v1/0x0/i1/c776182/india-women.jpg";
            }
            if (team.logo) {
                if (team.logo.startsWith("http")) return team.logo;
                return `https://api.cricradio.com.au${team.logo.startsWith("/") ? "" : "/"}${team.logo}`;
            }
            return "";
        }

        // স্ক'ৰ আৰু অভাৰ উলিওৱা ফাংশন
        function getScoreData(teamData, teamKey) {
            if (!teamData) return { runs: "--", overs: "" };
            const s1 = teamData[`${teamKey}_1_score`];
            const s2 = teamData[`${teamKey}_2_score`];

            if (s1 && typeof s1.runs !== "undefined") {
                const r = `${s1.runs}/${s1.wickets ?? 0}`;
                const o = s1.overs !== undefined ? `(${s1.overs} ov)` : "";
                return { runs: r, overs: o };
            }
            return { runs: "--", overs: "" };
        }

        // "MATCH STARTS AT..." লাইন আঁতৰাই ন'ট প্ৰস্তুত কৰা
        function extractCleanNote(result) {
            let note = "";
            if (result.lastCommentary && result.lastCommentary.secondaryText) {
                note = result.lastCommentary.secondaryText;
            } else if (result.announcement1 && result.announcement1.trim() !== "") {
                note = result.announcement1.trim();
            } else {
                note = result.status ? result.status.toUpperCase() : "";
            }

            return note
                .split(/\r?\n/)
                .filter(line => !line.toLowerCase().includes("match starts at"))
                .join(" • ")
                .trim();
        }

        async function fetchLiveScore() {
            try {
                const response = await fetch(`${cricketApiUrl}&_t=${Date.now()}`, { cache: "no-store" });
                if (!response.ok) return;

                const data = await response.json();
                const result = data?.responseData?.result;
                if (!result) return;

                const teamA = result.teams?.a || {};
                const teamB = result.teams?.b || {};

                // ১. মেচ টাইটেল
                const format = (result.format || "T20").toUpperCase();
                document.getElementById("match-info").textContent = `${teamA.shortName || teamA.name || "IND W"} vs ${teamB.shortName || teamB.name || "PAK W"} ${format}`;

                // ২. মেচ ষ্টেটাছ নিৰ্ধাৰণ
                const rawStatus = (result.status || "").toLowerCase();
                const isCompleted = rawStatus.includes("complete") || rawStatus.includes("finish") || rawStatus.includes("ended");
                const isLive = rawStatus.includes("started") || rawStatus.includes("live") || rawStatus.includes("in progress");

                isMatchLive = isLive;

                const statusBadge = document.getElementById("match-status");
                const statusBox = document.getElementById("status-box");
                const cleanNote = extractCleanNote(result);

                if (isCompleted) {
                    statusBadge.textContent = "COMPLETED";
                    statusBadge.className = "status-badge completed";
                    statusBox.className = "status-box completed";
                    statusBox.textContent = cleanNote || "Match Finished";
                } else if (isLive) {
                    statusBadge.textContent = "LIVE";
                    statusBadge.className = "status-badge live";
                    statusBox.className = "status-box live";
                    statusBox.textContent = cleanNote || "Match in progress";
                } else {
                    statusBadge.textContent = "SCHEDULED";
                    statusBadge.className = "status-badge";
                    statusBox.className = "status-box";
                    statusBox.textContent = cleanNote || "Match Scheduled";
                }

                // ৩. ভেনিউ
                document.getElementById("venue-info").textContent = `📍 ${format} Match`;

                // ৪. Team A (India Women)
                document.getElementById("team-a-name").textContent = teamA.name || teamA.shortName || "India Women";
                const logoA = document.getElementById("team-a-logo");
                const logoAUrl = getTeamLogo(teamA);
                if (logoAUrl) {
                    logoA.src = logoAUrl;
                    logoA.alt = teamA.shortName || "IND W";
                    logoA.style.display = "block";
                }
                const scoreA = getScoreData(teamA, "a");
                document.getElementById("team-a-runs").textContent = scoreA.runs;
                document.getElementById("team-a-overs").textContent = scoreA.overs;

                // ৫. Team B (Pakistan Women)
                document.getElementById("team-b-name").textContent = teamB.name || teamB.shortName || "Pakistan Women";
                const logoB = document.getElementById("team-b-logo");
                const logoBUrl = getTeamLogo(teamB);
                if (logoBUrl) {
                    logoB.src = logoBUrl;
                    logoB.alt = teamB.shortName || "PAK W";
                    logoB.style.display = "block";
                }
                const scoreB = getScoreData(teamB, "b");
                document.getElementById("team-b-runs").textContent = scoreB.runs;
                document.getElementById("team-b-overs").textContent = scoreB.overs;

                // ৬. টছৰ বিৱৰণ
                const tossEl = document.getElementById("toss-info");
                if (result.announcement1 && result.announcement1.toLowerCase().includes("opt to")) {
                    tossEl.textContent = `Toss: ${result.announcement1}`;
                    tossEl.style.display = "block";
                } else {
                    tossEl.style.display = "none";
                }

            } catch (error) {
                console.error("Error fetching live score:", error);
            } finally {
                const nextInterval = isMatchLive ? 30000 : 60000;
                setTimeout(fetchLiveScore, nextInterval);
            }
        }

        fetchLiveScore();
    </script>
</body>
</html>
