<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cricket Scores - Live & Fixtures</title>
    <style>
        :root {
            --bg: #090d16;
            --card: #111827;
            --nested: #182234;
            --border: #1e293b;
            --cyan: #38bdf8;
            --blue: #2563eb;
            --live: #ef4444;
            --green: #10b981;
            --text: #ffffff;
            --muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 8px 10px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            display: grid;
            place-items: center;
        }

        .brand-icon svg, .icon-btn svg {
            width: 16px;
            height: 16px;
            fill: #fff;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
        }

        .top-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: var(--nested);
            border: 1px solid var(--border);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            cursor: pointer;
        }

        /* Filter Tabs */
        .tabs-nav {
            display: flex;
            background: var(--nested);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border);
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 4px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--blue);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
        }

        .tab-badge {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
        }

        .tab-btn.active .tab-badge {
            background: #ffffff;
            color: var(--blue);
        }

        /* Commentary Capsule */
        .commentary-capsule {
            background: var(--nested);
            border: 1px solid #1e3a5f;
            border-radius: 12px;
            padding: 9px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .commentary-content {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mic-box {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            background: rgba(56, 189, 248, 0.15);
            display: grid;
            place-items: center;
        }

        .mic-box svg {
            width: 15px;
            height: 15px;
            fill: var(--cyan);
        }

        .commentary-texts h4 { font-size: 12px; font-weight: 700; }
        .commentary-texts p { font-size: 10px; color: var(--cyan); }

        .listen-pill {
            background: var(--cyan);
            color: #000;
            font-size: 10.5px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Matches Stream */
        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .match-card {
            background: var(--nested);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .match-card:active {
            transform: scale(0.985);
            border-color: var(--cyan);
        }

        .match-meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .match-label {
            font-size: 12px;
            font-weight: 700;
            max-width: 65%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-tag {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 5px;
            background: #1e293b;
            color: var(--muted);
            text-transform: uppercase;
        }

        .status-tag.live {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .status-tag.completed {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ef4444;
            display: inline-block;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .venue-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .ball-glow {
            background: var(--cyan);
            color: #000;
            font-weight: 700;
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 10px;
        }

        .teams-arena {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .team-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 10px;
        }

        .team-profile {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .team-crest {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #1e293b;
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
        }

        .team-name-text {
            font-size: 13px;
            font-weight: 600;
        }

        .team-metrics {
            text-align: right;
        }

        .runs-val {
            font-size: 14px;
            font-weight: 700;
        }

        .overs-val {
            font-size: 10.5px;
            color: var(--cyan);
        }

        .summary-status {
            margin-top: 10px;
            padding: 7px 10px;
            background: var(--card);
            border-radius: 8px;
            text-align: center;
            font-size: 11px;
            color: #cbd5e1;
        }

        .empty-placeholder {
            text-align: center;
            padding: 40px 10px;
            color: var(--muted);
            font-size: 12.5px;
            background: var(--nested);
            border-radius: 12px;
            border: 1px dashed var(--border);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            place-items: center;
            padding: 16px;
            z-index: 99;
        }

        .modal-overlay.active { display: grid; }

        .modal-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            width: 100%;
            max-width: 320px;
            padding: 16px;
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .modal-close-icon { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; }
        .modal-confirm-btn { width: 100%; background: var(--blue); color: #fff; border: none; padding: 9px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 12px; }
    </style>
</head>
<body>

    <main class="app-container">
        <!-- Top App Bar -->
        <header class="top-bar">
            <div class="brand-badge">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                </div>
                <h1 class="brand-name">Cricket Score App</h1>
            </div>

            <div class="top-actions">
                <button class="icon-btn" onclick="toggleModal(true)" aria-label="Privacy">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                </button>
                <button class="icon-btn" onclick="location.href='http://action_share'" aria-label="Share">
                    <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
                </button>
            </div>
        </header>

        <!-- Commentary Capsule -->
        <div class="commentary-capsule" onclick="location.href='go:commentary'">
            <div class="commentary-content">
                <div class="mic-box">
                    <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                </div>
                <div class="commentary-texts">
                    <h4>Live Audio Feed</h4>
                    <p>Ball-by-ball commentary</p>
                </div>
            </div>
            <div class="listen-pill">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="#000"><path d="M8 5v14l11-7z"/></svg>
                Listen
            </div>
        </div>

        <!-- Filter Tabs -->
        <nav class="tabs-nav">
            <button class="tab-btn" id="tab-btn-live" onclick="switchTab('live')">
                Live <span class="tab-badge" id="badge-live">0</span>
            </button>
            <button class="tab-btn" id="tab-btn-upcoming" onclick="switchTab('upcoming')">
                Upcoming <span class="tab-badge" id="badge-upcoming">0</span>
            </button>
            <button class="tab-btn" id="tab-btn-completed" onclick="switchTab('completed')">
                Completed <span class="tab-badge" id="badge-completed">0</span>
            </button>
        </nav>

        <!-- Matches Container -->
        <section class="matches-list" id="matches-container"></section>
    </main>

    <!-- Privacy Modal -->
    <div class="modal-overlay" id="privacyModal" onclick="if(event.target===this) toggleModal(false)">
        <div class="modal-box">
            <div class="modal-head">
                <h3 style="font-size: 14px;">Privacy Policy</h3>
                <button class="modal-close-icon" onclick="toggleModal(false)">&times;</button>
            </div>
            <p style="font-size: 11.5px; color: var(--muted); line-height: 1.5;">
                We respect your privacy. Real-time scores and live streaming data are collected solely to deliver cricket updates. No personal data is stored.
            </p>
            <button class="modal-confirm-btn" onclick="toggleModal(false)">Got It</button>
        </div>
    </div>

    <script>
        const CDN_BASE = "https://api.cricradio.com.au";

        const FLAGS = {
            ind: "https://ik.imagekit.io/sqt8ptw1k/india.webp?updatedAt=1790419929690",
            indw: "https://ik.imagekit.io/sqt8ptw1k/india.webp?updatedAt=1790419929690",
            afg: "https://ik.imagekit.io/sqt8ptw1k/afghanistan.webp?updatedAt=1790568292618",
            zim: "https://ik.imagekit.io/sqt8ptw1k/zimbabwe.webp?updatedAt=1789455540523",
            zimw: "https://ik.imagekit.io/sqt8ptw1k/zimbabwe.webp?updatedAt=1789455540523"
        };

        let matchesData = [
            {
                id: "match_indw_zimw",
                apiUrl: "https://api.cricradio.com.au/api/v2/match/mini-match-card?matchId=6a4b53d5f96b301cc0895786",
                series: "India Women Tour of Zimbabwe 2026",
                matchInfo: "INDW vs ZIMW • 1st ODI",
                startTime: "2026-10-23T14:00:00+05:30",
                durationHours: 8,
                category: "upcoming",
                lastBall: null,
                teamA: { name: "IND-W", score: "Yet to bat", overs: "", logo: FLAGS.indw },
                teamB: { name: "ZIM-W", score: "Yet to bat", overs: "", logo: FLAGS.zimw },
                upcomingText: "Starts 23 Oct, 02:00 PM IST",
                actionUrl: "go:card_indw"
            },
            {
                id: "match_afg_zim",
                apiUrl: "https://api.cricradio.com.au/api/v2/match/mini-match-card?matchId=6abf701d1c313bb3df5a1a79",
                series: "ODI Tri-Nation Series 2026",
                matchInfo: "AFG vs ZIM • Final",
                startTime: "2026-10-23T17:00:00+05:30",
                durationHours: 8,
                category: "upcoming",
                lastBall: null,
                teamA: { name: "AFG", score: "Yet to bat", overs: "", logo: FLAGS.afg },
                teamB: { name: "ZIM", score: "Yet to bat", overs: "", logo: FLAGS.zim },
                upcomingText: "Starts 23 Oct, 05:00 PM IST",
                actionUrl: "go:card_afg"
            }
        ];

        let currentTab = "upcoming";

        function toggleModal(open) {
            document.getElementById('privacyModal').classList.toggle('active', open);
        }

        // সময় অনুসূচী অনুসৰি স্থিতি পৰীক্ষা (Fallback)
        function checkAutoLiveTransitions() {
            const now = Date.now();

            matchesData.forEach(m => {
                if (m.hasApiStatus) return;

                const matchStart = new Date(m.startTime).getTime();
                const matchEnd = matchStart + (m.durationHours * 3600000);

                if (now < matchStart) {
                    m.category = "upcoming";
                } else if (now >= matchStart && now < matchEnd) {
                    m.category = "live";
                } else {
                    m.category = "completed";
                }
            });
        }

        // CricRadio API ৰ responseData.result অনুসৰি স্ক'ৰ আৰু স্থিতি আপডেট
        async function fetchMatchUpdates() {
            for (let m of matchesData) {
                if (!m.apiUrl) continue;
                try {
                    const response = await fetch(m.apiUrl);
                    if (!response.ok) continue;

                    const resJson = await response.json();
                    const result = resJson?.responseData?.result;

                    if (!result) continue;

                    // ১. খেলৰ স্থিতি নিৰ্ণয় (Match Status Mapping)
                    const status = (result.status || "").toLowerCase();
                    if (status.includes("live") || status.includes("inprogress") || status.includes("running")) {
                        m.category = "live";
                        m.hasApiStatus = true;
                    } else if (status.includes("complete") || status.includes("finished") || status.includes("result") || status.includes("won")) {
                        m.category = "completed";
                        m.hasApiStatus = true;
                    } else if (status.includes("notstarted") || status.includes("upcoming") || status.includes("scheduled")) {
                        m.category = "upcoming";
                        m.hasApiStatus = true;
                    }

                    // ২. দলৰ নাম, ল'গ' আৰু স্ক'ৰ সংগ্ৰহ (Team A & B Extraction)
                    if (result.teams) {
                        // Team A
                        if (result.teams.a) {
                            const tA = result.teams.a;
                            if (tA.shortName || tA.name) {
                                m.teamA.name = (tA.shortName || tA.name).toUpperCase();
                            }

                            // ল'গ' প্ৰচেছিং
                            if (tA.logo) {
                                m.teamA.logo = tA.logo.startsWith("http") ? tA.logo : `${CDN_BASE}${tA.logo}`;
                            }

                            // a_2_score বা a_1_score সংগ্ৰহ
                            const scA = tA.a_2_score || tA.a_1_score;
                            if (scA && scA.runs !== undefined) {
                                const wkts = scA.wickets !== undefined ? `/${scA.wickets}` : '';
                                m.teamA.score = `${scA.runs}${wkts}`;
                                m.teamA.overs = scA.overs ? `${scA.overs} ov` : (result.settingObj?.teamAOver ? `${result.settingObj.teamAOver} ov` : '');
                            } else if (tA.score) {
                                m.teamA.score = tA.score;
                            }
                        }

                        // Team B
                        if (result.teams.b) {
                            const tB = result.teams.b;
                            if (tB.shortName || tB.name) {
                                m.teamB.name = (tB.shortName || tB.name).toUpperCase();
                            }

                            // ল'গ' প্ৰচেছিং
                            if (tB.logo) {
                                m.teamB.logo = tB.logo.startsWith("http") ? tB.logo : `${CDN_BASE}${tB.logo}`;
                            }

                            // b_2_score বা b_1_score সংগ্ৰহ
                            const scB = tB.b_2_score || tB.b_1_score;
                            if (scB && scB.runs !== undefined) {
                                const wkts = scB.wickets !== undefined ? `/${scB.wickets}` : '';
                                m.teamB.score = `${scB.runs}${wkts}`;
                                m.teamB.overs = scB.overs ? `${scB.overs} ov` : (result.settingObj?.teamBOver ? `${result.settingObj.teamBOver} ov` : '');
                            } else if (tB.score) {
                                m.teamB.score = tB.score;
                            }
                        }
                    }

                    // ৩. মেচ ঘোষণা আৰু লাইভ ৰাণ ৰেট বাৰ্তা
                    if (m.category === "completed") {
                        m.resultText = result.announcement1 || "Match Finished 🏆";
                    } else if (m.category === "live") {
                        let note = result.announcement1 || "";
                        if (result.now?.run_rate) {
                            const crr = `CRR: ${result.now.run_rate}`;
                            const rrr = (result.now.req_run_rate && result.now.req_run_rate !== "0.00") ? ` • RRR: ${result.now.req_run_rate}` : '';
                            note = note ? `${note} (${crr}${rrr})` : `${crr}${rrr}`;
                        }
                        m.liveSummary = note || "Match in progress • Ball-by-ball updates live 🔴";
                    } else {
                        m.upcomingText = result.announcement1 || m.upcomingText;
                    }

                    // ৪. শেষ বলৰ আপডেট
                    if (result.last_ball || result.lastBall) {
                        m.lastBall = result.last_ball || result.lastBall;
                    }

                } catch (err) {
                    console.warn("API Error for " + m.id, err);
                }
            }

            updateTabBadges();
            renderMatches();
        }

        function updateTabBadges() {
            const counts = { live: 0, upcoming: 0, completed: 0 };
            matchesData.forEach(m => {
                if (counts[m.category] !== undefined) counts[m.category]++;
            });
            document.getElementById('badge-live').textContent = counts.live;
            document.getElementById('badge-upcoming').textContent = counts.upcoming;
            document.getElementById('badge-completed').textContent = counts.completed;

            return counts;
        }

        function renderMatches() {
            const container = document.getElementById('matches-container');
            const filtered = matchesData.filter(m => m.category === currentTab);

            if (filtered.length === 0) {
                const messages = {
                    live: "No live matches in progress right now 🏏",
                    upcoming: "No upcoming fixtures scheduled 📅",
                    completed: "No completed matches found 🏆"
                };
                container.innerHTML = `<div class="empty-placeholder">${messages[currentTab]}</div>`;
                return;
            }

            container.innerHTML = filtered.map(m => {
                const isLive = m.category === "live";
                const isCompleted = m.category === "completed";
                const statusClass = isLive ? "live" : (isCompleted ? "completed" : "");
                const statusText = isLive 
                    ? `<span class="live-dot"></span> LIVE` 
                    : (isCompleted ? "COMPLETED" : "UPCOMING");

                const summaryText = isLive 
                    ? (m.liveSummary || "Match in progress • Ball-by-ball updates live")
                    : (isCompleted ? (m.resultText || "Match Finished") : m.upcomingText);

                return `
                    <article class="match-card" onclick="location.href='${m.actionUrl}'">
                        <div class="match-meta-bar">
                            <span class="match-label">${m.matchInfo}</span>
                            <span class="status-tag ${statusClass}">${statusText}</span>
                        </div>

                        <div class="venue-row">
                            <span>${m.series}</span>
                            ${isLive && m.lastBall ? `<div>Last Ball: <span class="ball-glow">${m.lastBall}</span></div>` : ''}
                        </div>

                        <div class="teams-arena">
                            <div class="team-box">
                                <div class="team-profile">
                                    <img class="team-crest" src="${m.teamA.logo}" alt="${m.teamA.name}" onerror="this.outerHTML='<div class=\\'team-crest\\'>${m.teamA.name.slice(0,3)}</div>'">
                                    <span class="team-name-text">${m.teamA.name}</span>
                                </div>
                                <div class="team-metrics">
                                    <div class="runs-val">${m.teamA.score}</div>
                                    <div class="overs-val">${m.teamA.overs}</div>
                                </div>
                            </div>

                            <div class="team-box">
                                <div class="team-profile">
                                    <img class="team-crest" src="${m.teamB.logo}" alt="${m.teamB.name}" onerror="this.outerHTML='<div class=\\'team-crest\\'>${m.teamB.name.slice(0,3)}</div>'">
                                    <span class="team-name-text">${m.teamB.name}</span>
                                </div>
                                <div class="team-metrics">
                                    <div class="runs-val">${m.teamB.score}</div>
                                    <div class="overs-val">${m.teamB.overs}</div>
                                </div>
                            </div>
                        </div>

                        <div class="summary-status">${summaryText}</div>
                    </article>
                `;
            }).join('');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeBtn = document.getElementById(`tab-btn-${tab}`);
            if (activeBtn) activeBtn.classList.add('active');
            renderMatches();
        }

        // প্ৰাৰম্ভিক লোডিং আৰু প্ৰতি ১৫ ছেকেণ্ডত স্বয়ংক্ৰিয় লাইভ কল
        async function startMatchScheduler() {
            checkAutoLiveTransitions();
            const counts = updateTabBadges();

            if (counts.live > 0) {
                switchTab('live');
            } else {
                switchTab('upcoming');
            }

            // প্ৰথমবাৰ API কল
            await fetchMatchUpdates();

            // প্ৰতি ১৫ ছেকেণ্ডৰ মূৰে মূৰে API ৰ পৰা লাইভ স্ক'ৰ আপডেট
            setInterval(fetchMatchUpdates, 15000);

            // প্ৰতি ১ মিনিটত সময়ৰ অনুসূচী পৰীক্ষা
            setInterval(() => {
                checkAutoLiveTransitions();
                updateTabBadges();
                renderMatches();
            }, 60000);
        }

        startMatchScheduler();
    </script>
</body>
</html>
