<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Cricket Scorecard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            background-color: #030712;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0; /* ওপৰৰ সকলো খালী ঠাই আঁতৰোৱা হৈছে */
            margin: 0;
        }

        /* Premium Main Container */
        .score-card {
            background: linear-gradient(165deg, #0f172a 0%, #060b16 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: none; /* ওপৰৰ কাষলৈ সম্পূৰ্ণ মিলি যোৱাৰ বাবে */
            border-radius: 0 0 20px 20px;
            width: 100%;
            max-width: 410px;
            padding: 10px 12px 14px 12px;
            color: #ffffff;
            box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.9), 0 0 20px rgba(14, 165, 233, 0.05);
            display: flex;
            flex-direction: column;
            gap: 7px;
            contain: content;
        }

        /* Top Audio Action Bar */
        .audio-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.12), rgba(30, 41, 59, 0.5));
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            padding: 7px 11px;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: transform 0.15s ease, border-color 0.2s;
        }

        .audio-bar:active {
            transform: scale(0.98);
            border-color: #38bdf8;
        }

        .audio-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .audio-icon-box {
            width: 30px;
            height: 30px;
            background: rgba(56, 189, 248, 0.18);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .audio-icon-box svg {
            width: 15px;
            height: 15px;
            fill: #38bdf8;
        }

        .audio-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .audio-main-text {
            font-size: 12px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 0.2px;
        }

        .audio-sub-text {
            font-size: 9.5px;
            color: #94a3b8;
        }

        .audio-cta-btn {
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #ffffff;
            font-size: 10.5px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.35);
        }

        .audio-cta-btn svg {
            width: 10px;
            height: 10px;
            fill: #ffffff;
        }

        /* Match Header */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1px 2px 0 2px;
        }

        .match-type {
            font-size: 10.5px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #94a3b8;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 2px 7px;
            border-radius: 12px;
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.4px;
        }

        .pulse-dot {
            width: 5.5px;
            height: 5.5px;
            background-color: #ef4444;
            border-radius: 50%;
            box-shadow: 0 0 6px #ef4444;
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        .day-session {
            font-size: 11px;
            color: #38bdf8;
            font-weight: 700;
            padding-left: 2px;
            margin-top: -3px;
        }

        /* Team Row Styling */
        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 11px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.25s, border-color 0.25s;
        }

        .team-row.active {
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.1) 0%, rgba(15, 23, 42, 0.3) 100%);
            border: 1px solid rgba(56, 189, 248, 0.4);
            box-shadow: inset 3px 0 0 #38bdf8;
        }

        .team-identity {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .team-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            background: #0f172a;
            flex-shrink: 0;
        }

        .team-name {
            font-size: 14px;
            font-weight: 600;
            color: #f8fafc;
        }

        .scores {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .main-score {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.15;
        }

        .sub-score {
            font-size: 9.5px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Badges */
        .declared, .follon {
            font-size: 8.5px;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 800;
            margin-left: 3px;
            display: inline-block;
            vertical-align: middle;
        }

        .declared { 
            background: rgba(234, 179, 8, 0.2); 
            color: #facc15; 
            border: 1px solid rgba(234, 179, 8, 0.4);
        }
        
        .follon { 
            background: rgba(244, 63, 94, 0.2); 
            color: #fb7185; 
            border: 1px solid rgba(244, 63, 94, 0.4);
        }

        /* Announcement Status Banner */
        .announcement-banner {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: #34d399;
            text-align: center;
            padding: 6px 8px;
            border-radius: 9px;
            font-size: 11.5px;
            font-weight: 700;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 8px;
            border-radius: 9px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-label {
            font-size: 8.5px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .stat-value {
            font-size: 13px;
            font-weight: 700;
            color: #f1f5f9;
            margin-top: 1px;
            font-variant-numeric: tabular-nums;
        }

        /* Commentary Card */
        .commentary-card {
            background: rgba(255, 255, 255, 0.025);
            border-left: 3px solid #38bdf8;
            padding: 7px 9px;
            border-radius: 7px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .commentary-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .commentary-primary {
            font-size: 11.5px;
            font-weight: 600;
            color: #38bdf8;
        }

        .commentary-over-run {
            font-size: 9.5px;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.05);
            padding: 1px 5px;
            border-radius: 4px;
            font-variant-numeric: tabular-nums;
        }

        .commentary-secondary {
            font-size: 10px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
            border-top: 1px dashed rgba(255, 255, 255, 0.08);
            padding-top: 3px;
            white-space: pre-line;
        }
    </style>
</head>
<body>

<div class="score-card">
    <!-- Top Audio Action Bar -->
    <a href="go:commentary" class="audio-bar">
        <div class="audio-left">
            <div class="audio-icon-box">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3a9 9 0 0 0-9 9v7c0 1.66 1.34 3 3 3h1a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H5v-2a7 7 0 0 1 14 0v2h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1c1.66 0 3-1.34 3-3v-7a9 9 0 0 0-9-9z"/>
                </svg>
            </div>
            <div class="audio-text">
                <span class="audio-main-text">Ball By Commentary</span>
                <span class="audio-sub-text">Listen to live audio coverage</span>
            </div>
        </div>
        <div class="audio-cta-btn">
            <span>Listen Now</span>
            <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </div>
    </a>

    <!-- Match Header -->
    <div class="card-header">
        <span class="match-type" id="matchFormat">Test Match • Live</span>
        <div class="live-badge">
            <span class="pulse-dot"></span>
            <span>LIVE</span>
        </div>
    </div>

    <!-- Match Stage -->
    <div class="day-session" id="daySession">Loading session info...</div>

    <!-- Team A (Sri Lanka) -->
    <div class="team-row" id="teamARow">
        <div class="team-identity">
            <img src="https://i.ibb.co/zVc6D7zf/images.jpg" alt="Sri Lanka" class="team-logo" loading="lazy">
            <span class="team-name" id="teamAName">Sri Lanka</span>
        </div>
        <div class="scores">
            <div class="main-score" id="teamAScoreMain">--</div>
            <div class="sub-score" id="teamAScoreSub">--</div>
        </div>
    </div>

    <!-- Team B (India) -->
    <div class="team-row" id="teamBRow">
        <div class="team-identity">
            <img src="https://i.ibb.co/1G0vgbw0/images.png" alt="India" class="team-logo" loading="lazy">
            <span class="team-name" id="teamBName">India</span>
        </div>
        <div class="scores">
            <div class="main-score" id="teamBScoreMain">--</div>
            <div class="sub-score" id="teamBScoreSub">--</div>
        </div>
    </div>

    <!-- Announcement -->
    <div class="announcement-banner" id="announcement">
        Fetching live updates...
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">Current Run Rate</div>
            <div class="stat-value" id="crrVal">--</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Overs Remaining</div>
            <div class="stat-value" id="overLeftVal">--</div>
        </div>
    </div>

    <!-- Commentary -->
    <div class="commentary-card" id="commCard">
        <div class="commentary-top">
            <span class="commentary-primary" id="commPrimary"></span>
            <span class="commentary-over-run" id="commTertiary"></span>
        </div>
        <div class="commentary-secondary" id="commSecondary"></div>
    </div>
</div>

<script>
    const API_URL = "https://api.cricradio.com.au/api/v2/match/mini-match-card?matchId=6a46abf321dc815bb318261b";

    async function fetchLiveScore() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) return;
            const data = await response.json();

            if (data && data.statusCode === 1 && data.responseData && data.responseData.result) {
                renderData(data.responseData.result);
            }
        } catch (error) {
            console.error("Score fetch failed:", error);
        }
    }

    function renderData(res) {
        document.getElementById("matchFormat").textContent = `${(res.format || 'Test').toUpperCase()} MATCH • LIVE`;
        document.getElementById("daySession").textContent = `Day ${res.now?.day || '1'} • Session ${res.now?.sessionCount || '1'}`;
        document.getElementById("announcement").textContent = res.announcement1 || "Live Action";

        // Team A
        const teamA = res.teams?.a;
        if (teamA) {
            document.getElementById("teamAName").textContent = teamA.name;

            if (teamA.a_2_score && teamA.a_2_score.runs !== undefined) {
                let badge = teamA.a_2_score.follon ? '<span class="follon">F/O</span>' : (teamA.a_2_score.declare ? '<span class="declared">d</span>' : '');
                document.getElementById("teamAScoreMain").innerHTML = `${teamA.a_2_score.runs}/${teamA.a_2_score.wickets} ${badge}`;
                document.getElementById("teamAScoreSub").textContent = `1st: ${teamA.a_1_score?.runs || 0} (${teamA.a_1_score?.overs || 0} ov) • ${teamA.a_2_score.overs} ov`;
            } else if (teamA.a_1_score) {
                let badge = teamA.a_1_score.declare ? '<span class="declared">d</span>' : '';
                document.getElementById("teamAScoreMain").innerHTML = `${teamA.a_1_score.runs}/${teamA.a_1_score.wickets} ${badge}`;
                document.getElementById("teamAScoreSub").textContent = `${teamA.a_1_score.overs} ov`;
            }
        }

        // Team B
        const teamB = res.teams?.b;
        if (teamB) {
            document.getElementById("teamBName").textContent = teamB.name;

            if (teamB.b_2_score && teamB.b_2_score.runs !== undefined) {
                let badge = teamB.b_2_score.follon ? '<span class="follon">F/O</span>' : (teamB.b_2_score.declare ? '<span class="declared">d</span>' : '');
                document.getElementById("teamBScoreMain").innerHTML = `${teamB.b_2_score.runs}/${teamB.b_2_score.wickets} ${badge}`;
                document.getElementById("teamBScoreSub").textContent = `1st: ${teamB.b_1_score?.runs || 0} (${teamB.b_1_score?.overs || 0} ov) • ${teamB.b_2_score.overs} ov`;
            } else if (teamB.b_1_score) {
                let badge = teamB.b_1_score.declare ? '<span class="declared">d</span>' : '';
                document.getElementById("teamBScoreMain").innerHTML = `${teamB.b_1_score.runs}/${teamB.b_1_score.wickets} ${badge}`;
                document.getElementById("teamBScoreSub").textContent = `${teamB.b_1_score.overs} ov`;
            }
        }

        // Active Team Highlight
        const curTeam = res.settingObj?.currentTeam;
        document.getElementById("teamARow").classList.toggle("active", curTeam === "a");
        document.getElementById("teamBRow").classList.toggle("active", curTeam === "b");

        // Stats Matrix
        document.getElementById("crrVal").textContent = `${res.now?.run_rate || '0.00'} CRR`;
        document.getElementById("overLeftVal").textContent = `${res.now?.overLeft || '0.0'} Overs`;

        // Commentary
        if (res.lastCommentary) {
            let primary = (res.lastCommentary.primaryText || "").trim();
            if (primary.toLowerCase() === "ball start") primary = "";

            document.getElementById("commPrimary").textContent = primary;
            document.getElementById("commTertiary").textContent = res.lastCommentary.tertiaryText || "";
            document.getElementById("commSecondary").textContent = res.lastCommentary.secondaryText || "";

            const hasSecondary = !!res.lastCommentary.secondaryText;
            document.getElementById("commSecondary").style.display = hasSecondary ? "flex" : "none";
        }
    }

    fetchLiveScore();
    setInterval(fetchLiveScore, 5000);
</script>

</body>
</html>
