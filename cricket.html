<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Score Card</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            padding: 10px;
            margin: 0;
        }

        .score-card {
            background: #161f30;
            border: 1px solid #283548;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* Top Commentary Button */
        .btn-commentary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, #1e293b, #111c2e);
            border: 1px solid rgba(56, 189, 248, 0.45);
            border-radius: 12px;
            padding: 11px 14px;
            margin-bottom: 16px;
            cursor: pointer;
            text-decoration: none;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.12);
            transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .btn-commentary:active {
            transform: scale(0.98);
        }

        .commentary-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .commentary-title {
            font-size: 13.5px;
            font-weight: 700;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.2px;
        }

        .commentary-sub {
            font-size: 11.5px;
            color: #94a3b8;
            margin-top: 3px;
        }

        .listen-badge {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: #ffffff;
            font-size: 11.5px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.35);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #232e42;
        }

        .match-info {
            font-size: 13px;
            color: #94a3b8;
            font-weight: 500;
        }

        /* Dynamic Status Badge */
        .status-badge {
            background-color: rgba(59, 130, 246, 0.16);
            border: 1px solid rgba(59, 130, 246, 0.45);
            color: #60a5fa;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 3px 8px;
            border-radius: 12px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .status-badge.live {
            background-color: #ef4444;
            border-color: #ef4444;
            color: #ffffff;
            animation: blink 1.2s infinite ease-in-out;
        }

        .status-badge.completed {
            background-color: #10b981;
            border-color: #10b981;
            color: #ffffff;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 16px 0;
        }

        .venue {
            font-size: 12px;
            color: #94a3b8;
        }

        .last-ball-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #94a3b8;
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 20px;
            border: 1px solid #334155;
        }

        .ball-circle {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 18px;
            height: 18px;
            background: #38bdf8;
            color: #0b0f19;
            font-weight: 700;
            border-radius: 50%;
            font-size: 11px;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .team-details {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .team-logo {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #1e293b;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .team-name {
            font-size: 15px;
            font-weight: 600;
            color: #e2e8f0;
        }

        .team-score {
            text-align: right;
        }

        .runs {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        .overs {
            font-size: 12px;
            color: #94a3b8;
        }

        /* Dynamic Status Box */
        .status-box {
            background-color: rgba(59, 130, 246, 0.08);
            border: 1px solid rgba(59, 130, 246, 0.25);
            color: #93c5fd;
            border-radius: 10px;
            padding: 10px;
            font-size: 13px;
            text-align: center;
            margin-top: 14px;
            line-height: 1.4;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .status-box.live {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.25);
            color: #f87171;
        }

        .status-box.completed {
            background-color: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.25);
            color: #38bdf8;
        }

        .footer-note {
            margin-top: 12px;
            font-size: 12.5px;
            color: #cbd5e1;
            font-weight: 500;
            text-align: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #232e42;
        }

        /* Bottom Full Scorecard Button */
        .btn-card {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            font-size: 13.5px;
            font-weight: 600;
            padding: 10px;
            border: none;
            border-radius: 10px;
            margin-top: 14px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s ease;
        }

        .btn-card:hover {
            background: #1d4ed8;
        }

        .btn-card:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="score-card">
        <!-- Top Commentary Button -->
        <div class="btn-commentary" onclick="window.location.href='go:commentary'">
            <div class="commentary-text">
                <span class="commentary-title">🎙️ Ball By Ball Commentary</span>
                <span class="commentary-sub">Listen to live audio coverage</span>
            </div>
            <span class="listen-badge">Listen Now</span>
        </div>

        <!-- Header -->
        <div class="card-header">
            <span class="match-info" id="match-info">India Women vs Hong Kong Women T20</span>
            <span class="status-badge" id="match-status">SCHEDULED</span>
        </div>

        <!-- Venue & Latest Ball -->
        <div class="sub-header">
            <span class="venue" id="venue-info">📍 Dubai International Cricket Stadium, Dubai</span>
            <div class="last-ball-badge" id="last-ball-container" style="display: none;">
                <span>Last Ball:</span>
                <span class="ball-circle" id="latest-ball">-</span>
            </div>
        </div>

        <!-- Team 1 -->
        <div class="team-row">
            <div class="team-details">
                <img class="team-logo" id="team-a-logo" src="" alt="" style="display: none;">
                <span class="team-name" id="team-a-name">India Women</span>
            </div>
            <div class="team-score">
                <div class="runs" id="team-a-runs">--</div>
                <div class="overs" id="team-a-overs"></div>
            </div>
        </div>

        <!-- Team 2 -->
        <div class="team-row">
            <div class="team-details">
                <img class="team-logo" id="team-b-logo" src="" alt="" style="display: none;">
                <span class="team-name" id="team-b-name">Hong Kong Women</span>
            </div>
            <div class="team-score">
                <div class="runs" id="team-b-runs">--</div>
                <div class="overs" id="team-b-overs"></div>
            </div>
        </div>

        <!-- Status Message -->
        <div class="status-box" id="status-box">
            Starts at 8:00 PM IST Today
        </div>

        <!-- Toss Details -->
        <div class="footer-note" id="toss-info" style="display: none;">
            Toss: -
        </div>

        <!-- Bottom Full Scorecard Button -->
        <button class="btn-card" onclick="window.location.href='go:card1'">
            Full Score Card
        </button>
    </div>

    <script>
        const matchId = "98315";
        let isMatchLive = false;

        // ভাৰতীয় সময় (IST) নিৰ্ধাৰণ কৰাৰ ফাংচন
        function getMatchISTTime(match) {
            let dateObj;
            if (match.date_start_ist) {
                dateObj = new Date(match.date_start_ist.replace(" ", "T") + "+05:30");
            } else if (match.timestamp_start) {
                dateObj = new Date(match.timestamp_start * 1000);
            } else if (match.date_start) {
                dateObj = new Date(match.date_start.replace(" ", "T") + "Z");
            }

            if (!dateObj || isNaN(dateObj.getTime())) return "8:00 PM IST";

            const timeStr = new Intl.DateTimeFormat('en-IN', {
                timeZone: 'Asia/Kolkata',
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            }).format(dateObj).toUpperCase();

            return `${timeStr} IST`;
        }

        async function fetchLiveScore() {
            const cloudflareProxyUrl = `https://cricvoice.aminurmarch.workers.dev/?matchId=${matchId}&_t=${Date.now()}`;

            try {
                const response = await fetch(cloudflareProxyUrl, { cache: "no-store" });
                if (!response.ok) return;

                const result = await response.json();
                
                if (result?.data?.length > 0) {
                    const match = result.data[0];
                    const live = match?.livescore;

                    if (!live) return;

                    // ১. মেচ টাইটেল
                    const subTitle = live.subtitle ? `${live.subtitle} • ` : '';
                    const shortTitle = live.short_title || match.short_title || live.title || 'IND-W vs HK-W T20';
                    document.getElementById("match-info").textContent = `${subTitle}${shortTitle}`;

                    // ২. মেচ ষ্টেটাছ নিৰ্ধাৰণ (Live / Completed / Scheduled)
                    const rawStatus = (live.status_str || live.game_state_str || match.status_str || "").toLowerCase();
                    const isCompleted = rawStatus.includes("complete") || rawStatus.includes("finish") || rawStatus.includes("ended") || live.status === 2;
                    const isLive = rawStatus.includes("live") || rawStatus.includes("in progress") || live.status === 3;

                    isMatchLive = isLive;

                    const statusBadge = document.getElementById("match-status");
                    const statusBox = document.getElementById("status-box");
                    const istTime = getMatchISTTime(live);
                    const venueName = (live.venue && live.venue.name) ? live.venue.name : "Dubai";

                    if (isCompleted) {
                        statusBadge.textContent = "COMPLETED";
                        statusBadge.className = "status-badge completed";
                        statusBox.className = "status-box completed";
                        statusBox.textContent = live.status_note || live.result || "Match Finished";
                    } else if (isLive) {
                        statusBadge.textContent = "LIVE";
                        statusBadge.className = "status-badge live";
                        statusBox.className = "status-box live";
                        statusBox.textContent = live.status_note || live.live || live.equation || "Match in progress";
                    } else {
                        statusBadge.textContent = "SCHEDULED";
                        statusBadge.className = "status-badge";
                        statusBox.className = "status-box";
                        statusBox.textContent = `${live.subtitle || "T20"} • Starts at ${istTime} Today (${venueName})`;
                    }

                    // ৩. ভেনিউ
                    if (live.venue) {
                        const loc = live.venue.location ? `, ${live.venue.location}` : (live.venue.country ? `, ${live.venue.country}` : '');
                        document.getElementById("venue-info").textContent = `📍 ${venueName}${loc}`;
                    }

                    // ৪. সৰ্বশেষ বল (Last Ball)
                    const lastBallContainer = document.getElementById("last-ball-container");
                    if (isLive && match.latest_ball_score !== undefined && match.latest_ball_score !== null && match.latest_ball_score !== "") {
                        document.getElementById("latest-ball").textContent = match.latest_ball_score;
                        lastBallContainer.style.display = "flex";
                    } else {
                        lastBallContainer.style.display = "none";
                    }

                    // ৫. Team A (India Women)
                    if (live.teama) {
                        document.getElementById("team-a-name").textContent = live.teama.name || "India Women";
                        
                        const logoA = document.getElementById("team-a-logo");
                        if (live.teama.logo_url) {
                            logoA.src = live.teama.logo_url;
                            logoA.alt = live.teama.short_name || "";
                            logoA.style.display = "block";
                        }
                        
                        document.getElementById("team-a-runs").textContent = live.teama.scores || live.teama.scores_full || "--";
                        document.getElementById("team-a-overs").textContent = live.teama.overs ? `(${live.teama.overs} ov)` : "";
                    }

                    // ৬. Team B (Hong Kong Women)
                    if (live.teamb) {
                        document.getElementById("team-b-name").textContent = live.teamb.name || "Hong Kong Women";
                        
                        const logoB = document.getElementById("team-b-logo");
                        if (live.teamb.logo_url) {
                            logoB.src = live.teamb.logo_url;
                            logoB.alt = live.teamb.short_name || "";
                            logoB.style.display = "block";
                        }
                        
                        document.getElementById("team-b-runs").textContent = live.teamb.scores || live.teamb.scores_full || "--";
                        document.getElementById("team-b-overs").textContent = live.teamb.overs ? `(${live.teamb.overs} ov)` : "";
                    }

                    // ৭. টছৰ বিৱৰণ
                    const tossEl = document.getElementById("toss-info");
                    if (live.toss && live.toss.text) {
                        tossEl.textContent = `Toss: ${live.toss.text}`;
                        tossEl.style.display = "block";
                    } else {
                        tossEl.style.display = "none";
                    }
                }
            } catch (error) {
                console.error("Error fetching live score:", error);
            } finally {
                const nextInterval = isMatchLive ? 5000 : 15000;
                setTimeout(fetchLiveScore, nextInterval);
            }
        }

        fetchLiveScore();
    </script>
</body>
</html>
