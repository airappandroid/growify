<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>France Radio Home</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 16px;
        }
        h2 {
            font-size: 18px;
            color: #38bdf8;
            margin-top: 24px;
            margin-bottom: 12px;
            font-weight: 700;
        }
        h2:first-of-type {
            margin-top: 5px;
        }

        /* 1. Popular Stations Styling */
        .station-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .station-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #ffffff;
        }
        .station-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .station-logo {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            color: #ffffff;
            text-align: center;
        }
        
        /* Photo Matching Colors */
        .bg-inter { background-color: #e11d48; }
        .bg-info { background-color: #eab308; color: #000000; font-weight: 800; }
        .bg-ici { background-color: #3b82f6; }
        .bg-culture { background-color: #7c3aed; }
        .bg-musique { background-color: #be123c; }
        .bg-mouv { background-color: #10b981; color: #000000; font-weight: 800; }

        .station-name {
            font-size: 15px;
            font-weight: 600;
        }
        .play-btn {
            background-color: #0284c7;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        /* 2. Categories Styling */
        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .category-card {
            background: linear-gradient(135deg, #1e293b, #334155);
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 18px 12px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .category-icon {
            font-size: 26px;
        }
        .category-title {
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- SECTION 1: POPULAR STATIONS -->
    <h2>🔥 Popular Stations</h2>
    <div class="station-list">
        
        <!-- France Inter -->
        <a href="go:S1" class="station-card">
            <div class="station-left">
                <div class="station-logo bg-inter">inter</div>
                <span class="station-name">France Inter</span>
            </div>
            <span class="play-btn">Play ▶</span>
        </a>

        <!-- franceinfo -->
        <a href="go:S2" class="station-card">
            <div class="station-left">
                <div class="station-logo bg-info">info</div>
                <span class="station-name">franceinfo</span>
            </div>
            <span class="play-btn">Play ▶</span>
        </a>

        <!-- HERE (ici) -->
        <a href="go:S3" class="station-card">
            <div class="station-left">
                <div class="station-logo bg-ici">ici</div>
                <span class="station-name">HERE (ici)</span>
            </div>
            <span class="play-btn">Play ▶</span>
        </a>

        <!-- France Culture -->
        <a href="go:S4" class="station-card">
            <div class="station-left">
                <div class="station-logo bg-culture">culture</div>
                <span class="station-name">France Culture</span>
            </div>
            <span class="play-btn">Play ▶</span>
        </a>

        <!-- France Musique -->
        <a href="go:S5" class="station-card">
            <div class="station-left">
                <div class="station-logo bg-musique">musique</div>
                <span class="station-name">France Musique</span>
            </div>
            <span class="play-btn">Play ▶</span>
        </a>

        <!-- Mouv' -->
        <a href="go:S6" class="station-card">
            <div class="station-left">
                <div class="station-logo bg-mouv">MOUV'</div>
                <span class="station-name">Mouv'</span>
            </div>
            <span class="play-btn">Play ▶</span>
        </a>

    </div>

   

</body>
</html>
